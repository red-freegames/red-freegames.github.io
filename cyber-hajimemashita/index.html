<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<body>
<div id="wrap">
  <nav class="topnav"><button id="btnHome" onclick="G.home()">🏠 HOME</button><a href="https://red-freegames.github.io/">🎮 他のゲームを見る</a></nav>
  <div id="hud">
    <div class="hrow">
      <div>💴 所持金<b id="hMoney">0</b></div>
      <div>📈 売上<b id="hRev">0</b></div>
      <div>⏱ 作業時間<b id="hTime">0:00</b></div>
      <div>🧠 スキル<b>0</b></div>
    </div>
    <div class="trace">🦶 足跡<div class="tbar"><div class="tfill" id="hTrace"></div></div><span id="hTraceN">0%</span></div>
  </div>
  <main id="view"></main>
</div>

<script>
"use strict";
const GAME_URL = "https://red-freegames.github.io/cyber-hajimemashita/";
const $ = id => document.getElementById(id);
const yen = n => (n < 0 ? "-¥" : "¥") + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const man = n => {
  n = Math.round(n);
  if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "億円";
  if (Math.abs(n) >= 1e4) return Math.round(n / 1e4).toLocaleString("ja-JP") + "万円";
  return n.toLocaleString("ja-JP") + "円";
};
const fmtT = s => { s = Math.floor(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fmtTj = s => { s = Math.round(s); const m = Math.floor(s / 60); return (m ? m + "分" : "") + (s % 60) + "秒"; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= state ================= */
let S;
function fresh() {
  S = { money: 15000, debt: 0, rev: 0, trace: 0, time: 0, timerOn: false,
        done: {}, res: {}, victims: 0, spent: 0, codeLines: 0, early: false, quiz: {} };
}
fresh();
setInterval(() => { if (S.timerOn) { S.time += 0.25; hud(); } }, 250);

function hud() {
  $("hMoney").textContent = man(S.money);
  $("hRev").textContent = man(S.rev);
  $("hTime").textContent = fmtT(S.time);
  const t = Math.min(100, Math.round(S.trace));
  $("hTrace").style.width = t + "%";
  $("hTraceN").textContent = t + "%";
}
function showHud(on) { $("hud").classList.toggle("on", on); }
function setBody(cls) { document.body.className = cls || ""; }
function render(html) {
  const v = $("view");
  v.innerHTML = html;
  v.classList.remove("fadein"); void v.offsetWidth; v.classList.add("fadein");
  window.scrollTo(0, 0);
}
function pay(n) {
  S.spent += n;
  S.money -= n;
  if (S.money < 0) { S.debt += -S.money; S.money = 0; return true; }
  return false;
}

function runLogLine() {
  const i = cur.i;
  if (i === 0) {

function runTick(now) {
  if (!run || run.over) return;
  const m = cur.m;
  const el = (now - run.t0) / 1000;
  const p = Math.min(1, el / m.dur);
  $("pg").style.width = (p * 100) + "%";
  const total = cur.i === 0 ? cur.scale.n : cur.i === 1 ? cur.scale.n : cur.scale.devices;
  $("rc").textContent = Math.floor(total * p).toLocaleString();
  if (now - run.logT > 90) {
    run.logT = now;
    const lg = $("rlog");
    lg.textContent = (lg.textContent + runLogLine() + "\n").split("\n").slice(-22).join("\n");
  }
  if (el < m.dur - 0.8 && now - run.lastSpawn > m.spawn * rnd(0.7, 1.2)) {
    run.lastSpawn = now; spawnAlert();
  }
  if (p >= 1) { run.over = true; run.alive.forEach(a => a.remove()); return runEnd(); }
  requestAnimationFrame(runTick);
}
function spawnAlert() {
  const m = cur.m, rb = $("rb");

  a.innerHTML = `⚠ ${pick(m.alerts)}<small>タップで回避</small><div class="lf"></div>`;

  a.style.top = rnd(6, 74) + "%";

  const lf = a.querySelector(".lf");
  lf.style.width = "100%";
  lf.style.transition = `width ${m.life}ms linear`;
  requestAnimationFrame(() => requestAnimationFrame(() => lf.style.width = "0%"));
  run.alive.add(a);
  const kill = (ok) => {
    if (!run.alive.has(a)) return;
    run.alive.delete(a);
    if (ok) {
      run.dodged++;
      const f = document.createElement("div");
      f.className = "float"; f.textContent = "✓ " + m.dodge;
      f.style.left = a.style.left; f.style.top = a.style.top;
      rb.appendChild(f); setTimeout(() => f.remove(), 800);
    } else {
      run.missed++;
      addTrace(m.alertTrace);
      rb.classList.remove("shake"); void rb.offsetWidth; rb.classList.add("shake");
    }
    a.remove();
    $("rd").textContent = run.dodged; $("rm").textContent = run.missed;
  };
  a.addEventListener("pointerdown", e => { e.preventDefault(); kill(true); });
  setTimeout(() => kill(false), m.life);
}

};

/* ---------- ending ---------- */
G.arrest = async () => {
  S.timerOn = false; showHud(false); setBody("alarm");
  render(`<div class="end" style="padding-top:20vh;text-align:center">
    <div class="siren"></div>
    <h1 id="a1" style="opacity:0;transition:opacity 1s">午前6時。<br>インターホンが鳴った。</h1>
    <p class="lead" id="a2" style="opacity:0;transition:opacity 1s">「警察です。開けてください」</p>
    <div id="a3"></div>
  </div>`);
  await sleep(400); $("a1").style.opacity = 1;
  await sleep(1600); $("a2").style.opacity = 1;
  await sleep(1500);
  $("a3").innerHTML = `<button class="cta" style="margin-top:30px;background:#ff3b3b;box-shadow:0 5px 0 #8a1212" onclick="G.report()">ドアを開ける</button>`;
};

G.report = () => {
  setBody(""); showHud(false);
  const crimes = [];
  M.filter(m => S.done[m.id]).forEach(m => {
    let cs = m.crimes;
    if (m.id === "voice" && !S.res.voice.ok) cs = [["詐欺未遂罪", "なりすましでの送金依頼"], cs[1]];
    cs.forEach(c => { if (!crimes.find(x => x[0] === c[0])) crimes.push(c); });
  });
  const cut = Math.round(S.rev * 0.7);
  const reason = S.early
    ? "足跡を残しすぎた。偽サイトの契約、口座の記録、通信の履歴。警察がたどるのに、時間はかからなかった。"
    : "足跡は少なかった。でも、先に捕まった「リク」のスマホに、あなたとのやりとりがすべて残っていた。";
  const tag = S.early ? "足跡だらけの素人" : S.rev >= 3e7 ? "使い捨ての大物" : "替えのきく歯車";
  S.tag = tag;
  render(`<div class="end">
    <div class="siren"></div>
    <h1>あなたは逮捕された。</h1>
    <div class="stamp">${tag}</div>
    <p class="lead">${reason}<br>「スキル不要」で雇われるというのは、<b>いつでも替えがきく</b>ということだった。</p>

    <div class="dark">
      <div class="hero"><div class="l">あなたが犯罪に使った時間</div><div class="n">${fmtTj(S.time)}</div></div>
      <div class="trio">
        <div><b>0行</b><small>書いたコード</small></div>
        <div><b>${S.victims.toLocaleString()}</b><small>被害を受けた人</small></div>
        <div><b>${Object.keys(S.done).length}/4</b><small>実行した手口</small></div>
      </div>
    </div>

    <div class="dark">
      <h2>💴 お金はどこへ消えたか</h2>
      <div class="kv"><span>売上の合計</span><b>${man(S.rev)}</b></div>
      <div class="kv"><span>リクへの送金（取り分70%）</span><b>-${man(cut)}</b></div>
      <div class="kv"><span>ツール・名簿・侵入口の購入費</span><b>-${man(S.spent)}</b></div>
      <div class="kv"><span>残りは押収</span><b>没収</b></div>
      ${S.debt ? `<div class="kv"><span>リクからの「立て替え」</span><b style="color:#ff8f8f">${man(S.debt)}の借金</b></div>` : ""}
      <div class="kv"><span>被害者からの損害賠償請求</span><b style="color:#ff8f8f">これから</b></div>
      <div class="kv" style="border:0"><span>あなたの手元に残ったもの</span><b style="font-size:18px">¥0</b></div>
    </div>

    <div class="dark">
      <h2>⚖️ 問われうる罪</h2>
      ${crimes.map(c => `<div class="crime">${c[0]}<small>${c[1]}</small></div>`).join("")}
      <p class="fine" style="margin-top:10px">いずれも拘禁刑を含む重い罪です。実際に、SNSの「高収入バイト」から加わった若者や、生成AIで不正なプログラムを作った人が逮捕される事件が国内で相次いでいます。</p>
    </div>

    <div class="dark">
      <h2>📰 これはゲームの中だけの話じゃない</h2>
      <div class="crime">フィッシングの報告件数：2024年に<b>約171万件</b><small>フィッシング対策協議会（概数）</small></div>
      <div class="crime">ランサムウェア被害の警察への報告：2024年に<b>222件</b><small>警察庁</small></div>
      <div class="crime">ビデオ会議の全員がディープフェイク、<b>約38億円</b>の被害（2024年・香港）<small>各社報道（当時の換算・概数）</small></div>
      <div class="crime">証券口座の乗っ取りと不正売買が急増（2025年）<small>金融庁が注意喚起</small></div>
      <div class="crime">生成AIでランサムウェアを作ったとして逮捕（2024年・国内）<small>各社報道</small></div>
      <p class="fine" style="margin-top:10px">攻撃する側は、AIと「サービス」でどんどん簡単になっています。でも、守る側の基本も、実はとても簡単です。</p>
    </div>

    <button class="cta" style="margin-top:18px;background:linear-gradient(135deg,#2fe3a5,#1fb6ff);box-shadow:0 5px 0 #0b7a5a" onclick="G.quiz()">🛡 次は、守る側へ。<br><small style="font-size:12px">あなたに効く攻撃はどれ？ 30秒診断</small></button>
  </div>`);
};

const QZ = [
  { q: "SMSやメールのリンクから、ログインやカード入力をしたことがある", bad: "yes", m: [0] },
  { q: "同じパスワード（や少し変えただけのもの）を、複数のサイトで使っている", bad: "yes", m: [1] },
  { q: "よく使うサービスで、二段階認証やパスキーを設定している", bad: "no", m: [0, 1] },
  { q: "家族や上司から急な送金を頼まれたら、一度切って折り返して確かめる", bad: "no", m: [2] },
  { q: "スマホやPCの更新の通知は、すぐに当てている", bad: "no", m: [3] },
  { q: "大事な写真やデータのバックアップを、別の場所に取っている", bad: "no", m: [3] },
];
G.quiz = () => {
  setBody("");
  S.quiz = {};
  render(`<div class="end">
    <h1 style="font-size:22px">🛡 守る側の30秒診断</h1>
    <p class="lead" style="font-size:13.5px;line-height:1.8;color:#c9cde0">正直に答えてください。結果は、あなたの端末の中だけで表示されます。</p>
    ${QZ.map((x, k) => `<div class="q"><p>${k + 1}. ${x.q}</p><div class="yn">
      <button id="q${k}y" onclick="G.ans(${k},'yes')">はい</button><button id="q${k}n" onclick="G.ans(${k},'no')">いいえ</button></div></div>`).join("")}
    <button class="cta" id="qgo" disabled style="margin-top:16px" onclick="G.verdict()">診断する</button>
  </div>`);
};
G.ans = (k, a) => {
  S.quiz[k] = a;
  const bad = QZ[k].bad === a;
  ["y", "n"].forEach(s => $(`q${k}${s}`).className = "");
  const b = $(`q${k}${a === "yes" ? "y" : "n"}`);
  b.className = "sel" + (bad ? " bad" : "");
  $("qgo").disabled = Object.keys(S.quiz).length < QZ.length;
};
G.verdict = () => {
  const hit = [false, false, false, false];
  QZ.forEach((x, k) => { if (S.quiz[k] === x.bad) x.m.forEach(i => hit[i] = true); });
  const nHit = hit.filter(Boolean).length;
  const fix = [
    "リンクからは開かず、公式アプリやブックマークから。二段階認証・パスキーを設定",
    "パスワード管理アプリで全部ちがうパスワードに。二段階認証・パスキーも",
    "お金の話は、切ってから自分で折り返す。家族で合言葉を決める",
    "更新はすぐ当てる。大事なデータは別の場所にバックアップ",
  ];
  const head = nHit === 0 ? "あなたは、手強い。" : nHit <= 2 ? `あなたに効く攻撃は、${nHit}つ。` : `あなたに効く攻撃は、${nHit}つ。`;
  const sub = nHit === 0 ? "今日あなたが使った手口は、どれもあなたには通じにくい。家族にも同じことを教えてあげてください。" : "でも、どれも今日から5分で塞げます。";
  S.nHit = nHit;
  const text = `スキル0・コード0行で、${fmtTj(S.time)}のうちに${S.victims.toLocaleString()}人を被害者にした。そして逮捕された。【${S.tag}】\n守る側の診断では、私に効く攻撃は${nHit}/4つ。\n#サイバー犯罪はじめました`;
  render(`<div class="end">
    <h1 style="font-size:24px">${head}</h1>
    <p class="lead" style="font-size:14px;line-height:1.85;color:#c9cde0">${sub}</p>
    <div class="verdict">
      ${M.map((m, i) => `<div class="row"><span class="m ${hit[i] ? "ng" : "ok"}">${hit[i] ? "効く" : "強い"}</span><div>${m.icon} ${m.cat}<small>${hit[i] ? "👉 " + fix[i] : "この手口には強い状態です"}</small></div></div>`).join("")}
    </div>
    <div class="dark">
      <h2>今日から5分でできること</h2>
      <div class="crime">① よく使うサービスに<b>二段階認証・パスキー</b>を設定</div>
      <div class="crime">② <b>パスワードの使い回し</b>をやめる（管理アプリを使う）</div>
      <div class="crime">③ SMS・メールのリンクからは<b>ログインしない</b></div>
      <div class="crime">④ お金の依頼は<b>折り返して確認</b>、家族で<b>合言葉</b></div>
      <div class="crime">⑤ <b>更新はすぐ当てる</b>、大事なデータは<b>バックアップ</b></div>
      <p class="fine" style="margin-top:10px">困ったときは、警察の相談窓口「#9110」や、消費者ホットライン「188」に相談できます。</p>
    </div>
    <div class="share">
      <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(GAME_URL)}" target="_blank" rel="noopener">𝕏 結果をポスト</a>
      <button onclick="G.again()">もう一度</button>
    </div>
    <p class="fine">このゲームはフィクションです。登場するサービス・人物・価格・会話はすべて架空で、実際の攻撃手順は含みません。統計は公表資料・報道をもとにした概数です。<br>実況・配信・動画投稿・収益化OK ／ <a href="https://red-freegames.github.io/">RED FREE GAMES</a> の他のゲームで遊ぶ</p>
  </div>`);
};
G.again = () => { fresh(); title(); };

window.G = G;
hud();
title();
</script>

名度の割に伊勢神宮という全国区の目的地がある、という定番の感想。"}],"空気感":[{"text":"海風が気持ちよくて、温暖な感じだった","why":"伊勢湾・志摩半島に面して比較的温暖。太平洋側共通の感想でもある。"},{"text":"参拝の街は朝が早くて、空気がピリッとしてた","why":"伊勢神宮の早朝参拝の空気感。門前町は朝から動き出す。"},{"text":"山の方に行くと急に涼しくて、霧っぽかった","why":"鈴鹿山脈や紀伊山地は霧が出やすく、平野部と空気が変わる。"},{"text":"のんびりした港町の空気が良かったなあ","why":"鳥羽・志摩の港町の雰囲気。"},{"text":"都会すぎず田舎すぎず、ちょうどいい感じだった","why":"四日市・津・松阪と中規模都市が並ぶ県の印象。"}],"景色":[{"text":"入り組んだ湾の景色が綺麗だった。島も多かったよ","why":"志摩半島・英虞湾のリアス海岸と島々が代表的な景色。"},{"text":"田園風景の中に大きな川がゆったり流れてた","why":"木曽三川や宮川など、大きな河川と平野の風景。"},{"text":"山が連なってて、紅葉の谷が深かった","why":"赤目四十八滝や香肌峡など、三重の山間部の景色。"},{"text":"湾に夕日が沈むのが綺麗だったなあ","why":"英虞湾の夕景は有名。入り組んだ湾ならではの眺め。"},{"text":"真珠の養殖いかだが浮かぶ、静かな入り江を見た","why":"英虞湾は真珠養殖の発祥地。養殖いかだが浮かぶ景色が特徴。"}],"お土産":[{"text":"白いお餅に茶色いあんがたっぷりのったお菓子、柔らかかった","why":"赤福。餅の上にこし餡をのせた伊勢名物で、三重土産の王道。"},{"text":"平べったくて長いお餅に、あんこが入ったやつを買った","why":"なが餅。四日市の名物で、細長い形が特徴。"},{"text":"焼き目が香ばしい、平たいお餅のお菓子にした","why":"へんば餅。宮川沿いの名物で、表面の焼き目と素朴な甘さが特徴。"},{"text":"海老の味が濃い、薄焼きのせんべいにしたよ","why":"伊勢海老を使ったせんべい類は、志摩の海の幸土産の定番。"},{"text":"真珠みたいに白くて丸い、小さいお菓子が可愛かった","why":"真珠の産地・志摩らしいモチーフの土産菓子。真珠や貝を模した菓子が多い。"}],"移動":[{"text":"名古屋から電車で1時間半くらいだった","why":"近鉄で名古屋〜伊勢市は約1時間20分。三重は中部圏からのアクセスが中心。"},{"text":"東京からは、新幹線と特急を乗り継いで行ったよ","why":"東京→名古屋は新幹線、そこから近鉄特急というのが王道ルート。"},{"text":"関西からも名古屋からも行ける、中間みたいな場所だった","why":"三重は近畿圏にも中部圏にも属する感覚があり、両方からアクセスできる。"},{"text":"県内を縦に移動したら、結構時間かかった","why":"南北に長い県で、伊賀から東紀州までかなりの距離がある。"},{"text":"帰りの特急は、窓から海が見える区間があった","why":"近鉄の伊勢志摩方面の特急は、伊勢湾沿いを走る区間がある。"}],"過ごし方":[{"text":"早朝にお参りして、参道のお店で食べ歩きした","why":"伊勢神宮の早朝参拝と、おはらい町・おかげ横丁の食べ歩きが定番。"},{"text":"真珠の養殖場みたいな場所を見学したよ","why":"志摩は真珠養殖の発祥地で、養殖の見学施設がある。"},{"text":"水族館で海の生き物をたくさん見た","why":"鳥羽水族館は飼育種類数が国内最大級で知られる。"},{"text":"忍者の里みたいな場所で、手裏剣体験をした","why":"伊賀は伊賀流忍者の里で、忍者体験施設がある。"},{"text":"温泉に入って、海の幸の夕食を食べた","why":"鳥羽・志摩の温泉旅館の定番の過ごし方。"}],"名所":[{"text":"日本で一番格式が高いと言われる神社。森が深くて空気が違った","why":"伊勢神宮。内宮の宇治橋と深い神苑の森が印象的。"},{"text":"海の中に、注連縄で結ばれた二つの岩が立ってた","why":"二見興玉神社の夫婦岩。大小二つの岩が注連縄で結ばれている。"},{"text":"真珠で有名な会社の、記念館みたいな小さい島に行った","why":"ミキモト真珠島。真珠養殖の歴史が学べる島。"},{"text":"忍者のからくりがある屋敷を見学したよ","why":"伊賀流忍者博物館の忍者屋敷。からくり仕掛けの実演が見られる。"},{"text":"入り組んだ湾を見下ろす展望台から、島々を眺めた","why":"横山展望台から見る英虞湾。リアス海岸の絶景スポット。"}],"食":[{"text":"伊勢うどんを食べた。太くて柔らかくてびっくりした","why":"伊勢うどんは極太で柔らかい麺と濃いタレが特徴の郷土食。"},{"text":"松阪牛のすき焼き、奮発しちゃった","why":"松阪牛は三重が誇るブランド和牛。すき焼きが定番の食べ方。"},{"text":"手こね寿司を食べたよ。漬けマグロが乗ってた","why":"手こね寿司は志摩の漁師飯がルーツの郷土料理。"},{"text":"伊勢海老のお味噌汁が豪華だった","why":"伊勢海老は志摩の名産。味噌汁や鬼殻焼きで供される。"},{"text":"あおさのお味噌汁がやたら美味しかった","why":"あおさ（ヒトエグサ）の生産は三重県が全国トップクラス。"}]}},{"name":"滋賀県","region":"関西","tier":3,"souvenir":"クラブハリエのバームクーヘン","hints":{"第一印象":[{"text":"水辺の景色が印象に残る土地だった","why":"第一印象の段階では地域すら決めつけられない、よくある旅の感想。"},{"text":"隣の有名な古都のついでに行ったら、思ったより見どころあった","why":"第一印象は弱めのヒント。絞り込みは次の空気感以降で。"},{"text":"落ち着いてて、観光客も京都ほどじゃなかった","why":"大津・彦根は京都に比べて穏やかな観光地。"},{"text":"水辺の風景がずっと続く旅だったなあ","why":"琵琶湖を巡る旅程になりやすい県。"},{"text":"歴史の舞台らしい場所が多かった気がする","why":"近江は戦国大名ゆかりの地や古戦場が多い。"}],"空気感":[{"text":"湖の風が涼しくて、水の匂いがした","why":"琵琶湖沿岸ならではの空気感。"},{"text":"京都に近いのに、空気がのんびりしてた","why":"大津は京都から近いが、雰囲気はぐっと落ち着く。"},{"text":"朝もやの湖が幻想的だったなあ","why":"琵琶湖の朝霧は名物。"},{"text":"城下町が静かで、散歩にちょうどよかった","why":"彦根や近江八幡の城下町の空気。"},{"text":"山と湖に挟まれた、盆地みたいな空気だった","why":"近江盆地は琵琶湖を中心に山々に囲まれている。"}],"景色":[{"text":"日本で一番大きい湖を、ぐるっと回るような景色だった","why":"琵琶湖は日本最大の湖で、県面積の約6分の1を占める。"},{"text":"湖に浮かぶ小さい島が見えたよ","why":"沖島や竹生島など、琵琶湖には有人島・無人島がある。"},{"text":"湖の向こうに、雪をかぶった山並みが見えた","why":"比良山地など湖西の山々が湖の向こうに連なる。"},{"text":"水路が張り巡らされた、古い町並みと水辺の景色","why":"近江八幡の八幡堀など、水郷の景色が残る。"},{"text":"田んぼと湖と山が、のどかに続いてた","why":"湖東平野の田園風景が滋賀らしい。"}],"お土産":[{"text":"年輪みたいな層の焼き菓子、しっとりしてて美味しかった","why":"クラブハリエのバームクーヘン。近江八幡に本拠を置く洋菓子店の名物。"},{"text":"鮒を使った発酵したお寿司、クセが強かった","why":"鮒寿司。琵琶湖の郷土食で、発酵食品好き向けの土産。"},{"text":"赤いこんにゃくが名物って聞いて、買ってみた","why":"赤こんにゃくは近江八幡の名物。赤い色が特徴。"},{"text":"丁字の形をしたお麩の乾物にしたよ","why":"丁子麩は近江の伝統食材で、精進料理にも使われる。"},{"text":"湖の小さい魚の佃煮、甘辛くて美味しかった","why":"小鮎やえび豆など、琵琶湖の湖魚の佃煮類が定番土産。"}],"移動":[{"text":"京都から電車で10分ちょっとで着いた","why":"京都〜大津はJRで約10分。県の入口が京都に極めて近い。"},{"text":"東京からは新幹線で、京都の手前で降りる感じだった","why":"米原が東海道新幹線の停車駅。東京目線では京都の手前。"},{"text":"湖を一周する電車の旅もできるらしいよ","why":"JR湖西線 "川と山に挟まれた渓谷が綺麗だった","why":"保津峡や貴船・鞍馬の渓谷の景色。"},{"text":"紅葉の山が、街のすぐ後ろに迫ってた","why":"東山・北山など、三方の山に囲まれた京都盆地の地形。"},{"text":"松の並木が海に弧を描く景色は、遠くて断念した","why":"天橋立は府北部の日本海側。京都市内からは距離がある。"}],"お土産":[{"text":"シナモンの香りの、柔らかい三角のお餅みたいなお菓子","why":"生八ツ橋。ニッキの香りと三角形の形が特徴の京都土産の王道。"},{"text":"薄くてパリパリの、シナモン味の焼き菓子にした","why":"八ツ橋。生八ツ橋の元になった堅焼きの煎餅菓子。"},{"text":"抹茶味のチョコが挟まった、細長いクッキーみたいなやつ","why":"宇治抹茶のラングドシャ系土産。抹茶チョコを挟んだ焼き菓子が定番。"},{"text":"漬物の種類が豊富で、紫蘇の香りのやつを買った","why":"しば漬けは大原の名物漬物。京漬物は土産の定番ジャンル。"},{"text":"もちもちした皮にあんこが入った、半月形のお菓子","why":"阿闍梨餅。半月形とモチモチした食感が特徴の京菓子。"}],"移動":[{"text":"東京から新幹線で2時間ちょっとだった","why":"東海道新幹線で東京〜京都は約2時間15分。"},{"text":"奈良から電車で30〜40分くらいだったよ","why":"京都〜奈良はJR・近鉄で約35〜45分。奈良とセットで語られやすい近さ。"},{"text":"大阪からは電車で30分くらい","why":"大阪〜京都はJR新快速で約30分。関西の都市間は近い。"},{"text":"市内はバス移動がメインで、結構混んでた","why":"京都市内の観光はバスが主軸で、混雑しやすい。"},{"text":"関西の空港からバスで来てる人も多かった","why":"関西国際空港〜京都はリムジンバスで約1時間半。"}],"過ごし方":[{"text":"着物をレンタルして、石畳の坂を歩いたよ","why":"清水坂・産寧坂周辺の定番体験。着物レンタル散策が盛ん。"},{"text":"川沿いで夕涼みしながら、ご飯を食べた","why":"鴨川沿いの納涼床や、川辺でのんびりする文化。"},{"text":"抹茶の甘いものを何軒もはしごした","why":"宇治抹茶のスイーツ巡りは京都観光の定番。"},{"text":"お寺で座禅体験をしたよ","why":"妙心寺など、座禅体験ができる寺院がある。"},{"text":"夕方の花街を歩いたら、舞妓さんらしい人を見かけた","why":"祇園の花街散策。夕方に舞妓を見かけることがある。"}],"名所":[{"text":"金色に光る建物が、池に映ってた","why":"金閣寺（鹿苑寺）。池に映る金色の舎利殿が象徴。奈良にはない華やかさが京都の差別化。"},{"text":"赤い鳥居が、トンネルみたいに延々と続く神社","why":"伏見稲荷大社の千本鳥居。山全体に鳥居が続く。"},{"text":"高い木の舞台みたいな場所から、街を見下ろした","why":"清水寺の清水の舞台。懸造りの舞台が名物。"},{"text":"五重塔がシンボルのお寺の前を、坂道が登ってた","why":"法観寺（八坂の塔）と八坂道。ただし奈良にも五重塔があるので、他のヒントと併せて判断する。"},{"text":"屋根のある古い木の橋を渡った。川と山が綺麗だった","why":"嵐山の渡月橋。桂川と嵐山を望む木橋。"}],"食":[{"text":"湯葉のコースを食べた。京料理って感じだった","why":"湯葉は京都の代表的な京食材で、寺院の多い土地柄とも結びつく。"},{"text":"抹茶のパフェ、行列に並んで食べたよ","why":"宇治抹茶のスイーツは京都観光の定番。"},{"text":"にしんそばを食べた。甘いにしんが意外と合う","why":"にしんそばは京都発祥とされる名物そば。"},{"text":"鱧の落としを食べた。夏の味だね","why":"鱧は京都の夏の風物詩で、祇園祭は鱧祭りとも呼ばれる。"},{"text":"おばんざいの定食が、優しい味だった","why":"おばんざいは京都の家庭料理の総称。"}]}},{"name":"大阪府","region":"関西","tier":1,"souvenir":"551蓬莱の豚まん","hints":{"第一印象":[{"text":"人が明るくて、街のエネルギーがすごかった","why":"商人の街らしい活気が、第一印象になりや :[{"text":"酒粕の香りが強い、瓜のお漬物にした","why":"奈良漬。酒粕漬けの代表的な奈良土産。"},{"text":"よもぎのお餅、すごい速さでつく実演を見て買った","why":"中谷堂のよもぎ餅。高速餅つきの実演で有名。"},{"text":"大仏様の絵が描かれたカップ入りのプリンにした","why":"まほろば大仏プリン本舗の大仏プリン。奈良らしい土産菓子。"},{"text":"鹿の形をしたお菓子を、いくつか買ったよ","why":"鹿モチーフの土産菓子は奈良の定番。"},{"text":"葛を使った、ぷるぷるの和菓子にした","why":"吉野葛を使った葛餅など、奈良の伝統素材の土産。"}],"移動":[{"text":"京都から電車で30〜40分くらいだった","why":"京都〜奈良はJR・近鉄で約35〜45分。京都と混同しやすい近さでもある。"},{"text":"大阪からも電車で40分くらいだったよ","why":"大阪難波〜近鉄奈良は快速急行で約40分。"},{"text":"東京からは、新幹線で京都経由が王道だった","why":"奈良県内に新幹線駅はなく、京都乗り換えが基本ルート。"},{"text":"県の南の方は山が深くて、車じゃないと大変だった","why":"吉野・十津川方面は鉄道がなく、バスや車での移動になる。"},{"text":"空港からはバスで1時間くらいだった","why":"関西国際空港・伊丹空港から奈良へはリムジンバスで約1時間〜1時間半。"}],"過ごし方":[{"text":"公園で鹿におせんべいをあげたよ","why":"奈良公園の鹿せんべい体験。奈良の実質的な決め手級の過ごし方。"},{"text":"お寺を何軒も歩いて回って、御朱印も集めた","why":"東大寺・興福寺・春日大社など、寺社巡りが中心になる。"},{"text":"昔の都の跡の、広大な公園を歩いた","why":"平城宮跡歴史公園。広大な都の跡地を歩く体験。"},{"text":"山の温泉でのんびりしたよ","why":"洞川温泉など、吉野の山間の温泉地。"},{"text":"古い町家のカフェが並ぶ地区を回った","why":"ならまちの町家街区の散策。"}],"名所":[{"text":"すごく大きな大仏が座っているお堂を見た","why":"東大寺の大仏（盧舎那仏）。奈良の最大の象徴で、金色の建物が象徴の京都との決定的な差。"},{"text":"鹿がたくさんいる公園の中の、朱色の神社","why":"春日大社と奈良公園の鹿。藤原氏の氏神を祀る。"},{"text":"五重塔が街のシンボルになってるお寺","why":"興福寺の五重塔。京都にも五重塔があるため、鹿や大仏のヒントと併せて判断する。"},{"text":"世界最古級の木造建築があるお寺に行った","why":"法隆寺。現存する世界最古の木造建築群として知られる。"},{"text":"都の中心だった広大な跡地に、復元された大きな門があった","why":"平城宮跡の朱雀門・大極殿。往時の都の中心地。"}],"食":[{"text":"柿の葉で巻いたお寿司を食べたよ","why":"柿の葉寿司は奈良の郷土食。吉野地方の保存食がルーツ。"},{"text":"茶粥を食べた。素朴で優しい味だった","why":"茶粥は奈良の郷土料理。東大寺ゆかりとも言われる。"},{"text":"三輪そうめんを食べた。細くてツルツルだった","why":"三輪そうめんは奈良・三輪の名産で、細さが特徴。"},{"text":"よもぎ餅をその場で食べた。柔らかかったなあ","why":"中谷堂のよもぎ餅など、ならまちの名物。"},{"text":"葛切りに黒蜜をかけて食べた","why":"吉野葛の葛切りは奈良の代表的な甘味。"}]}},{"name":"和歌山県","region":"関西","tier":3,"souvenir":"かげろう","hints":{"第一印象":[{"text":"海と山と温泉、自然が濃い旅だった","why":"紀伊半島の自然そのものが県の主役。"},{"text":"思ったより遠くて、秘境感があったなあ","why":"紀伊半島の奥深さが印象に残りやすい。"},{"text":"修行の山って感じの、厳かな場所があった","why":"高野山や熊野など、信仰の山々がある県。"},{"text":"フルーツが美味しい土地だった","why":"第一印象はあえて一般的な感想に。ここだけでは候補はかなり広い。"},{"text":"のんびりした、南の海の町が良かった","why":"白浜・串本など、紀南の海の町の印象。"}],"空気感":[{"text":"南国っぽい海風で、温暖だった","why":"紀南は黒潮の影響で温暖な気候。"},{"text":"山のお寺の空気は、ピリッと厳かだった","why":"高野山の宗教的な空気感。"},{"text":"温泉街は湯けむりでのんびりしてた","why":"白浜温泉など、温泉地の多い県。"},{"text":"港町はマグロの町って感じで、活気があった","why":"那智勝浦は生マグロの水揚げ港として活気がある。"},{"text":"雨が多い土地らしく、緑が濃かった","why":"紀伊半島は日本有数の多雨地帯で、森林が深い。"}],"景色":[{"text":"白い砂浜とエメラルドの海が、南国みたいだった","why":"白浜の白良浜。白い砂と青い海のコントラストが名物。"},{"text":"円い小さい島に、夕日が沈む景色を見た","why":"串本の円月島の夕景。"},{"text":"落差が日本一って言われる、大きな滝が山の中にあった","why":"那智の滝。落差133mで、一段の滝として日本一とされる。"},{"text":"橋みたいな岩が、海に並んで立ってた","why":"串本の橋杭岩。海に直線状に並ぶ奇岩群。"},{"text":"深い渓谷を、舟でゆっくり下ったよ","why":"瀞峡の舟下り。吉野熊野国立公園の渓谷美。"}],"お土産":[{"text":"柚子の風味の、ふわっと軽い最中みたいなお菓子","why":"かげろう。白浜銘菓で、柚子風味の薄く軽い生地が特徴。"},{"text":"梅干しが種類豊富で、はちみつ味を買った","why":"南高梅の梅干しは和歌山の代表土産。"},{"text":"みかんのゼリーとジュースをまとめ買いした","why":"有田みかんの加工品は定番土産。"},{"text":"ごま豆腐みたいな、ぷるぷるのお豆腐を買った","why":"高野山のごま豆腐。精進料理の代表。"},{"text":"野菜が入った、甘いおかず味噌を買ったよ","why":"金山寺味噌は和歌山発祥とされる醸造味噌。"}],"移動":[{"text":"大阪から特急で、海沿いを2時間半くらい","why":"特急くろしおで新大阪〜白浜は約2時間半。"},{"text":"山の方は、大阪から電車とケーブルカーを乗り継いだ","why":"高野山へは南海電鉄とケーブルカーの乗り継ぎが王道。"},{"text":"東京からは飛行機で、小さい空港に降りたよ","why":"羽田〜南紀白浜空港は約1時間10分。"},{"text":"県内の移動がとにかく長かった。半島は広いね","why":"紀伊半島は大きく、和歌山市〜新宮は特急で約3時間かかる。"},{"text":"県庁所在地からは、大阪まで電車で1時間くらいだった","why":"和歌山〜天王寺は阪和線で約1時間。県北は大阪に近い。"}],"過ごし方":[{"text":"山の上のお寺に泊まって、朝のお勤めに参加した","why":"高野山の宿坊体験。朝の勤行と精進料理が名物。"},{"text":"白い砂浜の温泉街で、海と温泉を両方楽しんだ","why":"白浜温泉の過ごし方。海と温泉が隣り合う。"},{"text":"古い参詣道を歩くツアーに参加したよ","why":"熊野古道ウォーキング。世界遺産の参詣道を歩く。"},{"text":"朝早く起きて、マグロの競りを見学した","why":"那智勝浦港のマグロ競り見学。"},{"text":"本州最南端の碑の前で写真を撮った","why":"串本の潮岬は本州最南端の地。"}],"名所":[{"text":"山の上の宗教都市で、朱色の大きな塔がシンボルだった","why":"高野山・壇上伽藍の根本大塔。真言密教の聖地の中心。"},{"text":"三重塔と大きな滝が、一緒に見える神社に行った","why":"熊野那智大社と那智山青岸渡寺の三重塔、那智の滝の組み合わせ。"},{"text":"白い砂浜が弧を描く、温泉リゾートの浜辺","why":"白良浜。白浜温泉の象徴のビーチ。"},{"text":"海に並ぶ奇岩と、本州最南端の灯台を見た","why":"串本の橋杭岩と潮岬灯台。"},{"text":"街の真ん中の小高い山に建つお城に登った","why":"和歌山城。紀州徳川家の居城。"}],"食":[{"text":"和歌山ラーメンを食べた。豚骨醤油で濃かった","why":"和歌山ラーメンは豚骨醤油味が特徴のご当地ラーメン。"},{"text":"ラーメンと一緒に、早すしって寿司を食べるのが地元流らしい","why":"早すし（鯖の押し寿司）をラーメンと一緒 t":"川がくねっと曲がった小さな町に、赤い屋根が密集してた","why":"チェスキー・クルムロフの町並みは世界遺産。"},{"text":"金色の文字盤の、からくり時計が広場にあった","why":"旧市庁舎の天文時計。"},{"text":"骨でできたシャンデリアが飾られた、不気味な礼拝堂があった","why":"クトナー・ホラのセドレツ納骨堂。"}],"お土産":[{"text":"カットがすごく細かい、きらきらのガラスのグラスを買った","why":"ボヘミアガラスはチェコを代表する工芸品。"},{"text":"木でできた操り人形を買った","why":"マリオネットはチェコの伝統文化。"},{"text":"小さいモグラのキャラクターのグッズを買った","why":"アニメ『もぐらのクルテク』はチェコの国民的キャラクター。"},{"text":"温泉の街で、平べったくて大きなウエハースを買った","why":"カルロヴィ・ヴァリ名物の温泉ウエハース（オブラートキ）。"},{"text":"薬草のお酒を買った。苦いけど体にいいらしい","why":"ベヘロフカは薬草酒として有名。"}],"移動":[{"text":"直行便がなくて、ヨーロッパの別の国で乗り継いだ","why":"日本からチェコへの直行便は現在ない。"},{"text":"時差は7〜8時間で、日本より遅れてた","why":"チェコは日本より8時間遅い（夏時間中は7時間）。"},{"text":"路面電車が街中を走ってて、移動が便利だった","why":"プラハではトラムが市民の足。"},{"text":"隣の国の首都から、電車で国境を越えて入った","why":"ウィーンやベルリンから鉄道で入る旅行者も多い。"},{"text":"小さな古い町へは、長距離バスで3時間くらいだった","why":"首都からチェスキー・クルムロフへはバスで約3時間。"}],"過ごし方":[{"text":"からくり時計が動くのを、広場の人だかりの中で待った","why":"天文時計は毎正時に仕掛けが動く。"},{"text":"地下のビアホールで、ジョッキのビールを何杯も飲んだ","why":"ビアホール文化が根づいている。"},{"text":"糸で操る人形劇を見た","why":"マリオネット劇場の人形劇は定番の観光。"},{"text":"温泉の街で、専用のカップで温泉水を飲み歩いた","why":"カルロヴィ・ヴァリでは温泉を飲む「飲泉」が伝統。"},{"text":"川をボートで下りながら、古い町並みを眺めた","why":"チェスキー・クルムロフのヴルタヴァ川下り。"}],"名所":[{"text":"世界最大級の古城って言われるお城を見学した","why":"プラハ城は世界最大級の古城としてギネス認定されている。"},{"text":"600年以上も動き続けてる、天文時計を見た","why":"プラハの天文時計は1410年に作られた。"},{"text":"壁一面にカラフルな落書きがされた、平和を願う壁を見た","why":"ジョン・レノンの壁。"},{"text":"踊ってるみたいにぐにゃっと曲がったビルを見た","why":"ダンシング・ハウス。"},{"text":"何万人分もの骨で飾られた礼拝堂に入った","why":"セドレツ納骨堂には約4万人分の骨がある。"}],"食":[{"text":"煙突みたいな筒状のパンに、アイスを詰めて食べた","why":"トルデルニークは観光地の人気スイーツ。"},{"text":"ローストポークに、蒸しパンみたいな団子が添えてあった","why":"クネドリーキ（蒸しパン風の団子）は定番の付け合わせ。"},{"text":"くりぬいたパンの器に、牛肉の煮込みが入ってた","why":"グラーシュはチェコでもよく食べられる煮込み料理。"},{"text":"ビールの消費量が世界一らしくて、昼からみんな飲んでた","why":"チェコは一人当たりのビール消費量が世界一。"},{"text":"牛肉のクリームソースに、ジャムとホイップがのってた","why":"スヴィーチュコヴァーはチェコの伝統料理。"}]}},{"name":"ギリシャ","region":"ヨーロッパ","tier":3,"souvenir":"オリーブオイル","hints":{"第一印象":[{"text":"白い家と青い屋根の組み合わせが、どこを撮っても絵になった","why":"サントリーニ島などの白い街並みは有名。"},{"text":"古代の遺跡が、街の真ん中にどんと残ってた","why":"首都アテネの中心部には古代遺跡が点在する const CAT_ORDER = ["第一印象","空気感","景色","お土産","移動","過ごし方","名所","食"];
function diffLabel(idx){ return ["入門","中級","中級","上級","最上級・誤答2回まで"][idx] || "中級"; }
function hintCost(stage){ return 90 + (stage||0)*12; }
function wrongLimit(){ return (S && S.idx>=4) ? 2 : 3; }
function buildHints(pref){ return CAT_ORDER.map(cat => { const vs = pref.hints[cat] || []; const v = vs[Math.floor(Math.random()*vs.length)]; return { cat:cat, text:v.text, why:v.why }; }); }
const PERSONAS = [

const TOTAL_TRAVELERS = 5;
const IS_TEST = typeof globalThis !== 'undefined' && !!globalThis.__PREF_TEST__;

let S = null;
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function pointsFor(revealed, wrong, stage){ let p = 1000 - (revealed-1)*hintCost(stage) - wrong*150; if(revealed<=2) p += 150; return Math.max(50, p); }
function newRun(){
  const pools = {1:shuffle(ACTIVE.places.filter(p=>p.tier===1)), 2:shuffle(ACTIVE.places.filter(p=>p.tier===2)), 3:shuffle(ACTIVE.places.filter(p=>p.tier===3))};
  const plan = [1,2,2,3,3];
  S = { order: plan.map(t => pools[t].shift()), idx:0, total:0, results:[], phase:'ask',
        traveler:null, persona:null, revealed:0, wrong:0, log:[] };
  startTraveler();
  return S;
}
function startTraveler(){
  S.traveler = S.order[S.idx];
  S.persona = PERSONAS[Math.floor(Math.random()*PERSONAS.length)];
  S.revealed = 1; S.wrong = 0; S.phase = 'ask'; S.log = [];
  S.hints = buildHints(S.traveler);
  return S;
}
function revealHint(){
  if(!S || S.phase!=='ask') return false;
  if(S.revealed >= S.hints.length) return false;
  S.revealed++;
  return true;
}
function finishTraveler(pts, gaveUp){
  if(!IS_TEST) recordResult(S.traveler.name, pts > 0);
  S.results.push({ name:S.traveler.name, pts:pts, hints:S.revealed, wrong:S.wrong, gaveUp:!!gaveUp, souvenir:S.traveler.souvenir });
  S.total += pts;
  S.phase = 'explain';
}
function guess(name){
  if(!S || S.phase!=='ask') return {ok:false};
  if(name === S.traveler.name){
    const pts = pointsFor(S.revealed, S.wrong, S.idx);
    finishTraveler(pts, false);
    return {ok:true, correct:true, pts:pts};
  }
  S.wrong++;
  if(S.wrong >= wrongLimit()){
    finishTraveler(0, false);
    return {ok:true, correct:false, exhausted:true};
  }
  if(S.revealed < S.hints.length) S.revealed++;
  return {ok:true, correct:false};
}
function giveUp(){
  if(!S || S.phase!=='ask') return false;
  finishTraveler(0, true);
  return true;
}
function nextTraveler(){
  if(!S || S.phase!=='explain') return false;
  S.idx++;
  if(S.idx >= TOTAL_TRAVELERS){ S.phase='final'; return true; }
  startTraveler();
  return true;
}
function rankFor(total){ for(const r of RANKS){ if(total >= r[0]) return r[1]; } return RANKS[RANKS.length-1][1]; }

function beep(f, d){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f; o.type='sine'; g.gain.value = 0.06;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (d||0.12));
    o.stop(AC.currentTime + (d||0.12));
  }catch(e){}
}

const DIRS = ["北","北東","東","南東","南","南西","西","北西"];
function geoInfo(from, to){
  const a = COORDS[from], b = COORDS[to]; if(!a || !b) return null;
  const R = Math.PI/180, lat1=a[0]*R, lat2=b[0]*R;
  let dLon = (b[1]-a[1]); if(dLon>180) dLon-=360; if(dLon<-180) dLon+=360; dLon*=R;
  const dLat = lat2-lat1;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  const km = 2*6371*Math.asin(Math.sqrt(h));
  const ang = Math.atan2(dLat, dLon*Math.cos((lat1+lat2)/2)) / R; // 0=東, 90=北
  const dir = DIRS[Math.round(((90-ang)+360)%360/45)%8];
  return { km, dir };
}
/* 外れた場所 guessName から見た正解の方向・距離を、旅行者のセリフにする */
function nearLine(guessName, answer){
  const g = ACTIVE.places.find(p=>p.name===guessName);
  const info = geoInfo(guessName, answer.name);
  const same = g && g.region === answer.region;
  const intl = ACTIVE.key === 'intl';
  const areaWord = intl ? answer.region : (answer.region==='北海道'||answer.region==='沖縄' ? answer.region : answer.region+'地方');
  if(!info) return same ? '惜しい！ 同じ'+areaWord+'だよ' : '全然違うよ〜';
  const near = intl ? [1500,4000,8000] : [130,350,700];
  const dir = 'もっと' + info.dir + 'のほう';
  let level, line;
  if(info.km < near[0]){ level='hot'; line = (same ? 'すごく惜しい！ 同じ'+areaWord+'で、すぐ近く。' : 'すごく惜しい！ すぐ近くだよ。') + dir; }
  else if(info.km < near[1]){ level='warm'; line = (same ? '惜しい！ 同じ'+areaWord+'だよ。' : 'わりと近い！ ') + dir; }
  else if(info.km < near[2]){ level='cool'; line = (same ? '同じ'+areaWord+'だけど、ちょっと遠いかな。' : 'うーん、ちょっと遠いかな。') + dir; }
  else { level='cold'; line = '全然違う〜！ かなり遠いよ。' + dir; }
  return { level, line, dir: info.dir };
}
const CHARMS = {"北海道":{"c":"日本の面積の約5分の1。食も景色もスケールが桁違い","f":[["🥔","じゃがいも・玉ねぎ・牛乳、日本一だらけ","じゃがいも、玉ねぎ、生乳など多くの農産物で生産量日本一。カロリーベースの食料自給率は200%を超える、まさに「日本の台所」。"],["💜","梅雨がない、からっとした夏","北海道には本州のような梅雨がほとんどない。7月は富良野のラベンダー畑が見頃で、さわやかな初夏の旅がいちばん気持ちいい季節。"],["🧊","流氷がやってくる海","冬のオホーツク海沿岸には、はるか北から流れてきた流氷が押し寄せる。ドライスーツを着て流氷の上を歩くツアーは、ここでしかできない体験。"]]},"青森県":{"c":"りんごだけじゃない。祭りと縄文とマグロの県","f":[["🍎","日本のりんごの約6割は青森産","「ふじ」「王林」「つがる」など品種も多彩。秋の収穫期には、もぎたてを食べ比べられる直売所めぐりが楽しい。"],["🐟","大間のマグロは「黒いダイヤ」","本州最北端・大間の一本釣りクロマグロは最高級ブランド。初競りで3億円を超える値がついたこともある。"],["🏮","夏の夜を焦がす、ねぶた祭","8月初旬の青森ねぶた祭では、武者などを描いた巨大な灯籠が街を練り歩く。衣装を借りれば観光客も「跳人（ハネト）」として参加できる。"]]},"岩手県":{"c":"本州でいちばん広い県に、黄金の寺と三陸の海","f":[["🗾","東京都の約7倍の広さ","岩手県は北海道に次ぐ全国2位の面積で、本州では最大。山も海も高原も、どこへ行っても空が広い。"],["✨","平泉の中尊寺金色堂","奥州藤原氏が築いた平泉の中尊寺金色堂は、お堂全体が金箔で覆われた国宝。「平泉」は東北初の世界遺産になった。"],["🍜","わんこそばは「おもてなし」","給仕さんが「はい、どんどん」とお椀にそばを入れ続けるわんこそば。たくさんの客をもてなすための郷土の風習から生まれたと言われている。"]]},"宮城県":{"c":"牛タン、笹かま、日本三景。仙台は「杜の都」","f":[["🐄","仙台の牛タンは、実は外国産が主流","仙台の牛タン焼きは、脂がのって柔らかい外国産のタンを多く使う。戦後、安く多くの人に食べてもらうために工夫されたのが始まりで、厚切りの塩焼きに麦飯とテールスープを添えるのが定番。"],["🏝️","日本三景・松島","京都の天橋立、広島の宮島と並ぶ日本三景のひとつ。260あまりの小島が浮かぶ湾を、遊覧船でゆっくりめぐれる。"],["🌳","「杜の都」の由来","伊達政宗の時代から屋敷林を育てることが奨励され、緑豊かな街並みから「杜の都」と呼ばれるようになった。冬は定禅寺通りのケヤキ並木が光で彩られる。"]]},"秋田県":{"c":"お米とお湯と、なまはげの国","f":[["🍚","きりたんぽは、お米の国の鍋","炊いたご飯をつぶして杉の棒に巻きつけて焼いたのが、きりたんぽ。比内地鶏のスープで煮る鍋は、秋田の冬のごちそう。"],["♨️","全国の温泉好きが憧れる乳頭温泉郷","山あいにある乳頭温泉郷は、乳白色のお湯と茅葺きの宿で知られる秘湯。雪見の露天風呂は一生に一度は入りたい景色。"],["👹","なまはげは、怠け心をいさめる神様","男鹿半島のなまはげは、大みそかに家々を回る伝統行事。「来訪神」としてユネスコ無形文化遺産にも登録されている。"]]},"山形県":{"c":"さくらんぼ日本一。芋煮とそばと樹氷の県","f":[["🍒","さくらんぼの約4分の3は山形産","「佐藤錦」で知られるさくらんぼの産地。6〜7月は、木から直接もいで食べるさくらんぼ狩りが楽しめる。"],["❄️","蔵王の「スノーモンスター」","冬の蔵王では、雪と氷が木に吹きつけられて巨大な樹氷ができる。ライトアップされた夜の樹氷原は、別の惑星のような景色。"],["🍲","秋の風物詩、芋煮会","河原で大鍋を囲む芋煮会は山形の秋の定番行事。「日本一の芋煮会フェスティバル」では直径6mを超える大鍋で調理する。"]]},"福島県":{"c":"一年中くだものが実るフルーツ王国と、会津の城下町","f":[["🍑","夏の桃は格別","福島は全国有数の桃の産地。さくらんぼ、梨、りんごと、季節ごとに果物狩りが楽しめる「フルーツ王国」。"],["🏯","赤い瓦の鶴ヶ城","会津若松の鶴ヶ城は、戊辰戦争で1か月にわたる籠城戦に耐えた名城。赤い瓦の天守は全国でここだけ。"],["🧅","ネギ1本で食べる大内宿のそば","茅葺き屋根の家が並ぶ大内宿は、江戸時代の宿場町の姿を今に残す。名物は箸の代わりにネギ1本でたぐる「ねぎそば」。"]]},"茨城県":{"c":"メロンも干し芋も日本一。花の絶景の宝庫","f":[["🍈","実はメロンの生産量日本一","茨城県はメロンの生産量が長年全国1位。干し芋も全国のほとんどを占める、知られざる農業大国。"],["💙","丘一面が青く染まるネモフィラ","国営ひたち海浜公園では、春はネモフィラ、秋はコキアで丘全体が青や赤に染まる。海外から写真を撮りに来る人も多い絶景。"],["🌸","日本三名園・偕楽園","水戸の偕楽園には約100品種・3,000本の梅が植えられ、早春の梅まつりは甘い香りに包まれる。"]]},"栃木県":{"c":"日光の絢爛と、いちご王国","f":[["🍓","いちごの生産量は半世紀以上日本一","「とちおとめ」や「とちあいか」で知られるいちご王国。冬から春にかけては、いちご狩りが大人気。"],["🐒","日光東照宮の5,000を超える彫刻","徳川家康をまつる日光東照宮は、「見ざる・言わざる・聞かざる」の三猿や「眠り猫」など、きらびやかな彫刻で埋めつくされている。"],["🥟","宇都宮は餃子のまち","宇都宮は餃子の街として知られ、市内には専門店がずらり。焼き・水・揚げを食べ比べるのが通の楽しみ方。"]]},"群馬県":{"c":"名湯ぞろいの温泉王国","f":[["♨️","草津温泉は自然湧出量日本一","街の中心の「湯畑」から湯けむりが立ちのぼる草津温泉。熱いお湯を板でかき混ぜる「湯もみ」のショーも見られる。"],["🏭","日本の近代化の原点・富岡製糸場","明治5年に建てられた官営の製糸工場で、世界遺産に登録されている。当時のレンガ造りの建物が今もほぼそのまま残る。"],["🍢","こんにゃく芋の9割以上が群馬産","こんにゃくや下仁田ネギが名産。こんにゃく芋の生産量は全国の9割以上を占める。"]]},"埼玉県":{"c":"都会のすぐ隣に「小江戸」と秩父の自然","f":[["🏘️","川越は「小江戸」と呼ばれる蔵の街","江戸時代の蔵造りの町並みが残り、「時の鐘」がシンボル。菓子屋横丁での駄菓子の食べ歩きも楽しい。"],["🎆","冬の夜空を彩る秩父夜祭","毎年12月の秩父夜祭では、豪華な山車が花火の下を進む。ユネスコ無形文化遺産にも登録された日本三大曳山祭のひとつ。"],["🥬","実は野菜の一大産地","深谷ねぎをはじめ、ねぎやほうれん草などの生産量は全国トップクラス。都心の食卓を支える畑の県でもある。"]]},"千葉県":{"c":"空と海の玄関口。落花生と房総の海","f":[["🥜","落花生の約8割は千葉産","千葉は落花生の産地。秋に掘りたてをゆでる「ゆで落花生」は、産地ならではのほくほくの味。"],["🌊","全長60kmを超える九十九里浜","太平洋に面した九十九里浜は日本有数の長い砂浜。東京から近い海として、サーフィンや海水浴が楽しめる。"],["⛩️","成田山新勝寺","初詣には毎年約300万人が訪れる成田山新勝寺。参道にはうなぎの名店が軒を連ねる。"]]},"東京都":{"c":"世界有数の大都市に、江戸と島と山がある","f":[["🐋","東京にも「南の島」がある","小笠原諸島は東京都。竹芝から船で約24時間かかる世界自然遺産の島々で、ザトウクジラやイルカに会える。"],["⛰️","高尾山は世界有数の登山者が多い山","都心から1時間ほどの高尾山には、年間約300万人が登る。ミシュランの観光ガイドで三つ星を獲得したことでも知られる。"],["🍣","握り寿司は江戸のファストフード","握り寿司は江戸の屋台で生まれた。東京湾の魚を酢締めや煮切りなどの「仕事」でおいしくしたのが江戸前の技。"]]},"神奈川県":{"c":"港町、古都、温泉。ぜんぶ日帰り圏","f":[["🙏","鎌倉の大仏は、青空の下に座る","鎌倉は鎌倉幕府が置かれた武家の都。高さ約11mの大仏は、大仏殿がなく屋外で見上げられる。"],["🗻","箱根は温泉と美術館の宝庫","古くからの温泉地・箱根には個性的な美術館も多い。晴れた日には芦ノ湖越しに富士山が見える。"],["🥟","日本最大の中華街","横浜中華街には数百の店が集まる。肉まんや小籠包を食べ歩きながら、関帝廟の極彩色の建物をめぐるのが定番。"]]},"新潟県":{"c":"米も酒も日本一級。雪がおいしさを育てる","f":[["🍶","酒蔵の数は日本一","新潟には約90の酒蔵があり、その数は全国1位。雪どけ水が、すっきりした「淡麗辛口」の酒を生む。"],["🍚","コシヒカリのふるさと","お米の収穫量は長年全国トップクラス。シンプルな塩むすびで違いが分かるほどのおいしさ。"],["🪙","佐渡島は金山とトキの島","佐渡金山は2024年に世界遺産に登録。国の特別天然記念物・トキが野生で暮らす島としても知られる。"]]},"富山県":{"c":"立山の雪の壁と、富山湾の天然のいけす","f":[["🏔️","雪の壁の間を歩く「雪の大谷」","立山黒部アルペンルートでは、春に高さ10mを超える雪の壁の間を歩ける。世界でも珍しい景色。"],["🦐","富山湾は「天然のいけす」","水深1,000mを超える富山湾は魚の種類がとても豊富。春のホタルイカや「富山湾の宝石」と呼ばれる白えびが名物。"],["💊","「越中富山の薬売り」","薬を先に家庭に預けて、使った分だけ代金をもらう「先用後利」の商法で、江戸時代から全国に広まった。"]]},"石川県":{"c":"加賀百万石の文化と、金箔と冬の海の幸","f":[["✨","金箔の国内生産は99%以上が金沢","金沢は金箔の一大産地。金箔を一枚まるごとのせたソフトクリームも名物。"],["🌲","日本三名園・兼六園","江戸時代の大名庭園。冬は雪の重みから枝を守る「雪吊り」の円錐形の縄が、冬の風物詩になっている。"],["🦀","冬はカニ、香箱がにの季節","冬の加能ガニ（ズワイガニ）や、卵を抱えたメスの「香箱ガニ」は、石川の冬の味覚の王様。"]]},"福井県":{"c":"恐竜とメガネと越前ガニ","f":[["🦕","国内の恐竜化石の大部分は福井から","勝山市では多くの恐竜化石が発掘され、県立恐竜博物館は世界有数の規模を誇る。駅前では動く恐竜がお出迎え。"],["👓","メガネフレームの国内シェア9割以上","鯖江市はメガネフレームの一大産地。世界の有名ブランドのフレームも作られている。"],["🦀","越前ガニは皇室献上のカニ","福井で水揚げされるオスのズワイガニ「越前ガニ」は、冬の福井を代表する味覚。皇室に献上されていることでも知られる。"]]},"山梨県":{"c":"富士山と、桃とぶどうの果物天国","f":[["🍇","桃もぶどうも生産量日本一","山梨は桃・ぶどう・すももの生産量が全国1位。夏から秋にかけて、果物狩りが楽しめる。"],["🍷","日本ワインのふるさと","日本固有のぶどう品種「甲州」から造る甲州ワインの産地。勝沼周辺にはワイナリーが集まり、試飲めぐりができる。"],["🗻","湖に映る「逆さ富士」","河口湖などの富士五湖では、風のない朝に湖面に富士山が映る。日本を代表する撮影スポット。"]]},"長野県":{"c":"日本の屋根。山と高原とそばの国","f":[["🏔️","県の平均標高は日本一","3,000m級の山々が連なる「日本の屋根」。上高地や白馬など、夏の避暑にも冬のスキーにも人気。"],["🐵","温泉に入るおサル","地獄谷野猿公苑では、野生のニホンザルが温泉につかる姿が見られ、「スノーモンキー」として世界的に有名。"],["🍜","信州そばとおやき","冷涼な気候はそば作りに向き、信州そばは全国的なブランド。野菜やあんこを包んで焼いたおやきも郷土の味。"]]},"岐阜県":{"c":"合掌造りと鵜飼。日本の原風景","f":[["🏡","白川郷の合掌造り集落","世界遺産・白川郷には、急な茅葺き屋根の合掌造りの家が並ぶ。冬のライトアップは雪国ならではの絶景。"],["🐦","1300年続く長良川の鵜飼","鵜匠が鵜をあやつって鮎をとる伝統漁法。長良川の鵜匠は宮内庁に所属する職員でもある。"],["🔪","刃物の街・関","関市は世界的に知られる刃物の産地。鎌倉時代から続く刀鍛冶の技が、包丁やナイフに受け継がれている。"]]},"静岡県":{"c":"富士山と、お茶とうなぎと温泉と","f":[["🍵","日本一を争う茶どころ","静岡は長年お茶の生産量日本一の茶どころ（近年は鹿児島と首位を争う）。牧之原台地の茶畑は見渡す限りの緑。"],["🐟","浜名湖のうなぎ","浜名湖は明治時代からうなぎの養殖が盛ん。おなじみのお土産「うなぎパイ」も浜松生まれ。"],["♨️","伊豆半島は温泉の宝庫","熱海、修善寺、伊東など、伊豆には個性豊かな温泉地が点在する。海の幸と温泉を一度に楽しめる。"]]},"愛知県":{"c":"ものづくり日本一と、独自に進化した名古屋めし","f":[["🚗","製造品出荷額は40年以上連続日本一","自動車産業を中心に、ものづくりで日本をリードする県。産業技術記念館など工場や技術の見学スポットも多い。"],["🍤","名古屋めしは独自の進化系","味噌カツ、ひつまぶし、手羽先、あんかけスパ…。喫茶店でドリンクを頼むとトーストや卵がついてくる「モーニング」文化も有名。"],["🏯","名古屋城の金のしゃちほこ","天守に金のしゃちほこが輝く名古屋城。復元された本丸御殿の豪華な障壁画も見どころ。"]]},"三重県":{"c":"お伊勢参りと、海女と伊勢えびの海","f":[["⛩️","伊勢神宮は20年ごとに建て替える","伊勢神宮では20年に一度、社殿を新しく建て替える「式年遷宮」が1300年続いている。"],["🤿","海女の数は日本一","鳥羽・志摩では、今も海女さんが素潜りでアワビやサザエをとっている。海女小屋で獲れたての貝を焼いてもらう体験も。"],["🥩","松阪牛は「肉の芸術品」","日本を代表するブランド和牛のひとつ。きめ細かい霜降りで、すき焼きにすると甘い脂がとろける。"]]},"滋賀県":{"c":"県の6分の1が湖。琵琶湖とともにある県","f":[["💧","琵琶湖は関西の水がめ","日本最大の湖・琵琶湖は県の面積の約6分の1。近畿の約1,450万人の水を支えている。湖を一周するサイクリング「ビワイチ」が人気。"],["🙏","比叡山延暦寺","世界遺産の比叡山延暦寺は、多くの名僧を生んだ「日本仏教の母山」。1200年以上灯り続ける「不滅の法灯」がある。"],["🍣","ふなずしは日本のすしの原型","琵琶湖のニゴロブナを米で長期間発酵させたふなずしは、なれずしの一種。今の寿司のルーツと言われる。"]]},"京都府":{"c":"1000年の都。歩けば歴史にぶつかる","f":[["⛩️","世界遺産は17か所","「古都京都の文化財」として、清水寺や金閣寺など17か所がまとめて世界遺産に登録されている。"],["🦊","伏見稲荷の千本鳥居","全国の稲荷神社の総本宮。山全体に1万基ともいわれる鳥居が続き、山頂まで歩くと約2時間。"],["🍞","京都は実はパン好き","京都市はパンへの支出額が全国トップクラス。新しいもの好きの町衆文化が、老舗パン屋を育ててきた。"]]},"大阪府":{"c":"食い倒れの街と、笑いの文化","f":[["🐙","「天下の台所」の粉もん文化","江戸時代、全国の物資が集まった大阪は「天下の台所」と呼ばれた。たこ焼きやお好み焼き、串カツなど、安くてうまいものの宝庫。"],["⚱️","世界最大級のお墓","堺市の大仙古墳（仁徳天皇陵古墳）は世界最大級の墓。百舌鳥・古市古墳群は2019年に世界遺産に登録された。"],["🏯","大阪城の天守は市民の寄付で再建","今の大阪城の天守は1931年に市民の寄付で再建されたもの。石垣の巨石「蛸石」は城内最大の石。"]]},"兵庫県":{"c":"港町・神戸と、白い城と、名湯有馬","f":[["🏯","日本初の世界遺産の城・姫路城","法隆寺とともに、日本で初めて世界遺産に登録された。白漆喰の美しさから「白鷺城」と呼ばれる。"],["♨️","金泉と銀泉の有馬温泉","日本最古の温泉のひとつ。鉄分を含む赤茶色の「金泉」と、透明な「銀泉」の2種類のお湯が楽しめる。"],["🥩","神戸ビーフと異人館","但馬牛から生まれる神戸ビーフは世界的なブランド牛。港町・神戸の北野には洋館が並ぶ異人館街がある。"]]},"奈良県":{"c":"1300年前の都が、今も息づく","f":[["🙏","大仏の高さは約15m","東大寺の大仏は高さ約15m。大仏殿は世界最大級の木造建築として知られる。"],["🦌","鹿は神様の使い","奈良公園の約1,300頭の鹿は国の天然記念物。お辞儀をすると、お辞儀を返してくれることもある。"],["🏛️","世界最古の木造建築・法隆寺","法隆寺は現存する世界最古の木造建築群とされ、1993年に日本で最初の世界遺産のひとつになった。"]]},"和歌山県":{"c":"紀州の山と海、熊野の祈りの道","f":[["🍊","みかん・梅・柿の生産量日本一","紀州の南高梅の梅干しは最高級品。秋は山の斜面がみかんのオレンジ色に染まる。"],["🚶","熊野古道は世界遺産の巡礼道","熊野三山へ続く熊野古道は「紀伊山地の霊場と参詣道」として世界遺産に。苔むした石畳を歩くと、千年前の巡礼者の気分になれる。"],["♨️","白浜温泉は日本三古湯のひとつ","南紀白浜温泉は道後・有馬と並ぶ日本三古湯。白い砂浜の白良浜は関西屈指の海水浴場。"]]},"鳥取県":{"c":"人口は日本一少なく、星空は日本一級","f":[["🐫","日本最大級の鳥取砂丘","東西約16kmの砂丘では、ラクダに乗ったり、砂の美術館で巨大な砂像を見たりできる。"],["👻","境港は妖怪とカニの港町","『ゲゲゲの鬼太郎』の作者・水木しげるの故郷で、商店街に妖怪のブロンズ像が並ぶ。紅ズワイガニの水揚げでも知られる。"],["⭐","人が少ないから星がきれい","人口は約53万人で全国最少。そのぶん空気が澄んで星空が美しく、県は「星取県」を名乗っている。"]]},"島根県":{"c":"神話の国。縁結びの出雲大社","f":[["⛩️","出雲では10月は「神在月」","旧暦10月、全国の神様が出雲に集まるとされ、他の地域では「神無月」、出雲では「神在月」と呼ぶ。"],["⛏️","石見銀山は世界遺産","かつて世界の銀の約3分の1が日本産で、その多くが石見銀山で産出されたと言われる。2007年に世界遺産登録。"],["🌇","宍道湖の夕日としじみ","しじみの漁獲量で全国トップクラスの宍道湖。湖に沈む夕日は息をのむ美しさ。"]]},"岡山県":{"c":"晴れの国。白桃とマスカットと桃太郎","f":[["☀️","「晴れの国おかやま」","降水量1mm未満の日が全国トップクラスに多い。旅行の日に晴れやすいのはうれしい。"],["🍑","高級フルーツの王国","清水白桃やマスカット・オブ・アレキサンドリア、シャインマスカットなど、高級フルーツの産地として知られる。"],["🏘️","倉敷美観地区と大原美術館","白壁の蔵屋敷が並ぶ倉敷の美観地区には、日本初の西洋美術中心の私立美術館・大原美術館がある。"]]},"広島県":{"c":"ふたつの世界遺産と、牡蠣とお好み焼き","f":[["🦪","牡蠣の生産量は全国の約6割","冬の広島は牡蠣の季節。焼き牡蠣やカキフライ、土手鍋などで味わえる。"],["⛩️","海に浮かぶ厳島神社","宮島の厳島神社は、満潮時には社殿と大鳥居が海に浮かぶように見える世界遺産。干潮時は鳥居の足元まで歩ける。"],["🕊️","平和記念公園と原爆ドーム","原爆ドームは核兵器の惨禍を伝える世界遺産。平和記念資料館には世界中から人が訪れる。"]]},"山口県":{"c":"ふぐの本場と、エメラルドの海","f":[["🐡","下関では「ふく」と呼ぶ","縁起をかついで、ふぐを「福」にかけて「ふく」と呼ぶ。下関の市場には全国のトラフグが集まる。"],["🌉","海を渡る角島大橋","全長1,780mの角島大橋は、エメラルドグリーンの海を渡る絶景ドライブコース。"],["🌈","5連アーチの錦帯橋","岩国の錦帯橋は、5つの木造アーチが連なる日本三名橋のひとつ。春は桜との共演が美しい。"]]},"徳島県":{"c":"阿波おどりと渦潮とすだち","f":[["💃","「踊る阿呆に見る阿呆」","毎年8月の阿波おどりには100万人以上が訪れ、街中が踊りの渦に包まれる。観光客が参加できる「にわか連」もある。"],["🌀","鳴門の渦潮は世界最大級","潮の満ち引きでできる渦は、大きいもので直径20m以上。観潮船で間近に見ると迫力満点。"],["🍋","すだちのほとんどは徳島産","料理に添えるすだちは、生産量の約98%が徳島。焼き魚や鍋にきゅっと絞ると香りが広がる。"]]},"香川県":{"c":"日本一小さな県は、うどん県","f":[["🍜","うどん愛は日本一","「うどん県」を名乗るほど、うどんが日常。セルフ式の店なら、1杯数百円で本場の味が楽しめる。"],["🎨","瀬戸内の島々とアート","直島や豊島には現代アートの美術館や作品が点在。3年に一度の瀬戸内国際芸術祭には世界中から人が集まる。"],["⛩️","こんぴらさんの785段","金刀比羅宮の本宮までは785段の石段。登りきった先には讃岐平野を見渡す絶景が待っている。"]]},"愛媛県":{"c":"柑橘王国と、日本最古級の温泉","f":[["🍊","柑橘の種類がとにかく多い","みかんだけでなく、伊予柑、紅まどんな、せとかなど、たくさんの種類の柑橘が育つ柑橘王国。"],["♨️","3000年の歴史を持つ道後温泉","日本最古級の温泉。道後温泉本館の重厚な木造建築は、国の重要文化財に指定されている。"],["🚴","しまなみ海道はサイクリストの聖地","愛媛と広島を結ぶしまなみ海道は、橋を自転車で渡って島から島へ旅できる。"]]},"高知県":{"c":"カツオと龍馬と、最後の清流","f":[["🔥","藁で焼くカツオのたたき","カツオの消費量は全国トップクラス。藁の炎で豪快にあぶるたたきは、塩で食べるのが地元流。"],["🌉","四万十川の沈下橋","大きなダムのない四万十川は「日本最後の清流」。増水時に沈むよう欄干のない沈下橋が、のどかな風景をつくる。"],["🗿","坂本龍馬のふるさと","桂浜には、太平洋を見つめる坂本龍馬の像が立つ。龍馬ゆかりの地をめぐる旅も人気。"]]},"福岡県":{"c":"屋台とラーメン。九州の玄関口","f":[["🏮","屋台の数は日本一","博多・天神には夜になると100軒ほどの屋台が並ぶ。隣の客と肩を並べてラーメンやおでんをつまむのが福岡流。"],["🍜","とんこつラーメンの「替え玉」","細麺のとんこつラーメンは、麺だけをおかわりする「替え玉」発祥の地。"],["🌸","学問の神様・太宰府天満宮","菅原道真をまつる太宰府天満宮。参道で焼きたての梅ヶ枝餅を食べるのが定番。"]]},"佐賀県":{"c":"焼き物の里と、日本一の海苔","f":[["🍶","有田焼は日本の磁器のはじまり","有田は日本で初めて磁器が焼かれた地とされ、400年以上の歴史を持つ。毎年春の陶器市には100万人規模の人が訪れる。"],["🌊","海苔の生産量は日本一","干満差の大きい有明海で育つ佐賀海苔は、生産量が約20年連続日本一。"],["🦑","透きとおる呼子のイカ","呼子のイカの活き造りは、身が透きとおって見えるほどの鮮度。コリコリの甘さは現地でしか味わえない。"]]},"長崎県":{"c":"異国情緒と、島の数日本一","f":[["🏝️","島の数は日本一","長崎県には1,400を超える島がある。五島列島などには、世界遺産に登録された潜伏キリシタンの集落や教会が残る。"],["⚓","鎖国中も海外に開かれた窓口","江戸時代、出島はオランダとの貿易の窓口だった。カステラやちゃんぽんなど、異国の影響を受けた食文化が残る。"],["🌃","世界新三大夜景","稲佐山から見る長崎の夜景は「世界新三大夜景」に選ばれている。山の斜面に家々の灯りが広がる。"]]},"熊本県":{"c":"阿蘇の雄大な大地と、復興する城下町","f":[["🌋","阿蘇は世界最大級のカルデラ","阿蘇のカルデラは南北約25km。その中に約5万人が暮らし、草原では牛や馬がのんびり草を食む。"],["🏯","熊本城の復興","2016年の地震で被災した熊本城は、天守閣の復旧を終え、今も城全体の修復が続く。復興の歩みを見学できる。"],["🐴","馬刺しとからし蓮根","熊本は馬肉の生産量日本一。からし蓮根は藩主の体を気づかって考案されたと伝わる郷土料理。"]]},"大分県":{"c":"源泉数も湧出量も日本一の「おんせん県」","f":[["♨️","源泉数・湧出量ともに日本一","別府・湯布院を擁する「おんせん県」。別府の「地獄めぐり」では、真っ青や真っ赤な温泉が見られる。"],["🍗","とり天とからあげの聖地","鶏肉をよく食べる県で、天ぷらにした「とり天」や中津のからあげが名物。"],["🐟","関あじ・関さば","豊後水道の速い潮で育った関あじ・関さばは、身が引き締まった高級ブランド魚。"]]},"宮崎県":{"c":"太陽と緑の国。神話の里","f":[["🛶","高千穂峡の真名井の滝","柱状節理の断崖から滝が落ちる高千穂峡は、ボートで間近に見られる。天孫降臨の神話の舞台でもある。"],["🍗","チキン南蛮発祥の地","甘酢にくぐらせた鶏の揚げ物にタルタルソースをかけるチキン南蛮は、宮崎生まれ。"],["🥭","完熟マンゴー「太陽のタマゴ」","基準を満たした最高級の完熟マンゴーだけが「太陽のタマゴ」を名乗れる。贈答品として高値で取引される。"]]},"鹿児島県":{"c":"桜島と黒豚と、屋久島の森","f":[["🌋","今も噴煙を上げる桜島","市街地から海をはさんですぐの活火山。市民は降り積もった灰を専用の「克灰袋」に入れて出す。"],["🌲","屋久島の縄文杉","屋久島は日本初の世界自然遺産のひとつ。樹齢数千年といわれる縄文杉に会うには、往復10時間ほど歩く。"],["🐖","黒豚と芋焼酎","かごしま黒豚は甘みのある脂が特徴。さつま芋から造る芋焼酎の本場でもある。"]]},"沖縄県":{"c":"琉球の文化と、ジャングルの森","f":[["👑","かつての琉球王国","沖縄は約450年続いた琉球王国の地。王城の首里城は再建工事が進んでいる。三線や紅型など独自の文化が息づく。"],["🐖","豚は「鳴き声以外ぜんぶ食べる」","ゴーヤーや島豆腐、昆布を使う沖縄料理。豚肉は耳や足まで使い、「鳴き声以外すべて食べる」と言われる。"],["🐦","やんばるの森は世界自然遺産","本島北部のやんばるは、飛べない鳥ヤンバルクイナが暮らす森。2021年に世界自然遺産に登録された。"]]},"韓国":{"c":"飛行機で2時間半。いちばん近い外国のひとつ","f":[["✈️","週末でも行ける近さ","ソウルは東京から飛行機で2時間半ほど。金曜の夜に出発して、日曜に帰ってくる弾丸旅行も人気。"],["🥢","おかずは無料でおかわり自由","食堂では、キムチやナムルなどの小皿「パンチャン」が無料で出てきて、おかわりできることが多い。"],["👘","韓服を着ると宮殿が無料","ソウルの景福宮では、韓服（ハンボク）を着て行くと入場が無料になる。"]]},"中国":{"c":"56の民族が暮らす、食と歴史の大陸","f":[["🥟","地域ごとにまったく違う料理","四川の辛さ、広東の飲茶、北京ダック、上海の小籠包…。地域ごとに料理がまるで別物。"],["🧱","総延長2万kmの万里の長城","総延長は2万kmを超えるとも言われる世界遺産。北京近郊の八達嶺などで実際に歩ける。"],["🐼","パンダのふるさと","四川省の成都にはジャイアントパンダ繁育研究基地があり、たくさんのパンダに会える。"]]},"台湾":{"c":"夜市と温泉と、親しみやすい島","f":[["🏮","夜市はグルメの宝庫","台湾では毎晩各地で夜市が開かれ、魯肉飯や大きな鶏排、タピオカミルクティーを食べ歩きできる。"],["♨️","実は温泉大国","台北の北投温泉など、台湾には温泉が多い。日本統治時代の名残で、日本式の温泉文化が根づいている。"],["🌆","九份の夕暮れ","山の斜面に赤い提灯が灯る九份は、ノスタルジックな街並みで人気。"]]},"タイ":{"c":"微笑みの国。寺院と屋台とビーチ","f":[["🍜","屋台グルメは世界屈指","バンコクの屋台料理は世界的にも評価が高く、ミシュランの星を獲得した屋台もある。"],["🛕","3万を超える寺院","国民の大半が仏教徒で、寺院の数は3万を超える。早朝、托鉢の僧侶が街を歩く光景は神聖。"],["🏝️","アンダマン海のビーチリゾート","プーケットやクラビなど、石灰岩の奇岩とエメラルドの海のビーチが点在する。"]]},"ベトナム":{"c":"フォーとバインミーと、絶景の湾","f":[["⛵","ハロン湾の奇岩","約2,000の石灰岩の島々が海に浮かぶハロン湾は世界遺産。船に泊まるクルーズが人気。"],["🥖","フランス文化が溶け込んだ食","フランスパンに具を挟むバインミーや、練乳入りのベトナムコーヒーは、フランス統治時代の影響から生まれた。"],["🏮","ランタンの古都ホイアン","夜になると色とりどりのランタンが灯る世界遺産の町。かつて日本人町があり、来遠橋は「日本橋」とも呼ばれる。"]]},"シンガポール":{"c":"東京23区ほどの国に、世界中の文化が集まる","f":[["📏","東京23区より少し大きいくらい","面積は約730km²。コンパクトなので、中華街やリトル・インディアなど多文化の街を一日でめぐれる。"],["🍛","屋台文化はユネスコ無形文化遺産","屋台が集まるホーカーセンターの文化は、2020年にユネスコ無形文化遺産に登録された。"],["🗣️","公用語は4つ","英語・中国語・マレー語・タミル語が公用語。看板が何か国語も並ぶ光景が、この国らしさ。"]]},"マレーシア":{"c":"多民族が暮らす、熱帯雨林とツインタワーの国","f":[["🌴","世界最古級の熱帯雨林","タマン・ネガラ国立公園の熱帯雨林は、1億年以上前から続く世界最古級の森と言われる。"],["🍛","3つの文化が混ざる食卓","マレー系・中華系・インド系の料理が混ざり合い、ナシレマやラクサなど多彩な食文化がある。"],["🎨","世界遺産の港町ペナン","ジョージタウンの旧市街は、カラフルな壁画と、中華とマレーが融合したプラナカン文化で人気。"]]},"インドネシア":{"c":"1万7千の島からなる、神々の島と遺跡の国","f":[["🏝️","島の数は1万7,000以上","世界最大の島しょ国。島ごとに言葉や文化が違い、一生かけても回りきれない。"],["🌺","バリ島は「神々の島」","イスラム教徒が多い国の中で、バリ島はヒンドゥー文化が色濃く、毎日のお供え物や祭りが暮らしに溶け込んでいる。"],["🛕","ボロブドゥール遺跡","ジャワ島のボロブドゥールは世界最大級の仏教遺跡。朝日に浮かぶ姿は神秘的。"]]},"インド":{"c":"一生かけても回りきれない、多様性の国","f":[["💵","紙幣に17の言語","インドには数百の言語があり、紙幣には17の言語で金額が書かれている。"],["🍛","「カレー」という料理は無い？","日本で言うカレーは、現地ではスパイスを使った多様な料理の総称。地方ごとにスパイスも主食もまったく違う。"],["🕌","タージ・マハル","ムガル帝国の皇帝が亡き妃のために建てた白大理石の霊廟。朝と夕方で色が変わって見える。"]]},"オーストラリア":{"c":"時差の少ない、南半球の大陸","f":[["🕐","時差は1〜2時間だけ","大陸の国だけど、シドニーとの時差は1〜2時間。時差ぼけが少ない海外旅行先。"],["🐨","動物の多くが固有種","コアラやカンガルーなど、哺乳類の8割以上がここにしかいない固有種と言われる。"],["🐠","世界最大のサンゴ礁","全長2,000km以上のグレートバリアリーフは、宇宙からも見えると言われる世界最大のサンゴ礁。"]]},"フランス":{"c":"外国人観光客数が世界一の観光大国","f":[["🗼","訪れる人の数は世界一","フランスは外国人観光客数が世界1位。パリだけでなく、地方ごとにまったく違う魅力がある。"],["🏰","潮が満ちると島になる修道院","モン・サン・ミシェルは、潮の満ち引きで島になる世界遺産の修道院。名物はふわふわのオムレツ。"],["🧀","チーズは1,000種類以上","「チーズの国」と呼ばれ、地方ごとに特色あるチーズがある。ワインとの組み合わせは無限大。"]]},"イタリア":{"c":"世界遺産の数は世界トップクラス","f":[["🏛️","国じゅうが博物館","世界遺産の数は世界トップクラス。ローマのコロッセオから小さな村まで、どこを歩いても歴史がある。"],["🍝","パスタは地方の数だけ","ボローニャのラグー、ローマのカルボナーラ、ジェノヴァのジェノベーゼなど、地域ごとに名物パスタが違う。"],["🛶","車のない水の都ヴェネツィア","運河が道路代わりで、移動は水上バスやゴンドラ。街そのものが世界遺産。"]]},"スペイン":{"c":"太陽と情熱の国。夜は遅くから","f":[["🍷","夕食は夜9時以降","夕食は夜9〜10時ごろと遅め。その前にバルを何軒もはしごしてタパスをつまむのが楽しみ。"],["⛪","今も建設中のサグラダ・ファミリア","1882年の着工から今も建設が続くバルセロナの教会。ガウディの作品群は世界遺産。"],["🕌","アルハンブラ宮殿","グラナダのアルハンブラ宮殿は、イスラム建築の最高傑作と言われる。"]]},"イギリス":{"c":"紅茶と伝統と、入場無料の博物館","f":[["🏛️","大英博物館は入場無料","大英博物館やナショナル・ギャラリーなど、ロンドンの多くの国立博物館は入場無料。"],["🫖","アフタヌーンティー","3段のスタンドでサンドイッチやスコーンを楽しむアフタヌーンティーは、19世紀の貴族の習慣から生まれた。"],["🐰","湖水地方","ピーターラビットの作者ビアトリクス・ポターが愛した湖水地方は、世界遺産の美しい田園地帯。"]]},"ドイツ":{"c":"お城と森とビールの国","f":[["🏰","おとぎ話のようなお城","白亜のノイシュヴァンシュタイン城は、ディズニーのお城のモデルのひとつと言われる。"],["🌭","ソーセージは1,500種類以上","ドイツにはパンが数千種類、ソーセージは1,500種類以上あると言われる。地方ごとの味を食べ比べたい。"],["🎄","クリスマスマーケットの本場","冬になると街の広場にホットワインと手作り雑貨の屋台が並ぶ。"]]},"スイス":{"c":"アルプスと湖と、時間に正確な鉄道","f":[["🚞","鉄道で標高3,000m超の展望台へ","時間に正確なことで知られる鉄道網。登山鉄道で標高3,454mのユングフラウヨッホまで行ける。"],["🗣️","公用語は4つ","ドイツ語・フランス語・イタリア語・ロマンシュ語の4つ。地域によって話す言葉が変わる。"],["🕊️","永世中立国","ジュネーブには国連の欧州本部や赤十字国際委員会の本部が置かれている。"]]},"トルコ":{"c":"アジアとヨーロッパにまたがる国","f":[["🌉","2つの大陸にまたがる街","イスタンブールはボスポラス海峡をはさんで、アジアとヨーロッパの両方に市街地がある。"],["🎈","カッパドキアの気球","奇岩が続くカッパドキアでは、早朝に100機以上の気球が空に浮かぶ。"],["🍢","世界三大料理のひとつ","トルコ料理は、フランス料理・中華料理と並ぶ世界三大料理と言われる。"]]},"アメリカ":{"c":"国立公園は63か所。本当の魅力は大自然","f":[["🏞️","国立公園は63か所","イエローストーンやグランドキャニオンなど、国立公園は63か所。世界初の国立公園もアメリカで生まれた。"],["🗺️","州ごとに別の国のよう","50の州で法律も文化も食べ物も違う。ニューヨークとテキサスでは同じ国とは思えないほど。"],["🎭","毎晩ミュージカル","ニューヨークのブロードウェイには40ほどの劇場があり、毎晩ミュージカルが上演されている。"]]},"ハワイ":{"c":"日本から約7時間の楽園。実は火山の島","f":[["🌋","今も成長中の火山島","ハワイ島のキラウエア火山は世界有数の活火山。流れ出た溶岩が冷えて、島は今も広がっている。"],["🌺","「アロハ」の意味","ハワイの言葉「アロハ」には、こんにちは・ありがとう・愛など、たくさんの意味が込められている。"],["🍙","日系移民の歴史と食","明治時代から多くの日本人が移り住んだ。スパムむすびやロコモコには、日系の食文化が溶け込んでいる。"]]},"ドバイ":{"c":"砂漠に生まれた未来都市","f":[["🏙️","世界一高いビル","ブルジュ・ハリファは高さ828mで世界一高いビル。展望台からは砂漠と海を一望できる。"],["⚓","数十年で漁村から世界都市へ","かつては真珠採りの小さな港町だった。石油と貿易で、数十年のうちに世界的な都市に変わった。"],["🐪","デザートサファリ","四輪駆動車で砂丘を駆け抜けて、砂漠のキャンプでBBQディナーを楽しむツアーが人気。"]]},"ニュージーランド":{"c":"手つかずの自然と、映画の世界","f":[["🌿","国土の約3分の1が保護区","国立公園や自然保護区が国土の約3分の1を占め、トレッキングコースが整備されている。"],["🗳️","世界で初めて女性が投票した国","1893年、世界で初めて女性に国政選挙の投票権を認めた国。"],["🎬","映画の世界がそのまま","『ロード・オブ・ザ・リング』のロケ地が各地に残り、ホビット村のセットは見学できる。"]]},"カナダ":{"c":"大自然とオーロラ、多文化の国","f":[["🌌","オーロラ観測の名所","イエローナイフは晴れの日が多く、オーロラ観測の好条件がそろう。3泊すれば見られる確率がかなり高いと言われる。"],["🌲","湖の数は世界一とも","世界で2番目に広い国で、国土の約4割が森林。湖の数は世界一とも言われる。"],["📚","『赤毛のアン』の島","プリンス・エドワード島は『赤毛のアン』の舞台。物語の家を見に、日本からも多くのファンが訪れる。"]]},"フィリピン":{"c":"7,000を超える島々の楽園","f":[["🏝️","7,000以上の島々","大小7,000以上の島々に、白砂のビーチやダイビングスポットが点在する。"],["🦈","ジンベエザメと泳げる","セブ島南部では、世界最大の魚ジンベエザメと一緒に泳げることがある。"],["🌾","「天国への階段」の棚田","ルソン島北部のコルディリェーラの棚田は「天国への階段」と呼ばれる世界遺産。"]]},"オランダ":{"c":"干拓でつくった国と、花と自転車","f":[["🌊","国土の約4分の1が海面下","干拓と堤防で国土を広げてきた国。「世界は神が創ったが、オランダはオランダ人が創った」という言葉もある。"],["🌷","春だけ開く花の楽園","キューケンホフ公園は春の約2か月間だけ開園し、700万株以上の球根の花が咲きそろう。"],["🚲","自転車が人口より多い","国民一人あたり1台以上の自転車があり、自転車専用道が国中に張り巡らされている。"]]},"エジプト":{"c":"5,000年の歴史が地上にある国","f":[["🔺","唯一現存する世界七不思議","ギザの大ピラミッドは約4,500年前に建てられた。古代の世界七不思議で、今も残っているのはこれだけ。"],["🌊","ナイルが育てた文明","国土の9割以上が砂漠で、暮らしはナイル川沿いに集中している。川沿いだけが細長い緑の帯になっている。"],["🏛️","大エジプト博物館","ギザの大エジプト博物館では、ツタンカーメン王の財宝がまとめて展示されている。"]]},"メキシコ":{"c":"古代文明と、カラフルな祭りの国","f":[["💀","明るく死者を迎える「死者の日」","11月初めの「死者の日」は、亡くなった家族を明るく迎える祭り。マリーゴールドとガイコツの飾りで街が彩られる。"],["🌮","メキシコ料理はユネスコ無形文化遺産","伝統的なメキシコ料理はユネスコ無形文化遺産に登録されている。トウモロコシ・豆・唐辛子が基本。"],["🛕","マヤとアステカの遺跡","ピラミッドを持つ古代遺跡や植民地時代の町並みなど、世界遺産の数は南北アメリカで最多。"]]},"ペルー":{"c":"インカの天空都市と、美食の国","f":[["⛰️","20世紀まで知られなかった天空都市","山の尾根に築かれたマチュピチュは、1911年に外の世界に広く知られるまで、ひっそりと眠っていた。"],["🍽️","南米屈指の美食の国","ペルーは南米有数の美食の国として知られ、首都リマには世界的な名店が集まる。"],["🥔","じゃがいものふるさと","アンデスはじゃがいもの原産地で、ペルーには数千もの品種があると言われる。"]]},"ブラジル":{"c":"地球の裏側に、世界最大の日系人社会","f":[["🇯🇵","約200万人の日系人","1908年の移民船「笠戸丸」から始まった移住で、今では約200万人の日系人が暮らす。"],["🌳","アマゾンは世界最大の熱帯雨林","アマゾンの熱帯雨林には、地球上の生き物の種の約1割が暮らしていると言われる。"],["💦","大小275の滝が連なるイグアスの滝","イグアスの滝は世界最大級の滝。展望台からは、轟音とともに水煙が上がる。"]]},"フィンランド":{"c":"サウナと森と、世界一幸福な国","f":[["😊","幸福度ランキング連続1位","国連の世界幸福度報告で、何年も連続で1位を獲得している。"],["🧖","サウナはユネスコ無形文化遺産","人口約560万人に対して、サウナは約300万あると言われる。2020年にユネスコ無形文化遺産に登録された。"],["🎅","一年中サンタに会える村","北極圏のロヴァニエミにはサンタクロース村があり、一年中サンタクロースに会える。"]]},"チェコ":{"c":"中世の街並みと、ビールと人形劇の国","f":[["🏰","1000年分の建築が残る古都","プラハは大きな戦災をまぬがれ、ロマネスクからアール・ヌーヴォーまで、1000年分の建築が残っている。"],["🍺","ビール消費量は世界一","国民一人当たりのビール消費量は30年近く世界一。黄金色のピルスナーはチェコのプルゼニ生まれ。"],["🎎","人形劇はユネスコ無形文化遺産","マリオネットの人形劇はチェコの伝統文化で、ユネスコ無形文化遺産にも登録されている。"]]},"モロッコ":{"c":"迷宮の旧市街とサハラ砂漠","f":[["🧭","世界最大級の迷宮都市フェズ","フェズの旧市街には9,000本以上の路地があると言われる。迷うこと自体が楽しい世界遺産。"],["🏜️","サハラ砂漠で一泊","砂丘の中のテントに泊まると、満天の星空と、砂丘から昇る朝日が待っている。"],["💙","青い街シャウエン","山あいの町シャウエンは、家々の壁が青く塗られた、写真映えする町。"]]},"ギリシャ":{"c":"西洋文明のふるさとと、エーゲ海の島々","f":[["🏛️","民主主義とオリンピックのふるさと","古代ギリシャで民主政が生まれ、オリンピアで古代オリンピックが開かれた。"],["🏝️","島の数は6,000以上","エーゲ海やイオニア海には6,000以上の島があり、人が住むのはそのうち200ほど。"],["🫒","地中海の健康食","オリーブオイル、野菜、ヨーグルトをたっぷり使う地中海料理は、ユネスコ無形文化遺産に登録されている。"]]}};
/* ===== 土地の魅力・旅の記録（記録はこの端末のブラウザにだけ保存） ===== */
function loadJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let STATS = loadJSON('okaeri_stats', {});   // 土地名 → {n:出会った回数, ok:正解回数}
let WANT = loadJSON('okaeri_want', []);     // 行ってみたい土地
function recordResult(name, ok){ const s = STATS[name] || {n:0, ok:0}; s.n++; if(ok) s.ok++; STATS[name] = s; saveJSON('okaeri_stats', STATS); }
function isWant(n){ return WANT.indexOf(n) >= 0; }
function toggleWant(n){ WANT = isWant(n) ? WANT.filter(x => x !== n) : WANT.concat([n]); saveJSON('okaeri_want', WANT); }
function wantLabel(n){ return isWant(n) ? '★ 行ってみたいリストに入れました' : '☆ 行ってみたい！'; }
function areaName(mode, region){ return (mode.key === 'intl' || region === '北海道' || region === '沖縄') ? region : region + '地方'; }
function regionStats(mode){
  const R = {}, order = [];
  mode.places.forEach(p => {
    if(!R[p.region]){ R[p.region] = {region:p.region, total:0, met:0, n:0, ok:0}; order.push(p.region); }
    const r = R[p.region]; r.total++;
    const s = STATS[p.name]; if(s){ r.met++; r.n += s.n; r.ok += s.ok; }
  });
  return order.map(k => R[k]);
}
function weakStrong(mode){
  const rs = regionStats(mode).filter(r => r.n >= 2);
  if(rs.length < 2) return null;
  rs.sort((a,b) => (a.ok/a.n - b.ok/b.n) || (b.n - a.n));

function onAction(act, el){
  if(act!=='giveup') giveupArmed = 0;
  if(act==='hint'){
    if(revealHint()){ beep(660,0.08); const h=S.hints[S.revealed-1]; pushMe(questionFor(h)); pushGuest(h.text, guestCat(h)); }
    render();
  } else if(act==='openGuess' || act==='toggleGuess'){
    openSheet();
  } else if(act==='closeSheet'){
    closeSheet();
  } else if(act==='guess'){
    const name = el.getAttribute('data-name');
    pushMe('ズバリ、' + name + 'ですね！');
    const beforeRev = S.revealed; const r = guess(name);
    if(r.correct){ beep(880,0.15); setTimeout(()=>beep(1174,0.2),140); pushSys('🎉 正解！ '+name+' でした（'+r.pts+'点）','good'); }
    else if(r.exhausted){ beep(196,0.3); pushSys('❌ '+wrongLimit()+'回外してしまった… 答えは '+S.traveler.name+' でした','bad'); }
    else { beep(220,0.2);
      const nl = nearLine(name, S.traveler);
      const nlText = typeof nl==='string' ? nl : nl.line;
      pushSys('❌ '+name+' じゃないみたい…（-150点）','bad', name);
      S.log[S.log.length-1].near = typeof nl==='string' ? '' : nl.dir;
      pushGuest(nlText, '反応');
      if(S.revealed > beforeRev){ pushSys('旅行者がヒントを足してくれた'); pushGuest(S.hints[S.revealed-1].text, guestCat(S.hints[S.revealed-1])); }
    }
    render();
  } else if(act==='giveup'){
    if(giveupArmed > Date.now()){ giveupArmed = 0; giveUp(); beep(196,0.3); pushSys('ギブアップ… 答えは '+S.traveler.name+' でした','bad'); render(); }
    else { giveupArmed = Date.now() + 3000; render('instant'); setTimeout(()=>{ if(giveupArmed && giveupArmed<=Date.now() && S && S.phase==='ask'){ giveupArmed=0; render('instant'); } }, 3100); }
  } else if(act==='next'){
    if(nextTraveler()){
      if(S.phase==='final'){ beep(784,0.12); setTimeout(()=>beep(1046,0.25),120); render(); }
      else arriveTraveler(false);
    }
  } else if(act==='want'){
    const n = el.getAttribute('data-name'); toggleWant(n); beep(isWant(n)?990:440,0.08);
    document.querySelectorAll('[data-act="want"]').forEach(b => { if(b.getAttribute('data-name')===n){ b.classList.toggle('on', isWant(n)); b.textContent = wantLabel(n); } });
  } else if(act==='charm'){
    showCharm(el.getAttribute('data-name'));
  } else if(act==='locked'){
    showLocked(el.getAttribute('data-name'));
  } else if(act==='album'){
    renderAlbum(el.getAttribute('data-mode') || 'domestic', el.getAttribute('data-focus'));
  } else if(act==='mode-domestic'){
    ACTIVE = MODES.domestic; startRunUI();
  } else if(act==='mode-intl'){
    ACTIVE = MODES.intl; startRunUI();
  } else if(act==='home'){
    ACTIVE = null; S = null; startRunUI();
  } else if(act==='restart'){
    startRunUI();
  } else if(act==='share'){
    const wants = S.results.map(r => r.name).filter(isWant);
    const text = '✈️おかえり、どこ行ってた？【' + ACTIVE.label + '】\n' + S.total + '点／ランク「' + rankFor(S.total) + '」\n' + (wants.length ? '行ってみたくなった場所：' + wants.join('・') + '\n' : '') + '#おかえりどこ行ってた';
    const url = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SITE_URL);
    const w = window.open(url, '_blank', 'noopener');
    if(!w) location.href = url;

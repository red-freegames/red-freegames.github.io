<style>
/* 管理ゲーム風HUD：地図が画面いっぱい、上に資源バー、下に工事ツールバー。暗いガラス調パネル＋ティール/黄のアクセント */
:root{color-scheme:dark;--bg:#0f1a20;--panel:rgba(16,28,36,.92);--panel2:rgba(255,255,255,.06);--ink:#eef4f6;--sub:#9db1bc;--line:rgba(255,255,255,.12);--teal:#2fd0b5;--accent:#ff4b55;--ok:#3ddc8a;--warn:#ffb020;--ng:#ff5a67;--gold:#ffd54a;--dark:#0b1418}
*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.5;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:disabled{opacity:.4;cursor:default}
a{color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#cv.pan{cursor:grabbing}
.hud{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
/* 上：資源バー */
#topbar{position:fixed;left:10px;right:10px;top:10px;height:52px;display:flex;align-items:center;gap:14px;padding:0 10px 0 16px;z-index:5}
.tb-left{display:flex;align-items:baseline;gap:12px;flex:0 1 auto;overflow:hidden;white-space:nowrap}
.brand{font-size:10px;font-weight:900;letter-spacing:.08em;color:#ff8a8d;text-decoration:none}
.logo{font-size:19px;font-weight:900;letter-spacing:.04em}
.logo span{color:var(--gold)}
#stageLabel{font-size:13px;font-weight:800;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.tb-res{display:flex;gap:8px;flex:1;justify-content:center;overflow:hidden}
.res{flex:none;display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:4px 12px 4px 8px;height:40px}
.res>i{font-style:normal;font-size:20px}
.res small{display:block;font-size:10px;font-weight:800;color:var(--sub);line-height:1.1;white-space:nowrap}
.res b{display:block;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.mbar,.jbar{position:relative;width:90px;height:7px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.mbar i,.jbar i{display:block;height:100%;background:var(--ok);transition:width .3s,background .3s}
.jbar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
.tb-right{display:flex;gap:6px;align-items:center;flex:none}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{min-width:36px;height:34px;border-radius:8px;font-size:12px;font-weight:900;letter-spacing:-1px;color:var(--sub)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--teal);color:#05221d}
.ib{height:40px;min-width:40px;border-radius:10px;background:var(--panel2);font-size:16px;font-weight:900;padding:0 10px}
.ib:hover:not(:disabled){background:rgba(255,255,255,.14)}
.ib.on{background:var(--teal);color:#05221d}
.ib.txt{font-size:13px}
/* 左：目標パネル */
#quest{position:fixed;left:10px;top:72px;width:272px;padding:12px 14px;z-index:4}
#quest h3{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;color:var(--teal);letter-spacing:.04em}
#quest h3 button{width:24px;height:24px;border-radius:6px;background:var(--panel2);font-weight:900}
#quest.min #qBody{display:none}
#goalText{margin-top:6px;font-size:13.5px}
#goalText .tg{display:inline-block;background:rgba(255,90,103,.18);color:#ff9aa3;font-weight:900;border-radius:6px;padding:0 6px}
#goalText small{display:block;margin-top:6px;color:var(--sub);font-size:12px;line-height:1.6}
#spark{width:100%;height:52px;display:block;margin-top:10px;border-radius:8px}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:12px;color:var(--sub);margin-top:8px}
.kvs b{color:var(--ink);font-variant-numeric:tabular-nums;float:right}
#warn{display:none;margin-top:8px;font-size:12px;font-weight:800;color:#ffd0d4;background:rgba(255,90,103,.2);border-radius:8px;padding:5px 8px}
/* 下：工事ツールバー */
#dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5}
#hoverInfo{font-size:12.5px;padding:6px 14px;border-radius:99px;white-space:nowrap;color:var(--sub);max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#hoverInfo b{color:var(--ink)}
#hoverInfo .ng{color:var(--ng);font-weight:800}
#toolbar{display:flex;gap:8px;padding:8px}
.tool{position:relative;width:96px;height:84px;border-radius:12px;background:var(--panel2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s}
.tool:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.tool.on{border-color:var(--teal);background:rgba(47,208,181,.18);box-shadow:0 0 0 3px rgba(47,208,181,.25)}
.tool .ic{font-size:26px;line-height:1.1}
.tool b{font-size:13px;font-weight:900}
.tool small{font-size:10px;color:var(--sub);font-weight:700;white-space:nowrap}
.tsep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}
.tool.act{width:76px}
.tool.act .ic{font-size:24px;font-weight:900;color:var(--gold)}
.tool:disabled{transform:none;background:var(--panel2)}
.tool kbd{position:absolute;left:6px;top:5px;font-family:inherit;font-size:10px;font-weight:900;color:var(--sub);background:rgba(0,0,0,.35);border-radius:4px;padding:0 5px}
/* 右下：本番テスト */
#bTest{position:fixed;right:12px;bottom:12px;z-index:5;width:210px;padding:14px 12px;border-radius:14px;background:linear-gradient(#ff5a63,#e3262f);color:#fff;font-size:18px;font-weight:900;border:2px solid rgba(255,255,255,.25);box-shadow:0 6px 0 #8f1218,0 10px 24px rgba(0,0,0,.4)}
#bTest:hover:not(:disabled){filter:brightness(1.08)}
#bTest:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #8f1218}
#bTest small{display:block;font-size:11px;font-weight:700;opacity:.9}
#camHint{position:fixed;right:12px;bottom:108px;z-index:4;font-size:11px;color:var(--sub);padding:5px 10px;border-radius:10px;text-align:right;line-height:1.6}
#camHint button{font-size:11px;font-weight:800;color:var(--teal)}
/* 本番テスト中 */
#testHud{position:fixed;left:50%;top:72px;transform:translateX(-50%);display:none;align-items:center;gap:14px;padding:8px 16px;z-index:5;font-weight:900}
#testHud.on{display:flex}
#testHud .clk{font-size:24px;font-variant-numeric:tabular-nums}
#testHud small{font-size:11px;color:var(--sub);display:block}
#testHud .pb{width:220px;height:9px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
#testHud .pb i{display:block;height:100%;background:var(--gold)}
#testHud button{font-size:12px;font-weight:800;border:1.5px solid var(--line);border-radius:99px;padding:4px 12px}
/* 市民の声 */
#voice{position:fixed;left:12px;bottom:14px;z-index:3;font-size:12.5px;font-weight:700;display:flex;flex-direction:column-reverse;gap:5px;pointer-events:none;max-width:min(340px,30vw)}
#voice div{display:flex;gap:6px;align-items:flex-end;animation:vin .35s ease-out}
#voice span{flex:none;font-size:18px;line-height:1.1}
#voice p{background:rgba(255,255,255,.95);color:#15232b;border-radius:12px 12px 12px 3px;padding:4px 10px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#voice div:nth-child(2){opacity:.75}
#voice div:nth-child(3){opacity:.45}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
#tipc{position:fixed;pointer-events:none;font-size:12px;font-weight:800;background:rgba(10,18,22,.92);color:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap;display:none;transform:translate(16px,16px);z-index:6}
#tipc.ng{background:rgba(200,30,48,.95)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:rgba(10,18,22,.94);border:1px solid var(--line);color:#fff;font-weight:800;font-size:14px;border-radius:10px;padding:8px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:7}
#toast.on{opacity:1}
/* モーダル */
#ov{position:fixed;inset:0;display:none;background:rgba(6,12,15,.6);z-index:10;padding:24px;overflow-y:auto}
#ov.on{display:flex}
.card{background:#15232d;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:24px 28px;max-width:660px;width:100%;margin:auto}
.card h2{font-size:24px;font-weight:900;line-height:1.3}
.card h2 small{display:block;font-size:12px;color:var(--teal);font-weight:800;letter-spacing:.1em}
.card p{margin-top:8px}
.title{text-align:center}
.title .logo{font-size:68px;letter-spacing:.08em;line-height:1.1;text-shadow:4px 4px 0 #000}
.title .catch{font-weight:800;margin-top:10px;color:var(--sub)}
.title .feat{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.title .feat span{font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.cta{display:inline-block;margin-top:18px;font-size:18px;font-weight:900;background:linear-gradient(#ff5a63,#e3262f);color:#fff;border-radius:14px;padding:12px 40px;box-shadow:0 5px 0 #8f1218;text-decoration:none}
.cta:hover{filter:brightness(1.08)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1218}
.cta.sub{background:var(--panel2);border:1px solid var(--line);box-shadow:none;font-size:15px;padding:10px 22px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.sc{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.sc:hover:not(:disabled){border-color:var(--teal);background:rgba(47,208,181,.12)}
.sc small{font-size:11px;font-weight:900;color:var(--sub)}
.sc b{display:block;font-size:15px;font-weight:900;line-height:1.3;margin:2px 0}
.sc .st{color:var(--gold);font-size:16px;letter-spacing:2px}
.sc .st i,.result .stars i{color:rgba(255,255,255,.18);font-style:normal}
.boss{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.boss .av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:28px}
.boss .say{background:var(--panel2);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:14.5px;line-height:1.8}
.boss .say b{display:block;font-size:11px;color:var(--teal)}
.goalbox{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goalbox div,.cmp div{background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:center}
.goalbox small,.cmp small{display:block;font-size:11px;font-weight:800;color:var(--sub)}
.goalbox b{font-size:18px;font-weight:900}
.hint{margin-top:12px;font-size:13px;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.3);border-radius:10px;padding:8px 12px;color:#ffe2a8}
.result .verdict{font-size:30px;font-weight:900;text-align:center;line-height:1.3}
.result .verdict.ok{color:var(--ok)}
.result .verdict.ng{color:var(--ng)}
.result .stars{text-align:center;font-size:42px;letter-spacing:8px;color:var(--gold);line-height:1.2;margin-top:4px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:12px;text-align:center}
.cmp b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.cmp .arr{font-size:24px;font-weight:900;color:var(--sub)}
.crit{margin-top:12px;font-size:13px;display:grid;gap:4px}
.crit div{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:8px;padding:4px 10px}
.crit .y{color:var(--ok);font-weight:900}
.crit .n{color:var(--sub);font-weight:900}
.share{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.share a,.share button{font-size:14px;font-weight:900;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-decoration:none;background:var(--panel2)}
.share .pri{background:linear-gradient(#ff5a63,#e3262f);border-color:transparent;color:#fff}
.share .x{background:#000;color:#fff}
.note{font-size:11.5px;color:var(--sub);text-align:center;margin-top:12px}
.help table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
.help td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.help td:first-child{white-space:nowrap;font-weight:900;width:1%;padding-right:12px}
.help kbd{font-family:inherit;font-size:11px;font-weight:900;border:1px solid var(--sub);border-radius:4px;padding:0 5px}
#mnote{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:12px;padding:4px;z-index:20}
/* 狭い画面：HUDを縮める */
@media (max-width:1440px){.brand,#stageLabel{display:none}.mbar,.jbar{width:64px}}
@media (max-width:1180px){.mbar,.jbar{width:60px}}
@media (max-width:980px){.logo{display:none}.res small,.mbar,.jbar{display:none}.res{padding:4px 10px 4px 6px}.seg button{min-width:30px}.ib{min-width:34px;padding:0 7px}#quest{width:230px}.tool{width:78px;height:72px}.tool small{display:none}#bTest{width:150px;font-size:15px}#camHint{display:none}#voice{display:none}}
@media (max-width:760px){.logo{display:none}.res>i{display:none}.mbar,.jbar{display:none}.ib.txt{display:none}#quest{top:auto;bottom:178px;width:220px}#quest:not(.min) .kvs{display:none}#mnote{display:block}#bTest{bottom:auto;top:72px;width:auto;padding:8px 14px}#bTest small{display:none}}

<body>
<canvas id="cv"></canvas>
<header id="topbar" class="hud">
  <div class="tb-left"><a class="brand" href="https://red-freegames.github.io/">RED FREE GAMES</a><div class="logo">渋滞<span>ほどき</span></div><div id="stageLabel"></div></div>

<script>
/* ===== 渋滞ほどき：ロジック（DOMに触らない。Node でも動く） ===== */
const W = 30, H = 20, N = W * H;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // 0=北 1=東 2=南 3=西
const OPP = d => (d + 2) & 3;
const T_GRASS = 0, T_WATER = 1, T_RAIL = 2, T_BLDG = 3, T_BLOCK = 4;

/* 物理（1マス≒50m、1秒≒ゲーム内30秒の感覚） */
const VMAX = 3.0, VTURN = 1.6, ACC = 5, DEC = 9, GAP = 0.45, HT = 0.25;
const STOP = 0.72;          // 交差点・踏切の停止線（進入側の辺上の位置）
const BOX_OUT = 0.22;       // 交差点を抜けたとみなす位置（退出側の辺上）
const GIVEUP = 30;          // これだけ止まり続けたら諦めて消える（秒）
const TEST_LEN = 120, WARMUP = 10;

/* 費用（万円） */
const COST = {
  road: 2000, evict: 8000, bridge: 12000, railBridge: 10000,
  widen: 1500, widenDeck: 4000, fly: 20000, railUp: 8000, removeOrig: 500,
};

    while (ui.acc >= DT && n < 16) {
      J.step(ui.sim, DT); ui.acc -= DT; n++;
      ui.histT += DT; if (ui.histT >= 0.5) { ui.histT = 0; ui.hist.push(ui.sim.now ? ui.sim.now.jam : 0); if (ui.hist.length > 400) ui.hist.shift(); }
      if (ui.phase === 'test' && J.testDone(ui.sim)) { finishTest(false); break; }
    }
    if (n === 16) ui.acc = 0;
    if (ui.sim.lastGone && ui.sim.m.giveup > (ui.gv || 0)) { ui.gv = ui.sim.m.giveup; if (Math.random() < 0.5) voice(pick(VOICE.giveup)); }
  }
  if (ui.phase === 'test' && ui.sim) {
    $('tclk').textContent = $('clk').textContent = clockStr(ui.st, ui.sim.t);
    $('pb').style.width = Math.min(100, ui.sim.t / J.TEST_LEN * 100) + '%';
    $('hudJam').textContent = `渋滞度 ${Math.round((ui.sim.now ? ui.sim.now.jam : 0) * 100)}%`;
  }
  if (ui.phase === 'build') { $('clk').textContent = ui.paused ? '一時停止' : '試運転中'; $('modeText').textContent = '工事中'; }
  else if (ui.phase === 'test') $('modeText').textContent = 'ラッシュ本番';
  if (ui.phase !== 'title') tickVoice(rdt);
  render();
  if (Math.floor(now / 250) !== frame.q) { frame.q = Math.floor(now / 250); refreshStats(); }
  requestAnimationFrame(frame);
}

/* ---------- オーバーレイ ---------- */
function openOv(html, kind, onClose) { const o = $('ov'); o.innerHTML = html; o.classList.add('on'); ui.ovKind = kind; ui.ovClose = onClose || null; }
function closeOv() { $('ov').classList.remove('on'); $('ov').innerHTML = ''; ui.ovKind = null; ui.ovClose = null; }
function starStr(n) { return '★'.repeat(n) + `<i>${'★'.repeat(3 - n)}</i>`; }
function showTitle() {
  ui.phase = 'title';
  if (!ui.st) { ui.st = J.STAGES[4]; ui.net = J.makeNet(ui.st); ui.cacheVer = -1; ui.sim = J.createSim(ui.st, ui.net, { mode: 'preview', seed: 3 }); ui.speed = 1; for (let k = 0; k < 900; k++) J.step(ui.sim, DT); }
  openOv(`<div class="card title">
    <div class="logo">渋滞<span>ほどき</span></div>
    <p class="catch">めちゃくちゃ混んでる道路を、予算内の工事でほどく交通パズル</p>
    <div class="feat"><span>全5ステージ</span><span>道路・橋・跨線橋・立体交差</span><span>PC向け・マウス操作</span></div>
    <div class="btns"><button class="cta" id="goStages">はじめる</button><button class="cta sub" id="goHelp">遊び方</button></div>
    <p class="note">実況・配信・動画投稿・収益化OK ／ <a href="https://red-freegames.github.io/">RED FREE GAMES</a> の他のゲームで遊ぶ</p>
  </div>`, 'title');
  $('goStages').onclick = showStages; $('goHelp').onclick = () => showHelp(showTitle);
}
function showStages() {
  const pr = store.get();
  const cards = J.STAGES.map((st, i) => {
    const s = pr.stars[st.id] || 0, open = i === 0 || (pr.stars[J.STAGES[i - 1].id] || 0) > 0;
    return `<button class="sc" data-si="${i}" ${open ? '' : 'disabled'}><small>STAGE ${i + 1}</small><b>${open ? esc(st.name) : '🔒 ？？？'}</b><span class="st">${starStr(s)}</span><br><small>予算 ${yen(st.budget)}</small></button>`;
  }).join('');
  const total = J.STAGES.reduce((a, st) => a + (pr.stars[st.id] || 0), 0);
  openOv(`<div class="card"><h2><small>道路課 案件一覧</small>どこの渋滞をほどく？</h2>
    <p style="font-size:13px;color:var(--sub)">クリアすると次の案件が開きます。集めた★ ${total} / ${J.STAGES.length * 3}</p>
    <div class="sgrid">${cards}</div>
    <div class="btns" style="margin-top:14px"><button class="cta sub" id="goHelp2">遊び方</button>${ui.phase === 'build' || ui.phase === 'result' ? '<button class="cta sub" id="goBack">閉じる</button>' : ''}</div></div>`, 'stages', ui.phase === 'build' ? closeOv : null);
  document.querySelectorAll('.sc').forEach(b => b.onclick = () => { closeOv(); loadStage(+b.dataset.si); });
  $('goHelp2').onclick = () => showHelp(showStages);
  if ($('goBack')) $('goBack').onclick = () => { if (ui.phase === 'result') showResult(); else closeOv(); };
}
function showBrief() {
  const st = ui.st, b = ui.base[st.id];
  openOv(`<div class="card"><h2><small>STAGE ${ui.si + 1}</small>${esc(st.name)}</h2>
    <div class="boss"><div class="av">👩‍💼</div><div class="say"><b>道路課 課長</b>${st.brief.map(esc).join('<br>')}</div></div>
    <div class="goalbox">
      <div><small>工事前の渋滞度</small><b style="color:var(--ng)">${b ? b.jam + '%' : '計測中…'}</b></div>
      <div><small>目標</small><b>${st.target}% 以下</b></div>
      <div><small>工事予算</small><b>${yen(st.budget)}</b></div>
    </div>
    <p class="hint">💡 ${esc(st.tip)}</p>
    <p style="font-size:12.5px;color:var(--sub);margin-top:10px">車の色は行き先の色。試運転を見ながら工事して、準備ができたら <b>▶ 本番テスト</b>（ラッシュの2時間）で判定します。</p>
    <div class="btns"><button class="cta" id="goBuild">工事を始める</button></div></div>`, 'brief', closeOv);
  $('goBuild').onclick = closeOv;
}
function showHelp(back) {
  openOv(`<div class="card help"><h2><small>HOW TO PLAY</small>遊び方</h2>
    <p>渋滞している街の道路を、<b>予算の範囲内</b>で工事して、本番テストの<b>渋滞度を目標以下</b>にするゲームです。車はそれぞれ行き先（車の色）に向かって、空いている道を自分で探して走ります。</p>
    <table>
      <tr><td>左ドラッグ</td><td>選んだ工事をする。道路はドラッグで線を引き、離すと着工</td></tr>
      <tr><td>右ドラッグ／<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></td><td>視点を動かす（右クリックで引きかけの道を取り消し）</td></tr>
      <tr><td>ホイール／<kbd>0</kbd></td><td>ズーム／全体を表示</td></tr>
      <tr><td><kbd>1</kbd>〜<kbd>4</kbd></td><td>道路／拡幅／立体化／撤去 を選ぶ</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> ／ <kbd>Ctrl</kbd>+<kbd>Y</kbd></td><td>工事を戻す ／ やり直す（下のバーのボタンでも可）</td></tr>
      <tr><td><kbd>Space</kbd> <kbd>F</kbd> <kbd>H</kbd></td><td>一時停止／速度切替／混雑表示</td></tr>
      <tr><td><kbd>Enter</kbd></td><td>本番テスト開始</td></tr>
    </table>
    <table>
      <tr><td>🛣️ 道路</td><td>空き地 2,000万円／建物は立ち退き込み 1億円／川の上は橋 1億2,000万円／線路の上は跨線橋 1億円。橋と線路の上は直線のみ</td></tr>
      <tr><td>↔️ 拡幅</td><td>隣り合う拡幅マスの間が2車線になる。広い交差点は一度に多く通せる</td></tr>
      <tr><td>🌉 立体化</td><td>交差点→立体交差（2億円。縦の道が上を通り、互いに待たない。右左折はできない）／踏切→跨線橋（8,000万円）</td></tr>
      <tr><td>🚧 撤去</td><td>道を減らすと流れが良くなることも</td></tr>
    </table>
    <p style="font-size:13px">交差点では、ぶつかる向きの車が交互に通ります。踏切では一時停止し、電車が来ると長く待たされます。<br>★は「クリア」「渋滞度を目標の半分以下」「予算を3割以上残す」の3つ。</p>
    <div class="btns"><button class="cta" id="helpOk">わかった</button></div></div>`, 'help', () => back ? back() : closeOv());
  $('helpOk').onclick = () => back ? back() : closeOv();
}
function showResult() {
  const st = ui.st, r = ui.result, sc = r.sc, b = ui.base[st.id] || { jam: '?', avgT: 0 };
  const ok = r.stars > 0;
  const next = ui.si + 1 < J.STAGES.length;
  const lines = !ok ? ['うーん、まだ詰まってるね。', '混雑表示（H）で、どこで止まってるか見てみて。交差点？ 踏切？ 橋？']
    : r.stars === 3 ? ['完璧！ 予算も残ってるし、言うことなし。', '市民から感謝の電話が鳴りやまないよ。'] : r.stars === 2 ? ['いいね、渋滞がほどけた！', 'もうひと工夫で★3も狙えるかも。'] : ['ギリギリだけど、なんとか通った！', '市民の声は「まあマシになった」くらいかな。'];
  const text = `『渋滞ほどき』STAGE${ui.si + 1}「${st.name}」\n渋滞度 ${b.jam}% → ${sc.jam}%　${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}\n予算 ${yen(st.budget - r.used)} 残し\n#渋滞ほどき #REDFREEGAMES`;
  openOv(`<div class="card result">
    <div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '渋滞、ほどけた！' : 'まだ渋滞してる…'}</div>
    <div class="stars">${starStr(r.stars)}</div>${r.best ? '<p style="text-align:center;font-weight:900;color:var(--warn)">ベスト更新！</p>' : ''}
    <div class="cmp"><div><small>工事前の渋滞度</small><b style="color:var(--ng)">${b.jam}%</b></div><div class="arr">→</div><div><small>工事後（目標 ${st.target}%以下）</small><b style="color:${ok ? 'var(--ok)' : 'var(--ng)'}">${sc.jam}%</b></div></div>
    <div class="cmp"><div><small>平均の所要時間</small><b>${Math.round(b.avgT)}分</b></div><div class="arr">→</div><div><small>工事後</small><b>${Math.round(sc.avgT)}分</b></div></div>
    <div class="crit">
      <div><span>渋滞度 ${st.target}% 以下（クリア）</span><span class="${ok ? 'y' : 'n'}">${ok ? '★ 達成' : '未達成'}</span></div>
      <div><span>渋滞度 ${Math.floor(st.target / 2)}% 以下</span><span class="${ok && sc.jam <= Math.floor(st.target / 2) ? 'y' : 'n'}">${ok && sc.jam <= Math.floor(st.target / 2) ? '★ 達成' : '未達成'}</span></div>
      <div><span>予算を3割以上残す（使用 ${yen(r.used)}）</span><span class="${ok && r.used <= st.budget * 0.7 ? 'y' : 'n'}">${ok && r.used <= st.budget * 0.7 ? '★ 達成' : '未達成'}</span></div>
      <div><span>到着した車 ／ 諦めて引き返した車</span><span>${sc.arrived}台 ／ ${sc.giveup}台</span></div>
    </div>
    <div class="boss"><div class="av">👩‍💼</div><div class="say"><b>道路課 課長</b>${lines.map(esc).join('<br>')}</div></div>
    <div class="share">
      <button id="rBack">🛠 設計を続ける</button>
      ${ok && next ? '<button class="pri" id="rNext">次の案件へ ▶</button>' : ''}
      ${ok && !next ? '<button class="pri" id="rAll">案件一覧へ</button>' : ''}
      <a class="x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(GAME_URL)}" target="_blank" rel="noopener">𝕏 結果をポスト</a>
    </div>
    ${ok && !next ? '<p class="note" style="font-size:13px;font-weight:800;color:var(--ink)">全案件クリア、おつかれさま！ ★3を集めて、最小予算の設計を探してみて。</p>' : ''}
    <p class="note">このゲームはフィクションです。交通の動きはゲーム用に単純化しています。<br>実況・配信・動画投稿・収益化OK ／ <a href="https://red-freegames.github.io/">RED FREE GAMES</a> の他のゲームで遊ぶ</p>
  </div>`, 'result', backToBuild);
  $('rBack').onclick = backToBuild;
  if ($('rNext')) $('rNext').onclick = () => { closeOv(); loadStage(ui.si + 1); };
  if ($('rAll')) $('rAll').onclick = showStages;
}

/* ---------- ボタン ---------- */
document.querySelectorAll('.tool[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('bTest').onclick = startTest;
$('bPause').onclick = togglePause;
document.querySelectorAll('#speedSeg [data-sp]').forEach(b => b.onclick = () => setSpeed(+b.dataset.sp));
$('bFit').onclick = fitCam;
$('qToggle').onclick = () => { ui.qUser = true; const q = $('quest'); q.classList.toggle('min'); $('qToggle').textContent = q.classList.contains('min') ? '+' : '−'; fitCam(); };
$('bHeat').onclick = toggleHeat;
$('bUndo').onclick = undo;
$('dUndo').onclick = undo;
$('dRedo').onclick = redo;
$('bReset').onclick = resetNet;
$('bSkip').onclick = () => { if (ui.phase === 'test') finishTest(true); };
$('bStages').onclick = () => { if (ui.phase === 'test') return toast('本番テスト中です'); showStages(); };
$('bHelp').onclick = () => showHelp(ui.phase === 'title' ? showTitle : null);

resize();
syncSpeed();
showTitle();
refreshSide();
requestAnimationFrame(frame);
globalThis.__JH_UI__ = { ui, cam, fitCam, closeOv, loadStage, startTest, finishTest, backToBuild, setTool, endDrag, extendPath, render, showStages };
</script>

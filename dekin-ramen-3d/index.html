<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>出禁ラーメン3D</title>
<meta name="description" content="ルールが厳しすぎるラーメン屋を一人称3Dで体験する客側サバイバル。全5軒、怒られずに食べ切れ。">
<meta name="theme-color" content="#17110c">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#17110c;--ink:#f7ead1;--sub:#c9b18c;--panel:rgba(20,13,9,.84);--line:#000;
  --red:#9e2a1c;--red2:#ff6b4a;--gold:#e8b64c;--green:#7bc47f;
  --paper:#f7ead1;--paper-ink:#2a1a10;--paper-sub:#6b5640;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* ---------- エラー ---------- */
#err3d{position:fixed;inset:0;z-index:99;display:none;place-items:center;text-align:center;padding:24px;background:var(--bg);font-weight:700;line-height:1.8}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5;pointer-events:none}
#hudTop{top:calc(8px + var(--sat));left:calc(8px + var(--sal));right:calc(8px + var(--sar));display:none;align-items:center;gap:10px;
  background:var(--panel);border:2px solid #000;border-radius:12px;padding:6px 10px}
body.playing #hudTop{display:flex}
#hudShop{font-weight:900;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudScore{font-weight:900;font-size:13px;color:var(--gold);white-space:nowrap}
.ira{display:flex;align-items:center;gap:6px}
.ira small{font-size:10px;color:var(--sub);font-weight:700}
#hudFace{font-size:20px;line-height:1}
.gauge{height:10px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.gauge>div{height:100%;width:100%;transform-origin:left center;transform:scaleX(0)}
#hudIraWrap{width:min(26vw,140px)}
#hudIra{background:var(--green)}
#hudIra.lv1{background:var(--gold)}#hudIra.lv2{background:#e67e22}#hudIra.lv3{background:#e74c3c}
#objective{top:calc(58px + var(--sat));left:50%;transform:translateX(-50%);display:none;max-width:min(92vw,520px);
  background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:5px 12px;font-size:13px;text-align:center;line-height:1.45}
@media (max-width:480px){#objective{font-size:12px}}
#objective b{color:var(--gold)}
body.playing #objective{display:block}
#crosshair{left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.55);display:none}
body.playing #crosshair{display:block}
#prompt{left:50%;bottom:calc(150px + var(--sab));transform:translateX(-50%);display:none;background:var(--panel);border:2px solid var(--gold);
  border-radius:99px;padding:6px 16px;font-weight:900;font-size:14px;white-space:nowrap}
body.touch #prompt{display:none!important}
#toast{top:calc(124px + var(--sat));left:50%;transform:translateX(-50%);z-index:30;display:none;max-width:min(92vw,480px);
  background:rgba(20,13,9,.92);border:2px solid #555;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;line-height:1.55;text-align:center}
#toast.good{border-color:var(--green)}#toast.bad{border-color:#e74c3c}
#banner{top:38%;left:50%;transform:translate(-50%,-50%);z-index:30;display:none;max-width:94vw;background:var(--red);color:#fff;border:3px solid #000;
  border-radius:10px;padding:12px 18px;font-size:clamp(18px,5.4vw,28px);font-weight:900;text-align:center;box-shadow:0 6px 0 #000;animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 6px),-50%) rotate(-1deg)}75%{transform:translate(calc(-50% + 6px),-50%) rotate(1deg)}}

/* ---------- 食事パネル ---------- */
#eatPanel{left:calc(10px + var(--sal));bottom:calc(16px + var(--sab));width:min(56vw,300px);display:none;background:var(--panel);
  border:2px solid #000;border-radius:12px;padding:8px 10px}
#eatPanel .row{display:grid;grid-template-columns:4.6em 1fr auto;white-space:nowrap;align-items:center;gap:6px;margin:3px 0;font-size:11px;font-weight:900}
#eatPanel .gauge{height:12px}
#eatRemain{background:#e6a33c}#eatPress{background:#e74c3c}#eatTime{background:#5dade2}
#eatTimeTxt{min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 操作ボタン ---------- */
#controls{position:fixed;z-index:6;right:calc(12px + var(--sar));bottom:calc(14px + var(--sab));display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#controls .row{display:flex;gap:10px}
.abtn{pointer-events:auto;display:none;align-items:center;justify-content:center;border:3px solid #000;color:#fff;font-weight:900;cursor:pointer;
  font-family:inherit;touch-action:none;box-shadow:0 5px 0 #000;transition:transform .05s}
.abtn.show{display:flex}
.abtn:active,.abtn.press{transform:translateY(4px);box-shadow:0 1px 0 #000}
.abtn.mini{width:60px;height:60px;border-radius:50%;background:#37474f;font-size:24px;flex-direction:column}
.abtn.mini span{font-size:9px;line-height:1;margin-top:1px}
#btnAct{min-height:64px;min-width:150px;max-width:min(62vw,300px);padding:8px 18px;border-radius:18px;background:var(--gold);color:#2a1a10;font-size:16px;line-height:1.3;text-align:center}
#btnSlurp{width:112px;height:112px;border-radius:50%;background:var(--red);font-size:24px;flex-direction:column}
#btnSlurp span{font-size:11px;opacity:.8}
#btnBow{position:fixed;z-index:7;left:50%;top:60%;transform:translate(-50%,-50%);padding:14px 30px;border-radius:99px;background:var(--gold);color:#2a1a10;font-size:22px;animation:pulse .5s infinite alternate}
#btnBow:active{transform:translate(-50%,calc(-50% + 4px))}
@keyframes pulse{from{box-shadow:0 5px 0 #000,0 0 0 0 rgba(232,182,76,.7)}to{box-shadow:0 5px 0 #000,0 0 0 14px rgba(232,182,76,0)}}
.kbd{display:none;font-size:10px;opacity:.75;font-weight:700}
body:not(.touch) .kbd{display:inline}

/* ---------- 仮想スティック ---------- */
#joy{position:fixed;z-index:4;left:0;top:0;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28);pointer-events:none;display:none;opacity:.55;will-change:transform}
#joy.active{opacity:1}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(0,0,0,.4);will-change:transform}
body.touch.playing.can-walk #joy{display:block}
body.ui-open #controls,body.ui-open #joy,body.ui-open #prompt,body.ui-open #crosshair,body.ui-open #btnBow{display:none!important}

/* ---------- オーバーレイ ---------- */
#overlay{position:fixed;inset:0;z-index:20;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(10,6,4,.74);
  padding:calc(12px + var(--sat)) calc(10px + var(--sar)) calc(16px + var(--sab)) calc(10px + var(--sal));-webkit-user-select:text;user-select:text}
.sheet{max-width:520px;margin:0 auto;padding:6px 0 20px}
.noren{background:var(--red);color:#fff;text-align:center;padding:16px 12px 26px;border-radius:6px 6px 0 0;border-top:8px solid #3a2414;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 14px) no-repeat,repeating-linear-gradient(90deg,#000 0 calc(25% - 3px),transparent calc(25% - 3px) 25%) bottom/100% 14px no-repeat;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 14px) no-repeat,repeating-linear-gradient(90deg,#000 0 calc(25% - 3px),transparent calc(25% - 3px) 25%) bottom/100% 14px no-repeat}
.noren .t1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:34px;font-weight:900;letter-spacing:.06em;line-height:1.2;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.noren .t2{font-size:13px;font-weight:700;margin-top:4px;opacity:.92}
.card{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:14px;margin-top:10px}
.noren+.card{margin-top:6px}
.card h3{font-size:14px;font-weight:900}
.txt{font-size:14px;line-height:1.75}
.small{font-size:12px;line-height:1.6;color:var(--paper-sub)}
.center{text-align:center}
.btn{display:block;width:100%;margin-top:10px;padding:14px 14px;min-height:52px;font:inherit;font-size:16px;font-weight:900;border-radius:12px;border:2px solid var(--paper-ink);
  background:#fff;color:var(--paper-ink);box-shadow:0 4px 0 var(--paper-ink);cursor:pointer;text-align:left;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper-ink)}
.btn.primary{background:var(--red);color:#fff;text-align:center}
.btn.ghost{background:transparent;text-align:center}
.btn.gold{background:var(--gold);text-align:center}
.rulelist{list-style:none;margin-top:8px}
.rulelist li{padding:8px 2px;border-bottom:1px dashed #c9b18c;font-size:14px;line-height:1.55}
.rulelist li.locked{opacity:.55}
.tag{display:inline-block;font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px;margin-right:6px;color:#fff;vertical-align:2px}
.tag-omote{background:var(--red)}.tag-ura{background:#4a235a}
.mission{margin-top:12px;background:var(--paper-ink);color:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.75}
.mission b{color:var(--gold)}
.say{margin-top:10px;background:#fff;border:2px solid var(--paper-ink);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.6}
.card .gauge{height:12px;border-color:rgba(0,0,0,.25)}
#callBar{background:linear-gradient(90deg,#e74c3c,#e8b64c 40%,#7bc47f);transform:scaleX(1)}
.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket{background:#263238;color:#fff;border-radius:10px;padding:16px 8px;text-align:center;cursor:pointer;border:2px solid #000;box-shadow:inset 0 -5px 0 rgba(0,0,0,.4);touch-action:manipulation}
.ticket:active{transform:translateY(2px)}
.ticket .nm{font-size:14px;font-weight:900;line-height:1.35}
.ticket .pr{font-size:13px;color:var(--gold);font-weight:900;margin-top:4px}
.cert{position:relative;margin-top:10px;background:var(--paper);color:#3a2a12;border:5px double #8a6d2f;border-radius:6px;padding:18px 14px 22px;text-align:center}
.cert .ct{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:26px;font-weight:900}
.cert .cb{font-size:13px;line-height:1.9;margin-top:8px}
.stamp{position:absolute;right:12px;bottom:12px;width:64px;height:64px;border-radius:50%;border:3px solid #c0392b;color:#c0392b;display:grid;place-items:center;
  font-weight:900;font-size:16px;transform:rotate(-14deg);opacity:.85}
.face{font-size:64px;line-height:1.1}
.sens{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;font-weight:700;color:var(--paper-sub)}
.sens input{flex:1;accent-color:var(--red)}
footer{text-align:center;font-size:11px;color:var(--sub);margin-top:14px;line-height:1.7}
@media (max-height:520px){#btnSlurp{width:92px;height:92px}.abtn.mini{width:52px;height:52px}#prompt{bottom:calc(110px + var(--sab))}}
</style>
</head>
<body>
<canvas id="c3d" tabindex="-1"></canvas>
<div id="err3d">3D表示の読み込みに失敗しました。<br>通信環境を確認して、ページを再読み込みしてください。</div>

<div id="hudTop" class="hud">
  <div id="hudShop"></div>
  <div id="hudScore"></div>
  <div class="ira"><small>イラつき</small><div id="hudIraWrap" class="gauge"><div id="hudIra"></div></div><span id="hudFace">😐</span></div>
</div>
<div id="objective" class="hud"></div>
<div id="crosshair" class="hud"></div>
<div id="prompt" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="banner" class="hud"></div>

<div id="eatPanel" class="hud">
  <div class="row"><span>残り</span><div class="gauge"><div id="eatRemain"></div></div><span></span></div>
  <div class="row"><span>店主の圧</span><div class="gauge"><div id="eatPress"></div></div><span></span></div>
  <div class="row"><span>制限時間</span><div class="gauge"><div id="eatTime"></div></div><span id="eatTimeTxt"></span></div>
</div>

<div id="joy"><div id="joyKnob"></div></div>
<button id="btnBow" class="abtn" type="button">🙇 会釈する <span class="kbd">&nbsp;[B]</span></button>
<div id="controls">
  <div class="row">
    <button id="btnPhone" class="abtn mini" type="button">📱<span>スマホ</span></button>
    <button id="btnCam" class="abtn mini" type="button">📷<span>撮影</span></button>
    <button id="btnTissue" class="abtn mini" type="button">🧻<span>ティッシュ</span></button>
  </div>
  <button id="btnAct" class="abtn" type="button"></button>
  <button id="btnSlurp" class="abtn" type="button">すする<span class="kbd">[Space]</span></button>
</div>

<div id="overlay"></div>

<!-- Three.js r128（ライブラリ本体はCDNから読み込み） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
if (typeof THREE === 'undefined') { document.getElementById('err3d').style.display = 'grid'; throw new Error('three.js not loaded'); }

/* =====================================================================
 * 1. 定数（ゲームバランスの数値は現行版と同一）
 * ===================================================================== */
const SAVE_KEY = { RULES: 'dekin3d_rules', BEST: 'dekin3d_best', SENS: 'dekin3d_sens' };

/** フェイズ（1軒の中の進行段階） */
const PH = Object.freeze({
  ARRIVE: 'arrive',     // 到着。食券を買って列へ
  QUEUE: 'queue',       // 列に並んでいる
  ENTER: 'enter',       // 呼ばれた。指定席へ
  WAIT_CALL: 'waitCall',// 着席。店主の声待ち
  CALL: 'call',         // 好みのコール（オーバーレイ）
  EATING: 'eating',     // 食事中
  CLEANUP: 'cleanup',   // 丼上げ〜退店
  LEFT: 'left',         // 退店済み（結果表示）
});

/** イラつき上昇量（店の倍率を掛ける前） */
const IRA = {
  MAX: 100,
  TICKET_WRONG: 12, NO_TICKET_AT_CALL: 20,
  STRAY: 6, LOITER: 8, FRIEND_JOINED: 24,
  CALL_TIMEOUT: 16, CALL_WRONG: 12,
  CHOKE: 8, PRESSURE_MAX: 12, LEFTOVER_DIV: 4,
  WHISPER_REPLY: 14, PHONE: 20, PHOTO_RULE: 20, PHOTO_SOFT: 6,
  TISSUE_FIRST: 14, TISSUE_MORE: 6, STARE_MISS: 6,
  LINGER: 5, BOWL_FORGOT: 12,
};
/** 店主の顔の段階のしきい値 */
const FACE_STEPS = [25, 50, 75];

/** 時間（秒） */
const TIME = {
  STRAY_GRACE: 2.5, STRAY_COOLDOWN: 4,
  LOITER_GRACE: 2.5, LOITER_COOLDOWN: 5,
  FRIEND_SPAWN_AFTER: 6, FRIEND_JOIN_LIMIT: 5,
  WAIT_CALL: 2.2,
  STARE_MIN: 8, STARE_RAND: 7, STARE_WINDOW: 2.5,
  WHISPER: 4,
  LINGER: 8, LINGER_REPEAT_AT: 4,
  TOAST: 3.4, BANNER: 2.2, BANNER_CALL_IN: 2.0,
  MAX_DT: 0.05, MAX_DT_REALTIME: 0.25,
};

/** 食事 */
const EAT_CFG = {
  BITE: 6, CHOKE_BACK: 4,
  RAPID_GAP_MS: 170, RAPID_COUNT: 3,
  IDLE_MS: 1200, PRESS_RATE: 22 /* 2.2 × 10 / 秒 × 店の圧倍率 */, PRESS_RELIEF: 40, PRESS_AFTER_SHOUT: 45,
  WHISPER_AT: 55,
  BONUS_BASE: 200, BONUS_PER_SEC: 10,
};

/** スコア */
const SCORE = { CLEAR: 1000, CALM_PER_POINT: 10, PHOTO: 30, TITLE_TOTAL_IRA: 150 };

/** ティッシュの裏ルールが有効になる店（0始まり） */
const TISSUE_RULE_FROM_DAY = 3;

/** 配置（ワールド座標。z=0 が店の正面、z<0 が店内） */
const POS = {
  PLAYER_START: { x: 7.5, z: 10.8, yaw: 0.35 },
  SEAT: { x: 0.7, z: -4.1 }, SEATED_EYE: { x: 0.7, z: -3.82 }, AFTER_EAT: { x: 0.7, z: -3.5 },
  BOWL: { x: 0.7, y: 1.14, z: -5.0 }, BOWL_DROP: { x: 0.7, z: -4.4 },
  QUEUE_Z: 8.6, QUEUE_GAP: 1.8,
  TICKET: { x: 2.6, z: 1.2 }, WATER: { x: -5.3, z: -1.4 },
  POSTERS: [{ x: -3.4, z: -7.2 }, { x: 3.4, z: -7.2 }],
  MASTER: { x: 0.4, z: -6.5 },
  QUEUE_EXIT: { x: 0, z: 1.8 },
  FRIEND_SPAWN: { x: 13, z: 11.5 }, FRIEND_GONE: { x: 14, z: 12.5 }, FRIEND_OFFSET: { x: 0.85, z: 0.3 },
  STREET_LAMPS: [{ x: -5.5, z: 12.0 }, { x: 4.6, z: 12.0 }],
};

/** 距離（m） */
const RANGE = {
  JOIN_QUEUE: 1.6, STRAY: 2.1,
  LOITER_Z: 2.2, LOITER_TICKET_FREE: 2.4,
  FRIEND_REFUSE: 2.4, FRIEND_JOIN: 1.15, FRIEND_GONE: 0.4,
  TICKET: 2.0, POSTER: 1.9, WATER: 1.7, SEAT: 1.5, BOWL_DROP: 1.5,
  EXIT_Z: 0.6,
};

/** 移動・衝突 */
const MOVE = {
  SPEED: 3.3, NPC_SPEED: 2.2, FRIEND_SPEED: 2.6,
  BOUNDS: { xMin: -9.5, xMax: 9.5, zMin: -7.5, zMax: 11.6 }, INSIDE_X: 6.8,
  DOOR_HALF: 0.85, COUNTER_Z: -4.5,
  TICKET_R: 0.62, NPC_R: 0.45, LAMP_R: 0.3,
  EYE: 1.62, EYE_SEATED: 1.4, BOB: 0.035, BOB_FREQ: 9,
};

/** 視点 */
const VIEW = {
  PITCH_LIMIT: 1.15, SEAT_YAW: 0.85, SEAT_PITCH_MIN: -0.95, SEAT_PITCH_MAX: 0.3,
  SEAT_START_PITCH: -0.3,
  PHOTO_PITCH: -0.22, PHOTO_YAW: 0.55,   // この範囲で座って下を向いて撮ると「ラーメンの写真」
  FOV: 66,
};

/** スマホ操作 */
const CTRL = {
  JOY_ZONE: 0.45,        // 画面左45%のタッチは移動スティック
  JOY_RADIUS: 52, JOY_DEADZONE: 0.12,
  LOOK_MOUSE: 0.0045, LOOK_TOUCH: 0.0062, LOOK_MAX_STEP: 140,
  SENS_MIN: 0.5, SENS_MAX: 2.0,
};

/** 湯気 */
const STEAM = { POOL: 32, LIFE: 2.2, RISE: 0.42, SIZE0: 0.22, SIZE1: 0.8, ALPHA: 0.3 };

const NPC_COLORS = [0x546e7a, 0x6d4c41, 0x33691e, 0xad1457, 0x4527a0, 0xef6c00];

/* =====================================================================
 * 2. ユーティリティ・保存・音
 * ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2d = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);
const nowMs = () => performance.now();
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
if (IS_TOUCH) document.body.classList.add('touch');

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
};

/** 固定シードの乱数（テクスチャの模様を毎回同じにする） */
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const Sound = (() => {
  let ac = null;
  function ctx() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { return null; }
    return ac;
  }

function buildWorld(dayIdx) {
  disposeWorld();
  const shop = SHOPS[dayIdx];
  const owned = [];                          // この店専用のテクスチャ等（作り直し時に破棄）
  const own = r => { owned.push(r); return r; };

  scene.background = new THREE.Color(0x141c2c);
  scene.fog = new THREE.Fog(0x141c2c, 25, 60);
  const statics = new THREE.Group(); scene.add(statics);   // 動かない物（行列を固定して毎フレームの計算を省く）
  const box = (w, h, d, mat, x, y, z, parent = statics) => {
    const m = new THREE.Mesh(boxGeo(w, h, d), typeof mat === 'number' ? lambert(mat) : mat);
    m.position.set(x, y, z); parent.add(m); return m;
  };
  const texMat = (tex, opts = {}) => own(new THREE.MeshLambertMaterial(Object.assign({ map: tex }, opts)));
  const texBasic = (tex, opts = {}) => own(new THREE.MeshBasicMaterial(Object.assign({ map: tex }, opts)));
  const plane = (w, h, mat, x, y, z, rx = 0, ry = 0, parent = statics) => {
    const m = new THREE.Mesh(planeGeo(w, h), mat); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); parent.add(m); return m;
  };

  /* ---- 光 ---- */

  /* ---- 地面 ---- */
  const ground = (w, d, mat, x, z) => plane(w, d, mat, x, 0, z, -Math.PI / 2);

/** 湯気パーティクル（スプライトを使い回すプール方式） */
function createSteam(own) {
  const parts = [];
  for (let i = 0; i < STEAM.POOL; i++) {
    const mat = own(new THREE.SpriteMaterial({ map: TEX.steam, transparent: true, depthWrite: false, opacity: 0, fog: true }));
    const sp = new THREE.Sprite(mat); sp.visible = false; scene.add(sp);
    parts.push({ sp, mat, age: 0, life: 0, vx: 0, size: 1 });
  }
  const emitters = [];
  return {
    add(x, y, z, rate, size, active) { emitters.push({ x, y, z, rate, size, active, acc: Math.random() }); },
    update(dt) {
      for (const e of emitters) {
        if (!e.active()) continue;
        e.acc += e.rate * dt;
        while (e.acc >= 1) {
          e.acc -= 1;
          const p = parts.find(q => q.life <= 0); if (!p) break;
          p.age = 0; p.life = STEAM.LIFE * (0.8 + Math.random() * 0.4); p.vx = (Math.random() - 0.5) * 0.12; p.size = e.size;
          p.sp.position.set(e.x + (Math.random() - 0.5) * 0.1, e.y, e.z + (Math.random() - 0.5) * 0.1); p.sp.visible = true;
        }
      }
      for (const p of parts) {
        if (p.life <= 0) continue;
        p.age += dt; const t = p.age / p.life;
        if (t >= 1) { p.life = 0; p.sp.visible = false; continue; }
        p.sp.position.y += STEAM.RISE * dt; p.sp.position.x += p.vx * dt;
        const s = p.size * (STEAM.SIZE0 + (STEAM.SIZE1 - STEAM.SIZE0) * t); p.sp.scale.set(s, s, s);
        p.mat.opacity = STEAM.ALPHA * Math.sin(Math.PI * t);
      }
    },
  };
}

function drawMasterFace(ira) {
  if (!W) return;
  const lv = faceLevel(ira);
  if (lv === W.faceLv) return;          // 段階が変わった時だけ描き直す
  W.faceLv = lv;
  const g = W.faceCv.getContext('2d');
  g.fillStyle = '#f0c8a0'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#263238'; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath();   // 眉
  if (lv === 0) { g.moveTo(52, 92); g.lineTo(102, 88); g.moveTo(154, 88); g.lineTo(204, 92); }
  else { const d = lv * 9; g.moveTo(52, 84 + d); g.lineTo(102, 102); g.moveTo(154, 102); g.lineTo(204, 84 + d); }
  g.stroke();
  g.fillStyle = lv >= 3 ? '#c0392b' : '#263238';   // 目
  g.beginPath(); g.arc(77, 128, lv >= 2 ? 9 : 12, 0, 7); g.fill();
  g.beginPath(); g.arc(179, 128, lv >= 2 ? 9 : 12, 0, 7); g.fill();
  g.strokeStyle = '#263238'; g.lineWidth = 8; g.beginPath();   // 口
  if (lv === 0) { g.moveTo(98, 196); g.lineTo(158, 196); }
  else if (lv === 1) { g.moveTo(102, 200); g.lineTo(154, 192); }
  else { g.arc(128, 216, 26, Math.PI * 1.15, Math.PI * 1.85); }
  g.stroke();
  if (lv >= 3) { g.fillStyle = 'rgba(192,57,43,.25)'; g.fillRect(0, 0, 256, 256); }
  W.faceTex.needsUpdate = true;
}

const KEY_ACTIONS = {

  KeyC: () => pressCamera(), KeyP: () => pressPhone(), KeyT: () => pressTissue(),
};

function placeJoy(x, y) { el.joy.style.transform = `translate(${x}px,${y}px)`; }
function resetJoy() {
  const j = input.joy; j.id = null; j.x = 0; j.y = 0;
  el.joyKnob.style.transform = ''; el.joy.classList.remove('active');
  placeJoy(84 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sal')) || 0), window.innerHeight - 110);
}
function moveJoy(e) {
  const j = input.joy;
  let dx = e.clientX - j.cx, dy = e.clientY - j.cy;
  const len = Math.hypot(dx, dy), R = CTRL.JOY_RADIUS;
  if (len > R) { dx *= R / len; dy *= R / len; }
  el.joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
  // デッドゾーン後に 0〜1 へ再マップ（指を少し置いただけで滑らない）
  const r = Math.min(len, R), dz = CTRL.JOY_DEADZONE, m = r / R;
  const mag = m <= dz ? 0 : (m - dz) / (1 - dz);
  j.x = r > 1e-6 ? dx / r * mag : 0;
  j.y = r > 1e-6 ? dy / r * mag : 0;
}
canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (ui.overlay) return;
  const touchLike = e.pointerType !== 'mouse';
  if (touchLike && input.joy.id === null && !P.seated && e.clientX < window.innerWidth * CTRL.JOY_ZONE) {
    const j = input.joy; j.id = e.pointerId; j.cx = e.clientX; j.cy = e.clientY;
    placeJoy(j.cx, j.cy); el.joy.classList.add('active'); moveJoy(e);
  } else if (input.look.id === null) {
    input.look.id = e.pointerId; input.look.x = e.clientX; input.look.y = e.clientY;
  } else return;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === input.joy.id) { moveJoy(e); return; }
  const l = input.look;
  if (e.pointerId !== l.id) return;
  const dx = e.clientX - l.x, dy = e.clientY - l.y; l.x = e.clientX; l.y = e.clientY;
  if (Math.abs(dx) > CTRL.LOOK_MAX_STEP || Math.abs(dy) > CTRL.LOOK_MAX_STEP) return;   // 指の飛びを無視
  const s = (e.pointerType === 'mouse' ? CTRL.LOOK_MOUSE : CTRL.LOOK_TOUCH) * input.sens;
  P.yaw -= dx * s;

});
const pointerEnd = e => {

/* =====================================================================
 * 10. 移動と衝突
 * ===================================================================== */
function pushOut(nx, nz, cx, cz, r) {
  const d = dist2d(nx, nz, cx, cz);
  if (d < r && d > 0.001) { const a = Math.atan2(nz - cz, nx - cx); return [cx + Math.cos(a) * r, cz + Math.sin(a) * r]; }
  return [nx, nz];
}
function collide(nx, nz) {
  const B = MOVE.BOUNDS;
  nx = clamp(nx, B.xMin, B.xMax); nz = clamp(nz, B.zMin, B.zMax);
  // 店正面の壁（z=0）はドアが開いている時だけ、ドアの幅でのみ通れる
  const crossing = (P.z > 0 && nz <= 0) || (P.z < 0 && nz >= 0);
  if (crossing && !(DAY && DAY.doorOpen && Math.abs(nx) < MOVE.DOOR_HALF)) nz = P.z;
  if (nz < 0) nx = clamp(nx, -MOVE.INSIDE_X, MOVE.INSIDE_X);          // 店内の左右の壁
  if (nz < MOVE.COUNTER_Z && P.z >= MOVE.COUNTER_Z) nz = MOVE.COUNTER_Z; // カウンター
  [nx, nz] = pushOut(nx, nz, POS.TICKET.x, POS.TICKET.z, MOVE.TICKET_R);
  for (const l of POS.STREET_LAMPS) [nx, nz] = pushOut(nx, nz, l.x, l.z, MOVE.LAMP_R);
  if (W) for (const n of W.qnpcs) [nx, nz] = pushOut(nx, nz, n.g.position.x, n.g.position.z, MOVE.NPC_R);
  return { x: nx, z: nz };
}
function movePlayer(dt) {
  P.moving = false;
  if (P.seated) return;
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyA || keys.ArrowLeft) s -= 1;
  if (keys.KeyD || keys.ArrowRight) s += 1;
  f += -input.joy.y; s += input.joy.x;
  const len = Math.hypot(f, s); if (len < 0.05) return;
  f /= Math.max(1, len); s /= Math.max(1, len);
  const sin = Math.sin(P.yaw), cos = Math.cos(P.yaw);
  const sp = MOVE.SPEED * dt;
  const c = collide(P.x + (-sin * f + cos * s) * sp, P.z + (-cos * f - sin * s) * sp);
  P.x = c.x; P.z = c.z;
  P.moving = true; P.bob += dt * MOVE.BOB_FREQ * Math.min(1, len);
}
const near = (x, z, r) => dist2d(P.x, P.z, x, z) < r;

 * 14. 食事ミニゲーム
 * ===================================================================== */
function eatTap() {
  if (!isPlaying() || !EAT || EAT.finished || DAY.phase !== PH.EATING) return;
  const t = nowMs();
  if (EAT.lastTap && t - EAT.lastTap < EAT_CFG.RAPID_GAP_MS) EAT.rapid++; else EAT.rapid = 0;
  EAT.lastTap = t;
  if (EAT.rapid >= EAT_CFG.RAPID_COUNT) {
    EAT.rapid = 0; EAT.remaining = Math.min(100, EAT.remaining + EAT_CFG.CHOKE_BACK);
    applyIra(IRA.CHOKE, null, null);
    toast('むせた。スープが跳ね、店主の眉が動く。', 'bad');
    if (DAY.over) return;
  } else { EAT.remaining -= EAT_CFG.BITE; Sound.slurp(); }
  if (EAT.remaining <= 0) { EAT.remaining = 0; finishEat(true); }
}
function eatTick(dt) {
  if (!EAT || EAT.finished || DAY.phase !== PH.EATING) return;
  const shop = curShop();
  EAT.timeLeft = Math.max(0, EAT.timeLeft - dt);
  const idle = nowMs() - EAT.lastTap > EAT_CFG.IDLE_MS;
  if (idle) EAT.pressure += EAT_CFG.PRESS_RATE * shop.press * dt;
  else EAT.pressure = Math.max(0, EAT.pressure - EAT_CFG.PRESS_RELIEF * dt);
  EAT.pressure = clamp(EAT.pressure, 0, 100);
  if (EAT.pressure >= 100) {
    EAT.pressure = EAT_CFG.PRESS_AFTER_SHOUT;
    applyIra(IRA.PRESSURE_MAX, null, '店主「早く食え！！」');
    if (DAY.over) return;
  }
  // 隣客のささやき（私語禁止の店）
  if (hasRule('no_talk') && !DAY.whisperDone && !DAY.whisper && EAT.remaining <= EAT_CFG.WHISPER_AT && EAT.remaining > 0) {
    DAY.whisper = { active: true, t: TIME.WHISPER };
    toast('隣の客が小声で話しかけてきた。「……うまくない？」 返事をしたら私語になる。', 'bad');
  }
  if (DAY.whisper && DAY.whisper.active) {
    DAY.whisper.t -= dt;
    if (DAY.whisper.t <= 0) { DAY.whisper.active = false; DAY.whisperDone = true; toast('無視して食べ続けた。それが正解の店だ。', 'good'); Sound.good(); }
  }
  setBar(el.eatRemain, EAT.remaining);
  setBar(el.eatPress, EAT.pressure);
  setBar(el.eatTime, EAT.timeLeft / EAT.total * 100);
  setText(el.eatTimeTxt, EAT.timeLeft.toFixed(1));
  if (EAT.timeLeft <= 0) finishEat(false);
}

/* =====================================================================
 * 15. 毎フレームの更新（順番に意味がある：現行版と同じ順）
 * ===================================================================== */
function stepActors(dt) {
  const walk = (n, speed) => {
    const p = n.g.position, dx = n.tx - p.x, dz = n.tz - p.z, d = Math.hypot(dx, dz);
    if (d > 0.03) { const v = Math.min(d, speed * dt); p.x += dx / d * v; p.z += dz / d * v; n.g.rotation.y = Math.atan2(dx, dz); }
    else n.g.rotation.y = Math.PI;
    return d;
  };
  W.qnpcs.forEach(n => walk(n, MOVE.NPC_SPEED));
  W.leavers = W.leavers.filter(n => {
    const d = walk(n, MOVE.NPC_SPEED);
    if (d < 0.2) { scene.remove(n.g); return false; }
    return true;
  });
  // 店主は常に客を見る
  W.master.rotation.y = Math.atan2(P.x - W.master.position.x, P.z - W.master.position.z);
  // ドアと暖簾
  W.doorT += ((DAY.doorOpen ? 1 : 0) - W.doorT) * Math.min(1, dt * 5);
  W.door.position.x = W.doorT * 1.62;
  W.ring.material.color.setHex(DAY.phase === PH.ENTER ? 0x7bc47f : 0xe8b64c);
  // 丼を持ち運ぶ
  if (DAY.bowlCarried) { W.bowl.visible = true; W.bowl.position.set(P.x - Math.sin(P.yaw) * 0.35, 1.05, P.z - Math.cos(P.yaw) * 0.35); }
}
function stepJoinQueue() {
  if (DAY.phase !== PH.ARRIVE) return;
  const sp = queueSpot(DAY.qPos);
  if (near(sp.x, sp.z, RANGE.JOIN_QUEUE)) joinQueue();
}
function stepQueue(dt) {
  if (DAY.phase !== PH.QUEUE) return;
  DAY.queueTime += dt;
  DAY.queueTimer -= dt;
  if (DAY.queueTimer <= 0) {
    DAY.queueTimer = curShop().queueSec;
    if (DAY.qPos > 0) advanceQueue(); else callPlayer();
  }
  if (DAY.phase !== PH.QUEUE) return;
  // 列から離れすぎ（食券を買いに行く間は対象外）
  if (DAY.hasTicket) {
    const sp = queueSpot(DAY.qPos);
    if (!near(sp.x, sp.z, RANGE.STRAY)) {
      DAY.strayT += dt;
      if (DAY.strayT > TIME.STRAY_GRACE) { DAY.strayT = -TIME.STRAY_COOLDOWN; applyIra(IRA.STRAY, null, '店主「列に戻れ！」'); }
    } else DAY.strayT = 0;
  }
  if (hasRule('no_daihyo') && DAY.friend.state === 'none' && DAY.queueTime > TIME.FRIEND_SPAWN_AFTER) spawnFriend();
}
function stepLoiter(dt) {
  if (DAY.phase !== PH.ARRIVE && DAY.phase !== PH.QUEUE) return;
  if (P.z < RANGE.LOITER_Z && !near(POS.TICKET.x, POS.TICKET.z, RANGE.LOITER_TICKET_FREE)) {
    DAY.loiterT += dt;
    if (DAY.loiterT > TIME.LOITER_GRACE) { DAY.loiterT = -TIME.LOITER_COOLDOWN; applyIra(IRA.LOITER, 'queue_across', '店主「列は向こうだ！ 店先でうろつくな！」'); }
  } else DAY.loiterT = 0;
}
function stepFriend(dt) {
  const fr = DAY.friend;
  if (fr.state !== 'approach' && fr.state !== 'joined' && fr.state !== 'leave') return;
  const f = W.friend;
  let tx, tz;
  if (fr.state === 'leave') {
    tx = POS.FRIEND_GONE.x; tz = POS.FRIEND_GONE.z;
    if (dist2d(f.position.x, f.position.z, tx, tz) < RANGE.FRIEND_GONE) { f.visible = false; fr.state = 'done'; }
  } else { tx = P.x + POS.FRIEND_OFFSET.x; tz = P.z + POS.FRIEND_OFFSET.z; }
  const dx = tx - f.position.x, dz = tz - f.position.z, d = Math.hypot(dx, dz);
  if (d > 0.05) { const v = Math.min(d, MOVE.FRIEND_SPEED * dt); f.position.x += dx / d * v; f.position.z += dz / d * v; f.rotation.y = Math.atan2(dx, dz); }
  if (fr.state === 'approach' && d < RANGE.FRIEND_JOIN) {
    fr.state = 'joined'; fr.t = 0;
    toast('友達が列に合流してしまった！ 早く追い返さないと代表待ちになる。', 'bad');
  } else if (fr.state === 'joined') {
    fr.t += dt;
    if (fr.t > TIME.FRIEND_JOIN_LIMIT) { fr.state = 'leave'; applyIra(IRA.FRIEND_JOINED, 'no_daihyo', '店主「代表待ちは出てけ！！」'); }
  }
}
function stepWaitCall(dt) {
  if (DAY.phase !== PH.WAIT_CALL) return;
  DAY.waitT -= dt;
  if (DAY.waitT <= 0) { if (curShop().call >= 0) openCall(); else startEating(); }
}
function stepStare(dt) {
  if ((DAY.phase === PH.WAIT_CALL || DAY.phase === PH.EATING) && !DAY.stare) {
    DAY.stareNext -= dt;
    if (DAY.stareNext <= 0) { DAY.stare = { t: TIME.STARE_WINDOW }; toast('店主と目が合った！ 会釈ボタンで返そう。'); buzz(30); scheduleStare(); }
  }
  if (DAY.stare) {
    DAY.stare.t -= dt;
    if (DAY.stare.t <= 0) {
      DAY.stare = null;
      RuleBook.discover('eye_bow');
      applyIra(IRA.STARE_MISS, 'eye_bow', null);
      toast('会釈のタイミングを逃した。目が合ったら会釈。それが裏ルールだ。', 'bad');
    }
  }
}
function stepCleanup(dt) {
  if (DAY.phase !== PH.CLEANUP) return;
  DAY.cleanT += dt;
  if (DAY.cleanT > TIME.LINGER && P.z < 0) {
    DAY.cleanT = TIME.LINGER_REPEAT_AT;
    RuleBook.discover('no_linger');
    applyIra(IRA.LINGER, 'no_linger', '店主「早く出ろ」');
    if (DAY.over) return;
  }
  if (P.z > RANGE.EXIT_Z) exitShop();
}
const GAME_STEPS = [
  (dt) => movePlayer(dt), stepJoinQueue, (dt) => stepActors(dt), stepQueue, stepLoiter,
  stepFriend, stepWaitCall, stepStare, eatTick, stepCleanup,
];
function updateGame(dt) {
  for (const step of GAME_STEPS) { step(dt); if (!isPlaying()) return; }
  refreshControls();
}
function refreshControls() {
  const it = computeInteract();
  if (it) {
    const label = it.label();
    setText(el.prompt, '[E] ' + label); setDisplay(el.prompt, true);
    setText(el.btnAct, label); setShow(el.btnAct, true);
  } else { setDisplay(el.prompt, false); setShow(el.btnAct, false); }
  const ph = DAY.phase;
  setShow(el.btnSlurp, ph === PH.EATING);
  setShow(el.btnPhone, PHONE_PHASES.includes(ph));
  setShow(el.btnCam, ph === PH.EATING || ph === PH.WAIT_CALL);
  setShow(el.btnTissue, ph === PH.EATING);
  setShow(el.btnBow, !!DAY.stare);
  document.body.classList.toggle('can-walk', !P.seated);
}

/* ---- 見た目だけの動き（オーバーレイ中も動かす） ---- */
function updateCosmetics(dt, t) {
  W.steam.update(dt);
  W.lanterns.forEach((l, i) => { l.rotation.z = Math.sin(t * 1.3 + i * 1.7) * 0.05; });
  W.noren.forEach((n, i) => {
    n.m.position.x = n.baseX + n.dir * W.doorT * 0.55;
    n.m.rotation.x = Math.sin(t * 1.6 + i * 0.7) * 0.05 - W.doorT * 0.15;
  });
  W.seatedNpcs.forEach((n, i) => { n.position.y = 0.12 + Math.sin(t * 2.08 + i * 2) * 0.012; });
  if (W.qRing.visible) W.qRing.material.opacity = 0.65 + Math.sin(t * 4) * 0.25;
}

function updateCamera(t) {
  if (ui.attract || !DAY) {   // タイトル画面：店の前をゆっくり眺める
    camera.position.set(6.2 + Math.sin(t * 0.12) * 1.4, 1.75, 10.4);
    camera.lookAt(0.3 + Math.sin(t * 0.09) * 0.8, 1.75, 0);
    return;
  }
  if (P.seated) {
    P.yaw = clamp(P.yaw, -VIEW.SEAT_YAW, VIEW.SEAT_YAW);
    P.pitch = clamp(P.pitch, VIEW.SEAT_PITCH_MIN, VIEW.SEAT_PITCH_MAX);
    camera.position.set(POS.SEATED_EYE.x, MOVE.EYE_SEATED, POS.SEATED_EYE.z);
  } else {
    camera.position.set(P.x, MOVE.EYE + (P.moving ? Math.sin(P.bob) * MOVE.BOB : 0), P.z);
  }
  camera.rotation.set(P.pitch, P.yaw, 0, 'YXZ');
}

/* =====================================================================
 * 16. メインループ
 * ===================================================================== */
let lastTs = 0, clock = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const raw = lastTs ? (ts - lastTs) / 1000 : 1 / 60; lastTs = ts;
  const dt = Math.min(TIME.MAX_DT, raw);
  clock += dt;
  if (isPlaying()) updateGame(dt);
  if (ui.overlay === 'call') tickCallTimer(Math.min(TIME.MAX_DT_REALTIME, raw));
  if (W) updateCosmetics(dt, clock);
  updateCamera(clock);
  renderer.render(scene, camera);
}

    <button class="btn primary" data-act="retryDay">翌日、出直す（この店をやり直す）</button>
    <button class="btn ghost" data-act="title">タイトルへ戻る</button>
  </div>${footerHtml()}`);
  drawCert();
}

/* =====================================================================
 * 18. 証明書画像（1200×630）とシェア
 * ===================================================================== */
function drawCert() {
  const cv = document.createElement('canvas'); cv.width = 1200; cv.height = 630;
  const g = cv.getContext('2d');
  g.fillStyle = '#17110c'; g.fillRect(0, 0, 1200, 630);
  g.fillStyle = '#7d1f14'; g.fillRect(0, 0, 1200, 110);
  g.fillStyle = '#17110c'; for (let x = 300; x < 1200; x += 300) g.fillRect(x - 4, 80, 8, 30);   // 暖簾の切れ目
  g.fillStyle = '#ffffff'; g.font = `900 54px ${SANS}`; g.textAlign = 'center';
  g.fillText('出禁ラーメン3D', 600, 70);
  g.fillStyle = '#f7ead1'; g.fillRect(140, 150, 920, 360);
  g.strokeStyle = '#8a6d2f'; g.lineWidth = 4; g.strokeRect(160, 170, 880, 320);
  g.fillStyle = '#3a2a12'; g.font = `900 64px ${SERIF}`;
  g.fillText(finalKind === 'dekin' ? '出禁証明書' : finalTitle + '証', 600, 268);
  g.font = `30px ${SANS}`;
  g.fillText(`スコア ${RUN.score}点 ／ 違反 ${RUN.violations}回`, 600, 348);
  g.fillText(finalKind === 'dekin' ? `${RUN.day + 1}軒目で出禁` : '全5軒を完食', 600, 402);
  g.fillText(`ルール図鑑 ${RuleBook.count} / ${RULE_IDS.length} 件発見`, 600, 456);
  // 印
  g.save(); g.translate(960, 420); g.rotate(-0.25); g.strokeStyle = 'rgba(192,57,43,.85)'; g.lineWidth = 6;
  g.beginPath(); g.arc(0, 0, 54, 0, 7); g.stroke(); g.fillStyle = 'rgba(192,57,43,.85)'; g.font = `900 30px ${SERIF}`; g.textBaseline = 'middle';
  g.fillText(finalKind === 'dekin' ? '出禁' : (RUN.violations === 0 ? '常連' : '完食'), 0, 2); g.restore();
  g.fillStyle = '#c9b18c'; g.font = `24px ${SANS}`; g.textBaseline = 'alphabetic';
  g.fillText('〜怒られずに食べ切れ〜', 600, 566);
  certCanvas = cv;
}
function shareText() {
  if (finalKind === 'dekin') return `🍜『出禁ラーメン3D』${RUN.day + 1}軒目「${SHOPS[RUN.day].name}」で出禁になりました……。スコア${RUN.score}点／違反${RUN.violations}回。3Dで歩ける厳格ラーメン屋、あなたは完食できますか？ #出禁ラーメン3D`;
  return `🍜『出禁ラーメン3D』全5軒を完食！「${finalTitle}」スコア${RUN.score}点／違反${RUN.violations}回／図鑑${RuleBook.count}件発見。3Dで歩ける厳格ラーメン屋、あなたは怒られずに食べ切れますか？ #出禁ラーメン3D`;
}
function shareResult() { window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText()), '_blank', 'noopener'); }
function downloadCert() {
  if (!certCanvas) drawCert();
  const a = document.createElement('a'); a.download = 'dekin-ramen-3d-result.png'; a.href = certCanvas.toDataURL('image/png'); a.click();
}

resetJoy();
renderTitle();
requestAnimationFrame(frame);

  };

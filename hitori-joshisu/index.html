<style>
/* オフィスの淡いグレー。状態は信号色で示す */
:root{color-scheme:light;--bg:#e9edf3;--panel:#fff;--ink:#14213d;--sub:#5b6680;--line:#d3d9e4;--accent:#0a64d8;--acbg:#e3eefc;--ok:#14935a;--okbg:#e2f6ec;--ng:#d7263d;--ngbg:#fde6e9;--warn:#c27c00;--warnbg:#fff3d6;--boss:#2b2f3a;--night:#0d1424}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6;overflow-x:hidden;transition:background .6s}
body.night{background:var(--night);color:#e6ecf8}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
a{color:inherit}
#wrap{max-width:560px;margin:0 auto;padding:10px 12px calc(170px + env(safe-area-inset-bottom,0px))}
.topnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.topnav button,.topnav a{color:var(--sub);border:1.5px solid currentColor;border-radius:99px;padding:3px 12px;text-decoration:none;font-size:12px;font-weight:800}
body.night .topnav button,body.night .topnav a{color:#7d8aa8}

#hud{position:sticky;top:0;z-index:30;padding:6px 0 8px;display:none}
#hud.on{display:block}
.hgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px}
body.night .hgrid{background:#16203a;border-color:#26324f}
.day{grid-row:span 2;text-align:center;padding-right:10px;border-right:1.5px solid var(--line)}
.day b{display:block;font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.day small{font-size:10px;color:var(--sub);font-weight:800}
.gauge{font-size:10.5px;font-weight:800;color:var(--sub)}
.gauge .bar{height:7px;background:#e5e9f0;border-radius:6px;overflow:hidden;margin-top:2px}
body.night .gauge .bar{background:#26324f}
.gauge .bar i{display:block;height:100%;transition:width .5s}
.gauge span{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
body.night .gauge span,body.night .money b{color:#e6ecf8}
.money{font-size:10.5px;font-weight:800;color:var(--sub)}
.money b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}

.scene{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--accent);margin-top:6px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.card h2{font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-size:11px;color:var(--sub);font-weight:700}
.boss{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.boss .av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--boss);color:#fff;display:grid;place-items:center;font-size:22px}
.boss.angry .av{background:var(--ng)}
.boss .say{background:var(--panel);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14.5px;line-height:1.75}
.boss.angry .say{border-color:var(--ng)}
.boss .say b{display:block;font-size:10.5px;color:var(--sub)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.leak{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.leak:first-of-type{border:0}
.leak .ic{font-size:18px;flex:none;white-space:nowrap}
.leak small{display:block;color:var(--sub);font-size:12px;line-height:1.6;margin-top:2px}
.leak .d{margin-left:auto;font-weight:900;color:var(--ng);white-space:nowrap}
.learn{margin-top:8px;background:var(--acbg);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.75}
.learn b{color:var(--accent)}

/* 予報・図鑑 */
.fc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fc button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12.5px;font-weight:800;background:var(--panel)}
.fc button .n{font-size:11px;color:var(--ng);font-weight:900}
.fc button.new{border-color:var(--ng);background:var(--ngbg)}
.event{margin-top:8px;background:var(--ngbg);color:var(--ng);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:800}
.dex{margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbfd}
.dex h3{font-size:14px;font-weight:900}
.dex p{font-size:12.5px;color:var(--sub);margin-top:2px}
.dex .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;align-items:center}
.dex .row span{font-weight:900;font-size:11px;color:var(--sub);min-width:52px}
.dex .row i{font-style:normal;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--okbg);color:var(--ok)}
.dex .row i.in{background:var(--acbg);color:var(--accent)}

/* 盤面 */
.boardwrap{position:relative;margin-top:10px}
canvas{display:block;width:100%;border-radius:16px;touch-action:manipulation}
.boardbar{display:flex;gap:8px;align-items:center;margin-top:8px}
.boardbar .info{flex:1;font-size:12px;font-weight:800;color:var(--sub)}
body.night .boardbar .info{color:#93a1c2}
.pill{border-radius:99px;padding:6px 14px;font-weight:900;font-size:13px;background:#dfe5ef;color:var(--ink)}
.pill.on{background:var(--accent);color:#fff}
.inbox{margin-top:10px;min-height:150px}
.inbox .empty{display:grid;place-items:center;min-height:150px;border:2px dashed var(--line);border-radius:14px;color:var(--sub);font-size:13px;font-weight:800}
.call{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;animation:callIn .25s ease-out}
.call.ok{border-color:var(--ok);background:var(--okbg)}
.call.ng{border-color:var(--ng);background:var(--ngbg)}
@keyframes callIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.call .who{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--accent)}
.call .who span{color:var(--sub)}
.call .q{margin-top:4px;font-size:14.5px;font-weight:700;line-height:1.7}
.call .tb{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.call .tb i{display:block;height:100%;background:var(--accent)}
.call .ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.call .ans button{border:2px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:900;font-size:14px;background:var(--panel);line-height:1.4}
.call .r{font-size:13.5px;line-height:1.75;margin-top:6px}
.call .r b{font-size:15px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(13,20,36,.78);border-radius:16px;color:#e6ecf8;padding:20px}
.overlay h2{font-size:22px;font-weight:900}
.overlay p{font-size:13.5px;margin-top:8px;line-height:1.8;color:#b8c4de}

/* ショップ */
.dlist{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.def{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.def.on{border-color:var(--ok);background:#f6fcf9}
.def.alert{border-color:var(--ng);background:#fff7f8}
.def .ic{flex:none;font-size:22px;width:30px;text-align:center}
.def .tx{flex:1;min-width:0}
.def .tx b{font-size:13.5px;display:block;line-height:1.35}
.def .tx small{display:block;font-size:11px;color:var(--sub);line-height:1.45}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;font-weight:800;color:var(--sub)}
.tags i{font-style:normal;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 5px;background:#eef0f4;color:var(--sub)}
.tags i.hit{background:var(--okbg);color:var(--ok)}
.tags i.z{background:var(--ink);color:#fff}
.tags i.z.in{background:var(--accent)}
.tags i.f{background:var(--warnbg);color:var(--warn)}
.def .act{flex:none;min-width:66px;border-radius:10px;padding:7px 8px;font-weight:900;font-size:12.5px;background:var(--accent);color:#fff;line-height:1.25}
.def .act small{display:block;font-size:10px;font-weight:700;opacity:.9}
.def .act.off{background:#eef0f4;color:var(--sub)}
.uprow{flex-basis:100%;display:flex;gap:10px;align-items:center;margin-top:6px;padding:8px 10px;border-radius:10px;background:#fff8e1;border:1.5px dashed #e8c15a}
.uprow>div{flex:1;min-width:0}
.uprow b{font-size:12.5px;display:block}
.uprow small{display:block;font-size:11px;color:var(--sub);line-height:1.45}
.uprow.done{background:var(--okbg);border:0;color:var(--ok);font-size:12px;font-weight:900}
.uprow.lock{background:#f4f6fa;border:0;color:var(--sub);font-size:11px;font-weight:800}
.def .act:disabled{opacity:.35;pointer-events:none}
.go{display:block;width:100%;margin-top:14px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;border-radius:14px;padding:13px;box-shadow:0 4px 0 #000}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.go.blue{background:var(--accent);box-shadow:0 4px 0 #06408c}
.go:disabled{opacity:.4;pointer-events:none}
.placing{position:sticky;bottom:10px;z-index:25;margin-top:10px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
.placing span{flex:1}
.placing button{background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:900;font-size:12px}
.sel{margin-top:8px;border:1.5px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;background:var(--acbg)}
.sel span{flex:1}
.sel button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-weight:800;font-size:12px}

/* イベント */
.ev{margin-top:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.ev .kick{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--accent)}
.ev h2{font-size:19px;font-weight:900;margin-top:2px}
.ev .q{margin-top:10px;font-size:14.5px;line-height:1.85}
.ev .opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ev .opts button{text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:900;font-size:14px;background:var(--panel)}
.ev .res{margin-top:12px;background:#f4f6fa;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.8}

/* タイトル・エンディング */
.title{min-height:78vh;display:flex;flex-direction:column;justify-content:center}
.title .kick{font-size:11px;font-weight:900;letter-spacing:.25em;color:var(--accent)}
.title h1{font-size:clamp(36px,11vw,52px);font-weight:900;line-height:1.15;margin-top:6px;text-wrap:balance}
.title .lead{margin-top:14px;font-size:14.5px;font-weight:700;line-height:1.9}
.rules{margin-top:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.85}
.rules b{color:var(--accent)}
.note{margin-top:14px;font-size:11px;color:var(--sub);line-height:1.7}
.end h1{font-size:26px;font-weight:900;line-height:1.35;margin-top:10px}
.end .rank{display:inline-block;margin-top:8px;border:3px solid var(--accent);color:var(--accent);font-weight:900;font-size:18px;border-radius:10px;padding:3px 14px}
.end .rank.bad{border-color:var(--ng);color:var(--ng)}
.end .lead{margin-top:12px;font-size:14.5px;line-height:1.95}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.trio div{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px}
.trio b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.trio small{font-size:10.5px;color:var(--sub);font-weight:800}
.share{display:flex;gap:8px;margin-top:14px}
.share a,.share button{flex:1;text-align:center;text-decoration:none;font-weight:900;font-size:14px;border-radius:12px;padding:12px;background:#111;color:#fff}
.share button{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.fadein{animation:fi .3s ease-out}
@keyframes fi{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 簡素なメインUI */
.fcl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fcl .atk{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--panel)}
.fcl .atk .i{font-size:22px;line-height:1}
.fcl .atk .c{font-size:13px;font-weight:900;color:var(--sub)}
.fcl .atk.new{border-color:var(--ng);background:var(--ngbg)}
.fcl .atk.aim{border-color:var(--warn);background:var(--warnbg)}
.fcl .atk.less{opacity:.55}
.fcl .atk .m{font-size:11px;font-weight:900;color:var(--warn)}
.alert{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin-top:8px;background:var(--ngbg);color:var(--ng);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800}
.alert span{opacity:.7}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sgrp{font-size:11px;font-weight:900;color:var(--sub);margin-top:6px;letter-spacing:.05em}
.srow{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.srow.on{border-color:var(--ok);background:#f6fcf9}
.srow.alert{border-color:var(--ng);background:#fff7f8;color:inherit;margin:0;font-weight:inherit}
.srow .ic{font-size:24px;width:30px;text-align:center;flex:none}
.srow .nm{flex:1;min-width:0;font-weight:900;font-size:14.5px;line-height:1.3}
.srow .nm small{display:block;font-size:12px;color:var(--sub);font-weight:800}
.srow .i{color:var(--sub);font-size:14px}
.srow .act{flex:none;min-width:64px;border-radius:10px;padding:6px 8px;font-weight:900;font-size:13px;background:var(--accent);color:#fff;line-height:1.2}
.srow .act small{display:block;font-size:10.5px;font-weight:700;opacity:.9}
.srow .act.up{background:#e8a100}
.srow .act.warn{background:var(--ng)}
.srow .act:disabled{opacity:.35;pointer-events:none}
.srow .done{flex:none;min-width:64px;text-align:center;font-size:12px;font-weight:900;color:var(--ok)}
.rline{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
.rline:first-of-type{border:0}
.rline .g{flex:1;font-weight:800}
.rline b{color:var(--ng)}
.rline .fix{font-size:16px;min-width:46px;text-align:right}
.calm{font-size:13px;color:var(--sub);margin-top:6px}
.hint{font-size:11px;color:var(--sub);margin-top:6px}
.crow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px dashed var(--line);font-size:18px}
.crow:first-of-type{border:0}
.crow button{font-size:20px;border:1.5px solid var(--line);border-radius:10px;width:38px;height:38px}
.crow span{color:var(--sub);font-size:12px}
.crow .sep{flex:1}
/* 説明パネル */
#sheet{position:fixed;inset:0;z-index:100}
.shbg{position:absolute;inset:0;background:rgba(10,15,30,.5)}
.shbox{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:84vh;overflow:auto;background:var(--panel);color:var(--ink);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.shk{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--accent)}
.shbox h2{font-size:22px;font-weight:900;margin-top:2px}
.shbox h3{font-size:18px;font-weight:900;margin-top:2px}
.long{font-size:14.5px;line-height:1.95;margin-top:10px;color:var(--ink)}
.flow{margin-top:12px;background:#f4f6fa;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.flow div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.flow span{font-size:11px;font-weight:900;color:var(--sub);min-width:86px}
.flow i{font-style:normal;font-weight:800;font-size:12.5px;border-radius:6px;padding:1px 8px;background:var(--okbg);color:var(--ok)}
.flow i.in{background:var(--acbg);color:var(--accent)}
.flow i.ng{background:var(--ngbg);color:var(--ng)}
.shbuy{margin-top:12px}
.shbuy .act{width:100%;border-radius:12px;padding:11px;font-weight:900;font-size:15px;background:var(--accent);color:#fff}
.shbuy .act.off{background:#eef0f4;color:var(--sub)}
.shbuy .act:disabled:not(.off){opacity:.4}
.shup{margin-top:18px;padding-top:14px;border-top:2px dashed var(--line)}
</style>

<script>
"use strict";
const GAME_URL = "https://red-freegames.github.io/hitori-joshisu/";
const DAYS = 10;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

function entryBlocked(k) { return EN[k].lane !== undefined && TKEYS.some(t => TW[t].layer === "entry" && hitsOf(t).includes(k) && active(t)); }
function waveNow() {
  const W = Object.assign({}, WAVES[S.day]), moved = {};
  const open = Object.keys(W).filter(k => EN[k].lane !== undefined && !entryBlocked(k));
  if (!open.length) return { W, moved };
  let pool = 0;
  Object.keys(W).filter(entryBlocked).forEach(k => { const m = Math.floor(W[k] / 3); W[k] -= m; pool += m; });
  for (let i = 0; pool > 0; i++, pool--) { const k = open[i % open.length]; W[k]++; moved[k] = (moved[k] || 0) + 1; }
  return { W, moved };
}

    else boss = pick(["昨日も何も起きなかったな。本当に攻撃なんて来てるのか？予算は減らすぞ。", "平和だな。もう対策は足りてるんだろう？予算は減らす。", "何も起きないなら、その予算は営業に回したいんだがね。"]);
    const lines = L.leak.filter(x => x.from !== "call").map(x => `<button class="rline" onclick="G.infoAtk('${x.from}')"><span>${EN[x.from].ic}→${EN[x.as].ic}</span><span class="g">${EN[x.as].goal}${x.mit ? "（💾軽減）" : ""}</span><b>-${x.dmg}</b><span class="fix">${stoppers(x.from).concat(stoppers(x.as)).map(s => s.slice(0, 2)).filter((v, i, a) => a.indexOf(v) === i).join("")}</span></button>`).join("");
    const bad = (L.calls || []).filter(x => !x.ok);
    if (bad.length) { angry = true; boss += pick(["　それと、社員の問い合わせにまずい返事をしたそうだな。", "　あと、社員から『情シスに聞いたらいいって言われた』と聞いたぞ。"]); }
    const clines = bad.map(x => { const c = CALLS.find(y => y.id === x.id); return `<button class="rline" onclick="G.infoCall('${c.id}')"><span>📞</span><span class="g">${c.who}「${c.bad}」${x.auto ? "（自己判断）" : ""}</span><span class="fix">ⓘ</span></button>`; }).join("");
    report = `<div class="card"><h2>📋 昨日の報告<small>止めた ${L.ko} ・ 被害 ${L.leak.length} ・ 📞 ${(L.calls || []).length - bad.length}/${(L.calls || []).length}</small></h2>
      ${lines || (clines ? "" : `<p class="calm">すべて止めた。……誰も褒めてくれない。</p>`)}${clines}
      ${L.breach ? `<p class="calm">侵入されたぶんの対応 ${L.breach}件 -${Math.round(L.breach / 2)}</p>` : ""}
      ${lines ? `<p class="hint">右のアイコンは、止められた対策。タップで説明</p>` : ""}</div>`;
  }
  render(`<div class="scene">☀️ DAY ${S.day} ・ 朝 ・ 社長室</div>
    <div class="boss ${angry ? "angry" : ""}"><div class="av">👔</div><div class="say"><b>社長</b>${boss}</div></div>
    ${report}
    <div class="card"><div class="kv"><span>今日の予算</span><b>+${S.budget}万円</b></div><div class="kv"><span>使えるお金</span><b>${S.money}万円</b></div></div>
    <button class="go" onclick="G.afterBoss()">自分の席に戻る ▶</button>`);
  window.scrollTo(0, 0);
};
G.afterBoss = () => { const e = pickEvent(); if (e) return showEvent(e); G.prep(); };

function callsFor(day) {
  const n = Math.min(6, 1 + Math.ceil(day / 2));
  const pool = shuffle(CALLS.filter(c => day >= (c.min || 1)));
  // まだ出していないものを優先
  pool.sort((a, b) => (S.usedCall[a.id] || 0) - (S.usedCall[b.id] || 0));
  return pool.slice(0, n).map(c => { S.usedCall[c.id] = (S.usedCall[c.id] || 0) + 1; return c; });
}

const CV = { w: 360, h: 480, ctx: null };

  S.extra.forEach((k, i) => spawns.push({ k, at: 3 + i * 2.5, inside: true }));

}

  }
  const opts = [[c.good, 1], [c.bad, 0]]; if (cur.flip) opts.reverse();
  box.innerHTML = `<div class="call"><div class="who">📞 ${c.who}から<span>${S.train ? "🎓 返事がなくても8割は正しく判断" : "返事がないと自分で判断します"}</span></div><p class="q">${c.q}</p>
    <div class="tb"><i id="tbar" style="width:100%"></i></div>
    <div class="ans">${opts.map((o, i) => `<button onclick="G.answer(${i})">${o[0]}</button>`).join("")}</div></div>`;
}
G.skipCall = () => { const N = NT; if (N && N.cur && N.cur.res) { N.cur = null; drawCall(N); } };
function nightStep(N, dt) {
  N.t += dt;
  stepCalls(N, dt);
  while (N.spawns.length && N.spawns[0].at <= N.t) {
    const s = N.spawns.shift();
    const lane = s.k === "supply" ? pick([0, 1, 2]) : s.inside ? pick([0, 2]) : EN[s.k].lane;
    const t = s.inside ? (lane === 1 ? "acct" : "mal") : s.k;
    N.en.push({ t, from: s.k, lane, x: LANES[lane].x + .09, y: s.inside ? BOUND + .02 : TOP, inside: !!s.inside, boss: s.k === "pw" && Math.random() < .3 });
  }
  for (const k in N.flash) N.flash[k] -= dt;
  for (const e of N.en) {
    e.y += EN[e.t].spd * dt;
    if (!e.inside && !e.passE && e.y >= ENTRY_Y) {
      e.passE = true;
      const b = blocker(e, "entry");
      if (b) { e.gone = true; N.ko++; S.ko++; N.flash[b + e.lane] = .4; pop(N, e.x, ENTRY_Y - .05, "ブロック", "ok"); continue; }
      if (EN[e.t].bypass && S.own[TKEYS.find(k => TW[k].hits.includes(EN[e.t].base))]) pop(N, e.x, ENTRY_Y - .05, "すり抜け！", "warn");
      else if (e.boss && S.own.mfa && S.flags.no2fa) pop(N, e.x, ENTRY_Y - .05, "社長の穴！", "warn");
    }
    if (!e.inside && e.y >= BOUND) {
      e.inside = true; e.t = EN[e.from].to;
      S.hp -= .5; N.dmg += .5; N.breach++;
      pop(N, e.x, BOUND, `侵入`, "ng");
    }
    if (e.inside && !e.passI && e.y >= INSIDE_Y) {
      e.passI = true;
      const b = blocker(e, "inside");
      if (b) { e.gone = true; N.ko++; S.ko++; N.flash[b + e.lane] = .4; pop(N, e.x, INSIDE_Y - .05, "ブロック", "ok"); continue; }
    }
    if (e.y >= GOAL) {
      let dmg = Math.round(EN[e.t].dmg * (1 + (S.day - 1) * .05));
      let mit = false;
      if (e.t === "mal" && S.backup && !S.off.backup) { dmg = Math.round(dmg / 4); mit = true; }
      N.dmg += dmg; S.hp -= dmg;
      N.leak.push({ from: e.from === "call" ? e.t : e.from, as: e.t, dmg, mit, call: e.from === "call" });
      pop(N, e.x, GOAL - .02, `-${dmg}`, "ng");
      e.gone = true;
    }
  }
  N.en = N.en.filter(e => !e.gone);
  N.pops.forEach(p => p.life -= dt); N.pops = N.pops.filter(p => p.life > 0);
  if (!N.spawns.length && !N.en.length && !N.calls.length && !N.cur) N.done = true;
}
G.night = () => {
  closeSheet();
  document.body.className = "";
  hud();
  render(`<div class="scene">💼 DAY ${S.day} ・ 業務時間</div>
    <div class="boardwrap"><canvas id="cv"></canvas><div class="overlay" id="ov"><div><h2>💼 始業</h2><p>攻撃は、買った対策が自動で止める。<br>あなたは、社員からの📞問い合わせに答えよう。<br>放っておくと、社員が自分で判断してしまう。</p>
      <button class="go blue" style="margin-top:14px" onclick="G.runNight()">業務開始</button></div></div></div>
    <div class="boardbar"><span class="info" id="ninfo"></span><button class="pill" id="spd" onclick="G.speed()">▶▶ 2倍速</button></div>
    <div class="inbox" id="inbox"></div>`);
  setupCanvas(true);
  NT = buildNight();
  drawBoard(NT); updInfo(); drawCall(NT);
  window.scrollTo(0, 0);
};
function updInfo() {
  const N = NT; if (!N || !$("ninfo")) return;
  const ok = N.callLog.filter(x => x.ok).length;
  $("ninfo").textContent = `攻撃 残り ${N.spawns.length + N.en.length}　📞 ${ok}/${N.callLog.length}`;
}
G.speed = () => { if (!NT) return; NT.speed = NT.speed === 1 ? 2 : 1; $("spd").classList.toggle("on", NT.speed === 2); };
G.runNight = () => {
  $("ov").remove();
  const N = NT;
  let last = performance.now();
  const loop = (now) => {
    if (NT !== N) return;
    const dt = Math.min(.05, (now - last) / 1000) * N.speed; last = now;
    nightStep(N, dt);
    drawBoard(N); updInfo(); hud();
    if (N.done || S.hp <= 0) { RAF = 0; setTimeout(() => { if (NT === N) endNight(); }, 900); return; }
    RAF = requestAnimationFrame(loop);
  };
  RAF = requestAnimationFrame(loop);
};
function endNight() {
  const N = NT;
  S.last = { ko: N.ko, leak: N.leak, dmg: N.dmg, breach: N.breach, calls: N.callLog };
  S.off = {};
  S.leaks += N.leak.length;
  NT = null;
  if (S.hp <= 0) return G.end(false);
  if (S.day >= DAYS) return G.end(true);
  if (N.leak.length > 0) S.budget = Math.min(50, Math.round(S.budget * 1.2) + 2);
  else S.budget = Math.max(18, Math.round(S.budget * .85));
  S.day++;
  S.money += S.budget;
  if (VULN_DAYS.includes(S.day) && S.own.patch && !S.up.patch) S.vuln = true;
  G.morning();
}

/* ============ エンディング ============ */
G.end = (ok) => {
  stopNight();
  document.body.className = "";
  $("hud").classList.remove("on");
  const hp = Math.max(0, Math.round(S.hp));
  let rank, lead;
  if (!ok) { rank = "倒産"; lead = `${S.day}日目、会社の体力が尽きた。<br>攻撃者たちは、もう次の会社を探している。`; }
  else if (hp >= 75) { rank = "鉄壁のひとり情シス"; lead = "10日間、ほとんど何も起きなかった。<br>だから社長は、最後まで「本当に攻撃なんて来てるのか？」と言っていた。<br>それが、守る側の仕事の正体だ。"; }
  else if (hp >= 50) { rank = "現場の守護神"; lead = "いくつか被害は出た。それでも会社は回り続けた。"; }
  else if (hp >= 25) { rank = "満身創痍の情シス"; lead = "会社は生き残った。ぎりぎりで。<br>今日も社長室に呼ばれている。"; }
  else { rank = "首の皮一枚"; lead = "倒産だけは免れた。<br>机には、取引先へのお詫び状の束が残っている。"; }
  const text = `「ひとり情シス防衛戦」${ok ? "10日間を守り抜いた" : S.day + "日目に倒産した"}。\n称号【${rank}】 体力${hp} / 止めた攻撃${S.ko}件 / 問い合わせ正解${S.callsOk}/${S.calls}\n#ひとり情シス防衛戦`;
  const sheetRows = OUTER.map(k => {
    const nt = NEWTYPE.find(x => EN[x].base === k);
    return `<div class="crow"><button onclick="G.infoAtk('${k}')">${EN[k].ic}</button><span>→</span><b>${stoppers(k).map(s => s.slice(0, 2)).join("")}</b>
      <span class="sep"></span><button onclick="G.infoAtk('${nt}')">${EN[nt].ic}</button><span>→</span><b>${stoppers(nt).map(s => s.slice(0, 2)).join("")}</b>
      <span class="sep"></span><button onclick="G.infoAtk('${EN[k].to}')">${EN[EN[k].to].ic}</button><span>→</span><b>${stoppers(EN[k].to).map(s => s.slice(0, 2)).join("")}</b></div>`;
  }).join("");
  render(`<div class="end">
    <div class="rank ${ok ? "" : "bad"}">${rank}</div>
    <h1>${ok ? "10日間、守り抜いた。" : "会社は倒産した。"}</h1>
    <p class="lead">${lead}</p>
    <div class="trio">
      <div><b>${hp}</b><small>残った体力</small></div>
      <div><b>${S.ko}</b><small>止めた攻撃</small></div>
      <div><b>${S.leaks}</b><small>通した攻撃</small></div>
    </div>
    <div class="card"><h2>📘 攻撃と対策<small>アイコンをタップで説明</small></h2>${sheetRows}
      <div class="crow"><button onclick="G.infoAtk('supply')">🤝</button><span>→</span><b>🗂️🛡️</b><span class="sep"></span><button onclick="G.infoDef('backup')">💾</button><span style="font-size:12px;color:var(--sub)">やられても戻せる</span></div>
      <p class="long" style="margin-top:12px">どんな対策にも、すり抜ける手口がある。だから入口で止めるだけでなく、社内で広げず、最後はバックアップで立ち直る。これを「多層防御」という。</p>
      <p class="long">現実で、個人がまずやるなら：二段階認証かパスキーを設定する。パスワードを使い回さない。更新はすぐ当てる。お金の話は折り返して確かめる。大事なデータはバックアップする。</p></div>
    <div class="share">
      <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(GAME_URL)}" target="_blank" rel="noopener">𝕏 結果をポスト</a>
      <button onclick="G.start()">もう一度</button>
    </div>
    <p class="note">このゲームはフィクションです。数値はゲーム用に単純化したものです。<br>実況・配信・動画投稿・収益化OK ／ <a href="https://red-freegames.github.io/">RED FREE GAMES</a> の他のゲームで遊ぶ</p>
  </div>`);
  window.scrollTo(0, 0);
};

window.addEventListener("resize", () => { if ($("cv")) { setupCanvas(!!NT); drawBoard(NT || undefined); } });
window.G = G;
G.title();
</script>

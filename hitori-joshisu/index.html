<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ひとり情シス防衛戦</title>
<meta name="description" content="朝、社長に予算を削られながら対策を買う。昼、攻撃と社員からの問い合わせが同時にやってくる。二段階認証はパスワード泥棒に、監視ソフトはマルウェアに。入口をすり抜ける新型には社内で備える。7日間会社を守り抜くサイバー防衛ゲーム。">
<meta property="og:title" content="ひとり情シス防衛戦">
<meta property="og:description" content="朝は社長に詰められ、昼は攻撃と問い合わせが同時に来る。対策と攻撃の相性を覚えて、7日間会社を守り抜け。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://red-freegames.github.io/hitori-joshisu/">
<meta property="og:site_name" content="RED FREE GAMES">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://red-freegames.github.io/hitori-joshisu/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://red-freegames.github.io/hitori-joshisu/og.png">
<link rel="canonical" href="https://red-freegames.github.io/hitori-joshisu/">
<style>
/* オフィスの淡いグレー。状態は信号色で示す */
:root{color-scheme:light;--bg:#e9edf3;--panel:#fff;--ink:#14213d;--sub:#5b6680;--line:#d3d9e4;--accent:#0a64d8;--acbg:#e3eefc;--ok:#14935a;--okbg:#e2f6ec;--ng:#d7263d;--ngbg:#fde6e9;--warn:#c27c00;--warnbg:#fff3d6;--boss:#2b2f3a;--night:#0d1424}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6;overflow-x:hidden;transition:background .6s}
body.night{background:var(--night);color:#e6ecf8}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
a{color:inherit}
#wrap{max-width:560px;margin:0 auto;padding:10px 12px calc(170px + env(safe-area-inset-bottom,0px))}
.topnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.topnav button,.topnav a{color:var(--sub);border:1.5px solid currentColor;border-radius:99px;padding:3px 12px;text-decoration:none;font-size:12px;font-weight:800}
body.night .topnav button,body.night .topnav a{color:#7d8aa8}

#hud{position:sticky;top:0;z-index:30;padding:6px 0 8px;display:none}
#hud.on{display:block}
.hgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px}
body.night .hgrid{background:#16203a;border-color:#26324f}
.day{grid-row:span 2;text-align:center;padding-right:10px;border-right:1.5px solid var(--line)}
.day b{display:block;font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.day small{font-size:10px;color:var(--sub);font-weight:800}
.gauge{font-size:10.5px;font-weight:800;color:var(--sub)}
.gauge .bar{height:7px;background:#e5e9f0;border-radius:6px;overflow:hidden;margin-top:2px}
body.night .gauge .bar{background:#26324f}
.gauge .bar i{display:block;height:100%;transition:width .5s}
.gauge span{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
body.night .gauge span,body.night .money b{color:#e6ecf8}
.money{font-size:10.5px;font-weight:800;color:var(--sub)}
.money b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}

.scene{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--accent);margin-top:6px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.card h2{font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-size:11px;color:var(--sub);font-weight:700}
.boss{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.boss .av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--boss);color:#fff;display:grid;place-items:center;font-size:22px}
.boss.angry .av{background:var(--ng)}
.boss .say{background:var(--panel);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14.5px;line-height:1.75}
.boss.angry .say{border-color:var(--ng)}
.boss .say b{display:block;font-size:10.5px;color:var(--sub)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.leak{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.leak:first-of-type{border:0}
.leak .ic{font-size:18px;flex:none;white-space:nowrap}
.leak small{display:block;color:var(--sub);font-size:12px;line-height:1.6;margin-top:2px}
.leak .d{margin-left:auto;font-weight:900;color:var(--ng);white-space:nowrap}
.learn{margin-top:8px;background:var(--acbg);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.75}
.learn b{color:var(--accent)}

/* 予報・図鑑 */
.fc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fc button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12.5px;font-weight:800;background:var(--panel)}
.fc button .n{font-size:11px;color:var(--ng);font-weight:900}
.fc button.new{border-color:var(--ng);background:var(--ngbg)}
.event{margin-top:8px;background:var(--ngbg);color:var(--ng);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:800}
.dex{margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbfd}
.dex h3{font-size:14px;font-weight:900}
.dex p{font-size:12.5px;color:var(--sub);margin-top:2px}
.dex .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;align-items:center}
.dex .row span{font-weight:900;font-size:11px;color:var(--sub);min-width:52px}
.dex .row i{font-style:normal;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--okbg);color:var(--ok)}
.dex .row i.in{background:var(--acbg);color:var(--accent)}

/* 盤面 */
.boardwrap{position:relative;margin-top:10px}
canvas{display:block;width:100%;border-radius:16px;touch-action:manipulation}
.boardbar{display:flex;gap:8px;align-items:center;margin-top:8px}
.boardbar .info{flex:1;font-size:12px;font-weight:800;color:var(--sub)}
body.night .boardbar .info{color:#93a1c2}
.pill{border-radius:99px;padding:6px 14px;font-weight:900;font-size:13px;background:#dfe5ef;color:var(--ink)}
.pill.on{background:var(--accent);color:#fff}
.inbox{margin-top:10px;min-height:150px}
.inbox .empty{display:grid;place-items:center;min-height:150px;border:2px dashed var(--line);border-radius:14px;color:var(--sub);font-size:13px;font-weight:800}
.call{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;animation:callIn .25s ease-out}
.call.ok{border-color:var(--ok);background:var(--okbg)}
.call.ng{border-color:var(--ng);background:var(--ngbg)}
@keyframes callIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.call .who{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--accent)}
.call .who span{color:var(--sub)}
.call .q{margin-top:4px;font-size:14.5px;font-weight:700;line-height:1.7}
.call .tb{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.call .tb i{display:block;height:100%;background:var(--accent)}
.call .ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.call .ans button{border:2px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:900;font-size:14px;background:var(--panel);line-height:1.4}
.call .r{font-size:13.5px;line-height:1.75;margin-top:6px}
.call .r b{font-size:15px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(13,20,36,.78);border-radius:16px;color:#e6ecf8;padding:20px}
.overlay h2{font-size:22px;font-weight:900}
.overlay p{font-size:13.5px;margin-top:8px;line-height:1.8;color:#b8c4de}

/* ショップ */
.dlist{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.def{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.def.on{border-color:var(--ok);background:#f6fcf9}
.def.alert{border-color:var(--ng);background:#fff7f8}
.def .ic{flex:none;font-size:22px;width:30px;text-align:center}
.def .tx{flex:1;min-width:0}
.def .tx b{font-size:13.5px;display:block;line-height:1.35}
.def .tx small{display:block;font-size:11px;color:var(--sub);line-height:1.45}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;font-weight:800;color:var(--sub)}
.tags i{font-style:normal;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 5px;background:#eef0f4;color:var(--sub)}
.tags i.hit{background:var(--okbg);color:var(--ok)}
.tags i.z{background:var(--ink);color:#fff}
.tags i.z.in{background:var(--accent)}
.tags i.f{background:var(--warnbg);color:var(--warn)}
.def .act{flex:none;min-width:66px;border-radius:10px;padding:7px 8px;font-weight:900;font-size:12.5px;background:var(--accent);color:#fff;line-height:1.25}
.def .act small{display:block;font-size:10px;font-weight:700;opacity:.9}
.def .act.off{background:#eef0f4;color:var(--sub)}
.uprow{flex-basis:100%;display:flex;gap:10px;align-items:center;margin-top:6px;padding:8px 10px;border-radius:10px;background:#fff8e1;border:1.5px dashed #e8c15a}
.uprow>div{flex:1;min-width:0}
.uprow b{font-size:12.5px;display:block}
.uprow small{display:block;font-size:11px;color:var(--sub);line-height:1.45}
.uprow.done{background:var(--okbg);border:0;color:var(--ok);font-size:12px;font-weight:900}
.uprow.lock{background:#f4f6fa;border:0;color:var(--sub);font-size:11px;font-weight:800}
.def .act:disabled{opacity:.35;pointer-events:none}
.go{display:block;width:100%;margin-top:14px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;border-radius:14px;padding:13px;box-shadow:0 4px 0 #000}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.go.blue{background:var(--accent);box-shadow:0 4px 0 #06408c}
.go:disabled{opacity:.4;pointer-events:none}
.placing{position:sticky;bottom:10px;z-index:25;margin-top:10px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
.placing span{flex:1}
.placing button{background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:900;font-size:12px}
.sel{margin-top:8px;border:1.5px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;background:var(--acbg)}
.sel span{flex:1}
.sel button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-weight:800;font-size:12px}

/* イベント */
.ev{margin-top:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.ev .kick{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--accent)}
.ev h2{font-size:19px;font-weight:900;margin-top:2px}
.ev .q{margin-top:10px;font-size:14.5px;line-height:1.85}
.ev .opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ev .opts button{text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:900;font-size:14px;background:var(--panel)}
.ev .res{margin-top:12px;background:#f4f6fa;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.8}

/* タイトル・エンディング */
.title{min-height:78vh;display:flex;flex-direction:column;justify-content:center}
.title .kick{font-size:11px;font-weight:900;letter-spacing:.25em;color:var(--accent)}
.title h1{font-size:clamp(36px,11vw,52px);font-weight:900;line-height:1.15;margin-top:6px;text-wrap:balance}
.title .lead{margin-top:14px;font-size:14.5px;font-weight:700;line-height:1.9}
.rules{margin-top:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.85}
.rules b{color:var(--accent)}
.note{margin-top:14px;font-size:11px;color:var(--sub);line-height:1.7}
.end h1{font-size:26px;font-weight:900;line-height:1.35;margin-top:10px}
.end .rank{display:inline-block;margin-top:8px;border:3px solid var(--accent);color:var(--accent);font-weight:900;font-size:18px;border-radius:10px;padding:3px 14px}
.end .rank.bad{border-color:var(--ng);color:var(--ng)}
.end .lead{margin-top:12px;font-size:14.5px;line-height:1.95}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.trio div{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px}
.trio b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.trio small{font-size:10.5px;color:var(--sub);font-weight:800}
.share{display:flex;gap:8px;margin-top:14px}
.share a,.share button{flex:1;text-align:center;text-decoration:none;font-weight:900;font-size:14px;border-radius:12px;padding:12px;background:#111;color:#fff}
.share button{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.fadein{animation:fi .3s ease-out}
@keyframes fi{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 簡素なメインUI */
.fcl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fcl .atk{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--panel)}
.fcl .atk .i{font-size:22px;line-height:1}
.fcl .atk .c{font-size:13px;font-weight:900;color:var(--sub)}
.fcl .atk.new{border-color:var(--ng);background:var(--ngbg)}
.fcl .atk.aim{border-color:var(--warn);background:var(--warnbg)}
.fcl .atk.less{opacity:.55}
.fcl .atk .m{font-size:11px;font-weight:900;color:var(--warn)}
.alert{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin-top:8px;background:var(--ngbg);color:var(--ng);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800}
.alert span{opacity:.7}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sgrp{font-size:11px;font-weight:900;color:var(--sub);margin-top:6px;letter-spacing:.05em}
.srow{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.srow.on{border-color:var(--ok);background:#f6fcf9}
.srow.alert{border-color:var(--ng);background:#fff7f8;color:inherit;margin:0;font-weight:inherit}
.srow .ic{font-size:24px;width:30px;text-align:center;flex:none}
.srow .nm{flex:1;min-width:0;font-weight:900;font-size:14.5px;line-height:1.3}
.srow .nm small{display:block;font-size:12px;color:var(--sub);font-weight:800}
.srow .i{color:var(--sub);font-size:14px}
.srow .act{flex:none;min-width:64px;border-radius:10px;padding:6px 8px;font-weight:900;font-size:13px;background:var(--accent);color:#fff;line-height:1.2}
.srow .act small{display:block;font-size:10.5px;font-weight:700;opacity:.9}
.srow .act.up{background:#e8a100}
.srow .act.warn{background:var(--ng)}
.srow .act:disabled{opacity:.35;pointer-events:none}
.srow .done{flex:none;min-width:64px;text-align:center;font-size:12px;font-weight:900;color:var(--ok)}
.rline{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
.rline:first-of-type{border:0}
.rline .g{flex:1;font-weight:800}
.rline b{color:var(--ng)}
.rline .fix{font-size:16px;min-width:46px;text-align:right}
.onrow{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;padding:7px 0;border-top:1px dashed var(--line)}
.onrow:first-of-type{border:0}
.onrow .o{font-size:12.5px;color:var(--sub);text-decoration:line-through;grid-column:1}
.onrow .n{font-size:14px;font-weight:900;grid-column:1}
.onrow em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:16px;min-width:22px;text-align:center}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bdg{position:relative;border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;color:var(--sub)}
.bdg .bi{font-size:22px;display:block;line-height:1.2}
.bdg b{display:block;font-size:13px;font-weight:900;line-height:1.35}
.bdg small{display:block;font-size:10.5px;line-height:1.45;margin-top:2px}
.bdg.on{border-style:solid;border-color:var(--accent);background:var(--acbg);color:var(--ink)}
.bdg.new{animation:pop .5s ease-out}
.bdg i{position:absolute;top:6px;right:8px;font-style:normal;font-size:10px;font-weight:900;color:#fff;background:var(--ng);border-radius:6px;padding:0 5px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.end .rank{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .5s 2}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,-1px)}80%{transform:translate(4px,1px)}}
body.crash{animation:redflash 1s}
@keyframes redflash{0%{background:#d7263d}100%{background:var(--bg)}}
.ransom{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#07090f;color:#ff4d61;border-radius:16px;padding:18px;animation:fi .4s}
.ransom .rk{font-size:46px}
.ransom .big{font-size:21px;font-weight:900;line-height:1.5;color:#fff;margin-top:4px}
.ransom p{font-size:13.5px;line-height:1.8;margin-top:8px}
.ransom .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.08em;color:#ff4d61;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.gogai{display:flex;margin-top:10px;background:#f6f1e3;color:#1a1a1a;border:2px solid #1a1a1a;border-radius:4px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;animation:fi .5s}
.gogai .gk{writing-mode:vertical-rl;background:#c3121f;color:#fff;font-weight:900;font-size:22px;padding:10px 8px;letter-spacing:.2em}
.gogai .gb{padding:10px 14px}
.gogai small{font-size:11px;color:#555}
.gogai h2{font-size:26px;font-weight:900;line-height:1.3;margin-top:2px}
.gogai p{font-size:14px;font-weight:700;margin-top:4px;border-top:1px solid #1a1a1a;padding-top:4px}
.breach{margin-top:8px;background:var(--warnbg);border-radius:10px;padding:8px 12px}
.breach div{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.breach b{font-size:14px;color:var(--ink)}
.breach span{font-size:13px;font-weight:900;color:var(--ng)}
.breach small{display:block;font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:2px}
.rline .sv{display:block;font-style:normal;font-size:11.5px;color:var(--ok);font-weight:900}
.call .saved{color:var(--ok);font-weight:800}
.calm{font-size:13px;color:var(--sub);margin-top:6px}

<script>
"use strict";
const GAME_URL = "https://red-freegames.github.io/hitori-joshisu/";
const DAYS = 7;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ============ 盤面の形（0〜1の座標） ============ */
const LANES = [
  { x: 1 / 6, ic: "📧", n: "メール" },
  { x: .5,    ic: "🔐", n: "ログイン" },
  { x: 5 / 6, ic: "🚪", n: "VPN" },
];
const TOP = .11, ENTRY_Y = .3, BOUND = .5, INSIDE_Y = .74, GOAL = .95;

/* ============ 攻撃 ============
   n: 画面に出す短い名前 / long: タップで読む説明
   入口の攻撃は、社内との境界を越えると「社内の姿」に変わる。bypass は入口の対策（Lv1）をすり抜ける */
const EN = {

    long: "ネットの被害でいちばん多い入口が、パスワードの盗難です。手口は大きく2つあります。ひとつは、宅配業者や銀行を名乗るSMS・メールで偽のログイン画面に誘い、本人に入力させるもの。もうひとつは、別のサービスから漏れたIDとパスワードの組み合わせを、ほかのサービスで自動的に試すもの（パスワードの使い回しを狙う）。どちらも攻撃者は「本人として」正面からログインしてくるので、普通のログインと見分けがつきにくいのが厄介です。" },
  pw2: { ic: "🎣", n: "コード横取り", lane: 1, spd: .055, to: "acct", bypass: true, base: "pw",
    long: "二段階認証を入れても安心しきれない理由がこれです。偽のログイン画面が、利用者の入力したパスワードと確認コードを、その場で本物のサイトへ中継してログインを横取りします。コードの有効期限が短くても、リアルタイムで中継されると間に合ってしまいます。偽サイトでは使えない仕組みの「パスキー」に切り替えると防げます。" },
  phish: { ic: "📧", n: "ウイルス付きメール", lane: 0, spd: .05, to: "mal",
    long: "取引先や宅配業者を装い、請求書や配送伝票に見せかけた添付ファイルやリンクを送ってくる手口です（フィッシングメール）。開くとPCがマルウェアに感染し、そこを足がかりに社内へ広がっていきます。企業の被害の入口として、昔から常に上位にあります。" },
  phish2: { ic: "🤖", n: "AI製の詐欺メール", lane: 0, spd: .05, to: "mal", bypass: true, base: "phish",
    long: "以前の詐欺メールは日本語の不自然さで見抜けましたが、生成AIの普及で、自然な日本語の文面を相手ごとに書き分けられるようになりました。決まった文面や単語で判定する古いフィルタでは止めにくくなっています。送り主が本物かどうかや、添付ファイルを開いたときのふるまいで判定する仕組みが必要です。" },
  vpn: { ic: "🚪", n: "機器の弱点", lane: 2, spd: .045, to: "mal",
    long: "在宅勤務などで社外から社内につなぐためのVPN機器は、ネットに常に公開されているため、攻撃者が真っ先に探す場所です。メーカーが弱点を直す更新を出しても、当てていなければ、その弱点を突かれて正面から入られます。国内企業のランサムウェア被害でも、侵入口として特に多いと報告されています。" },
  vpn2: { ic: "🕳️", n: "未知の弱点", lane: 2, spd: .045, to: "mal", bypass: true, base: "vpn",
    long: "メーカーもまだ把握していない、つまり直す更新がまだ存在しない弱点を「ゼロデイ」と呼びます。更新をきちんと当てていても防げません。機器そのものを外に公開しない仕組み（ゼロトラスト型の接続）に切り替えるか、入られたあとに社内で食い止める備えが必要です。" },
  supply: { ic: "🤝", n: "取引先経由", to: "mal", inside: true,
    long: "自社がしっかり守っていても、取引先や委託先、使っているソフトの提供元が先に乗っ取られると、そこからの「信頼された通り道」を使って入ってこられます。サプライチェーン攻撃と呼ばれ、セキュリティの甘い取引先を経由して大きな会社が被害を受ける例が相次いでいます。入口を通らないので、社内での検知と封じ込めが頼りです。" },
  usb: { ic: "🔌", n: "持ち込み", to: "mal",
    long: "拾ったUSBメモリを挿す、サポートの切れた古いPCを使い続ける、私物のPCを社内につなぐ。こうした「持ち込み」は、入口の対策を通らずに、いきなり社内に感染源を置くことになります。" },
  acct: { ic: "👤", n: "乗っ取りアカウント", spd: .05, goal: "情報流出", dmg: 7,
    long: "盗んだIDで入った攻撃者は、本物の社員として社内のファイルやメールを見て回り、顧客情報や機密を持ち出します。正規のアカウントなので、ふるまいの異常に気づかない限り見つけにくいのが特徴です。誰が何を見られるかを絞っておけば、1つ乗っ取られても被害は小さく済みます。" },
  mal: { ic: "🦠", n: "マルウェア", spd: .045, goal: "ランサムウェア", dmg: 13,
    long: "社内に入り込んだマルウェアは、ほかのPCやサーバーへと広がり、最後にデータを一斉に暗号化して「戻してほしければ身代金を払え」と要求します（ランサムウェア）。最近は、データを盗んだうえで「払わなければ公開する」と二重に脅す手口が主流です。業務が何週間も止まる被害も珍しくありません。" },
};
const OUTER = ["pw", "phish", "vpn"];
const NEWTYPE = ["pw2", "phish2", "vpn2"];

/* ============ 対策 ============
   1回導入すれば、そのレーンの決まった攻撃をすべて止める */
const TW = {
  mfa: { ic: "📱", n: "二段階認証", lane: 1, layer: "entry", cost: 20, hits: ["pw"],
    long: "ログインのとき、パスワードに加えて「本人のスマホに届くコード」や「アプリでの承認」を求める仕組みです。パスワードが盗まれたり漏れたりしても、スマホを持っていない攻撃者はログインできません。設定は数分で済み、効果が非常に大きい、まず最初にやるべき対策のひとつです。",
    up: { n: "パスキー", cost: 30, hits: ["pw2"],
      long: "パスワードの代わりに、スマホやPCに保存された「鍵」と、指紋や顔などの本人確認でログインする仕組みです。鍵は正しいサイトでしか使えないので、偽サイトに誘導されても鍵は渡らず、コードを中継する手口も効きません。パスワードを覚える必要もなくなります。" } },
  filter: { ic: "📨", n: "メールフィルタ", lane: 0, layer: "entry", cost: 20, hits: ["phish"],
    long: "届いたメールを受信箱に入れる前にチェックし、知られている詐欺メールや危険な添付ファイルをはじく仕組みです。社員一人ひとりの注意力に頼らずに、怪しいメールの大半を入口で止められます。",
    up: { n: "AI判定フィルタ", cost: 30, hits: ["phish2"],
      long: "文面の特徴だけでなく、送り主のドメインが本物か（なりすましの判定）、添付ファイルを安全な場所で試しに開いてどう動くか、などで判定します。AIで自然に書かれた詐欺メールでも、送り主や中身のふるまいはごまかしにくいため、止めやすくなります。" } },
  patch: { ic: "🔧", n: "機器の更新", lane: 2, layer: "entry", cost: 25, hits: ["vpn"],
    long: "機器やソフトのメーカーが配る、弱点をふさぐ更新（パッチ）を当てることです。地味ですが、被害の多くは「直す更新は出ていたのに当てていなかった」弱点から起きています。新しい弱点は次々に見つかるので、一度当てて終わりではなく、出るたびに当て続ける必要があります。",
    up: { n: "ゼロトラスト", cost: 40, hits: ["vpn2"],
      long: "「社内ネットワークの内側なら安全」という前提をやめ、接続のたびに、誰が・どの端末から・何にアクセスしようとしているかを確かめる考え方です（ゼロトラスト）。外に公開されたVPN機器をなくせるので、機器の未知の弱点を突く攻撃の的そのものがなくなります。弱点が見つかるたびの当て直しも不要になります。" } },
  perm: { ic: "🗂️", n: "権限の整理", lane: 1, layer: "inside", cost: 25, hits: ["acct"],
    long: "社員全員が全部のフォルダを見られる状態をやめ、仕事に必要な人だけが必要なデータを見られるように整理します。退職した人や使われていないアカウントを消すこともここに含まれます。アカウントが1つ乗っ取られても、見られる範囲が狭ければ被害は小さく済みます。" },
  edr: { ic: "🛡️", n: "監視ソフト", lane: [0, 2], layer: "inside", cost: 30, hits: ["mal"],
    long: "PCやサーバーの動きを常に見張り、「大量のファイルを一気に書き換える」「普段ありえない場所へ通信する」といった不審なふるまいを見つけて、自動で止めたり切り離したりするソフトです（EDR）。知られていないマルウェアでも、ふるまいで気づけるのが強みです。メールとVPN、どちらから入ったマルウェアにも効きます。" },
};
const TKEYS = Object.keys(TW);
const BACKUP = { ic: "💾", n: "バックアップ", cost: 15,
  long: "データのコピーを、ネットから切り離した場所に定期的に保管しておくことです。ネットにつながったままのバックアップは、ランサムウェアに一緒に暗号化されてしまうことがあります。攻撃を止める力はありませんが、やられても身代金を払わずに元に戻せる「最後の砦」です。ゲームでは🦠マルウェアの被害を1/4にします。現実では、本当に戻せるかをときどき試しておくことも大切です。" };
const TRAIN = { ic: "🎓", n: "社員研修", cost: 20,
  long: "怪しいメールの見分け方、パスワードの扱い、お金の話は折り返して確かめる、おかしいと思ったらすぐ報告する。こうした基本を、社員全員に定期的に教えることです。どんなに機械の対策を積んでも、最後に判断するのは人です。実際の被害も、社員のうっかりから始まるものが少なくありません。ゲームでは、あなたが返事できなかった📞問い合わせで、社員が自分で正しく判断できる確率が50%から80%に上がります。現実では、一度きりではなく、訓練メールなどで繰り返すことが大切です。" };
const lanesOf = k => [].concat(TW[k].lane);
const nameOf = k => S.up[k] ? TW[k].up.n : TW[k].n;
const hitsOf = k => TW[k].hits.concat(S.up[k] ? TW[k].up.hits : []);

/* ============ 日ごとの攻撃 ============ */
const WAVES = {
  1: { pw: 5 },
  2: { pw: 5, phish: 5 },
  3: { pw: 5, phish: 5, vpn: 4 },
  4: { pw: 4, pw2: 4, phish: 5, phish2: 3, vpn: 4 },
  5: { pw: 5, pw2: 4, phish: 5, phish2: 4, vpn: 4, supply: 3 },
  6: { pw: 5, pw2: 4, phish: 5, phish2: 4, vpn: 4, vpn2: 3, supply: 4 },
  7: { pw: 6, pw2: 5, phish: 6, phish2: 5, vpn: 5, vpn2: 4, supply: 6 },
};
const VULN_DAYS = [5];
const BREACH_DMG = 1, DAY_SCALE = .1, CALL_PEN = 12;   // CALL_PEN: まずい返事の後始末（強化で防げたときはなし）   // 社内まで入られたときの後始末 / 日ごとの被害の増え方
// 攻撃者は、入口で止められる攻撃を減らし、通る攻撃を増やしてくる（守りの薄いところを狙う）
function entryBlocked(k) { return EN[k].lane !== undefined && TKEYS.some(t => TW[t].layer === "entry" && hitsOf(t).includes(k) && active(t)); }
function waveNow() {
  const W = Object.assign({}, WAVES[S.day]), moved = {};
  const open = Object.keys(W).filter(k => EN[k].lane !== undefined && !entryBlocked(k));
  if (!open.length) return { W, moved };
  let pool = 0;
  Object.keys(W).filter(entryBlocked).forEach(k => { const m = Math.floor(W[k] / 3); W[k] -= m; pool += m; });
  for (let i = 0; pool > 0; i++, pool--) { const k = open[i % open.length]; W[k]++; moved[k] = (moved[k] || 0) + 1; }
  return { W, moved };
}

let S;
function fresh() {
  S = { day: 1, hp: 100, money: 0, budget: 40, own: {}, up: {}, backup: false, flags: {}, ko: 0, leaks: 0,
        spent: 0, vuln: false, seen: {}, extra: [], last: null, usedEv: {}, usedCall: {}, off: {}, calls: 0, callsOk: 0, callRes: {},
        st: { biz: 0, holes: 0, sur: 0, mitig: 0, inKO: 0, quiet: 0, autoOk: 0 } };
}

/* ============ 共通 ============ */
const G = {};
function render(html) {
  const v = $("view");

  v.classList.remove("fadein"); void v.offsetWidth; v.classList.add("fadein");
}
function hud() {

  $("hHpN").textContent = Math.max(0, Math.round(S.hp));
  const hp = $("hHp"); hp.style.width = clamp(S.hp, 0, 100) + "%";

  $("hLk").textContent = S.leaks + "件";
  $("hMo").textContent = S.money + "万円";
  $("hKo").textContent = S.ko + "件";
}
function active(k) { return S.own[k] && !S.off[k] && !(k === "patch" && S.vuln && !S.up.patch); }
// その攻撃を止められる対策（アイコン付きの短い名前）
function stoppers(type) {
  const r = [];
  TKEYS.forEach(k => {
    if (TW[k].hits.includes(type)) r.push(TW[k].ic + TW[k].n);
    if (TW[k].up && TW[k].up.hits.includes(type)) r.push(TW[k].ic + TW[k].up.n);
  });
  return r;
}
const chipsOf = (arr, cls = "") => arr.map(c => `<i class="${cls}">${c}</i>`).join("");

/* ---------- 説明パネル（タップで開く） ---------- */
function sheet(html) {
  closeSheet();
  const d = document.createElement("div");
  d.id = "sheet";

  document.body.appendChild(d);
}
function closeSheet() { const d = $("sheet"); if (d) d.remove(); }
G.closeSheet = closeSheet;
G.infoAtk = (k) => {
  const e = EN[k];
  let flow = "";
  if (k === "supply" || k === "usb") {
    flow = `<div class="flow"><div><span>入口</span><b>通らない</b></div><div><span>社内に直接</span><b>${EN.acct.ic}${EN.mal.ic} として現れる</b></div><div><span>止めるには</span>${chipsOf(stoppers("acct").concat(stoppers("mal")), "in")}</div></div>`;
  } else if (!e.to) {
    flow = `<div class="flow"><div><span>止めるには</span>${chipsOf(stoppers(k), "in")}</div></div>`;
  } else {
    const baseK = e.bypass ? TKEYS.find(t => TW[t].hits.includes(e.base)) : null;
    flow = `<div class="flow">
      <div><span>入口で止める</span>${e.bypass ? `<i class="ng">${TW[baseK].ic}${TW[baseK].n}はすり抜ける</i>` : ""}${chipsOf(stoppers(k))}</div>
      <div><span>抜けると社内で</span><b>${EN[e.to].ic}${EN[e.to].n}</b> に変わる</div>
      <div><span>社内で止める</span>${chipsOf(stoppers(e.to), "in")}${e.to === "mal" ? `<i class="in">💾で被害を軽く</i>` : ""}</div></div>`;
  }
  sheet(`<div class="shk">攻撃</div><h2>${e.ic} ${e.n}</h2><p class="long">${e.long}</p>${flow}`);
};
G.infoDef = (k) => {
  if (k === "train") {
    sheet(`<div class="shk">対策 ・ 人への投資</div><h2>${TRAIN.ic} ${TRAIN.n}</h2><p class="long">${TRAIN.long}</p>
      <div class="shbuy">${S.train ? `<button class="act off" disabled>実施済み</button>` : `<button class="act" ${S.money < TRAIN.cost ? "disabled" : ""} onclick="G.train();G.infoDef('train')">実施する　${TRAIN.cost}万円</button>`}</div>`);
    return;
  }
  if (k === "backup") {
    sheet(`<div class="shk">対策 ・ 最後の砦</div><h2>${BACKUP.ic} ${BACKUP.n}</h2><p class="long">${BACKUP.long}</p>
      <div class="shbuy">${S.backup ? `<button class="act off" disabled>導入済み</button>` : `<button class="act" ${S.money < BACKUP.cost ? "disabled" : ""} onclick="G.backup();G.infoDef('backup')">導入する　${BACKUP.cost}万円</button>`}</div>`);
    return;
  }
  const t = TW[k];
  const where = `${lanesOf(k).map(l => LANES[l].ic + LANES[l].n).join("・")}の${t.layer === "entry" ? "入口" : "社内"}`;

    const lines = L.leak.filter(x => x.from !== "call").map(x => `<button class="rline" onclick="G.infoAtk('${x.from}')"><span>${EN[x.from].ic}→${EN[x.as].ic}</span><span class="g">${x.call ? "📞" : ""}${EN[x.as].goal}${x.mit ? "（💾軽減）" : ""}</span><b>-${x.dmg}</b><span class="fix">${stoppers(x.from).concat(stoppers(x.as)).map(s => s.slice(0, 2)).filter((v, i, a) => a.indexOf(v) === i).join("")}</span></button>`).join("");
    const bad = (L.calls || []).filter(x => !x.ok);

    const clines = bad.map(x => { const c = CALLS.find(y => y.id === x.id); return `<button class="rline" onclick="G.infoCall('${c.id}')"><span>📞</span><span class="g">${c.who}「${c.bad}」${x.auto ? "（自己判断）" : ""}${x.saved ? `<em class="sv">⭐${TW[x.saved].up.n}で被害なし</em>` : ""}</span>${x.pen ? `<b>-${x.pen}</b>` : ""}<span class="fix">ⓘ</span></button>`; }).join("");

      ${L.breach ? `<div class="breach"><div><b>🚪→🧱 社内まで入られた ${L.breach}件</b><span>調査と対応で 体力 -${Math.round(L.breach * BREACH_DMG)}</span></div><small>社内で止めても、入られた時点で後始末が要る。入口で止めれば0。${S.own.mfa || S.own.filter || S.own.patch ? "すり抜け型は⬆強化で入口で止まる" : ""}</small></div>` : ""}
      ${lines ? `<p class="hint">右のアイコンは、止められた対策。タップで説明</p>` : ""}</div>`;
  }
  render(`<div class="scene">☀️ DAY ${S.day} ・ 朝 ・ 社長室</div>
    <div class="boss ${angry ? "angry" : ""}"><div class="av">👔</div><div class="say"><b>社長</b>${boss}</div></div>

    <button class="go" onclick="G.afterBoss()">自分の席に戻る ▶</button>`);
  window.scrollTo(0, 0);
};

function callsFor(day) {
  const n = Math.min(6, 2 + Math.ceil(day / 2));
  const pool = shuffle(CALLS.filter(c => day >= (c.min || 1)));
  // まだ出していないものを優先
  pool.sort((a, b) => (S.usedCall[a.id] || 0) - (S.usedCall[b.id] || 0));
  return pool.slice(0, n).map(c => { S.usedCall[c.id] = (S.usedCall[c.id] || 0) + 1; return c; });
}
G.infoCall = (id) => {

  sheet(`<div class="shk">問い合わせ ・ ${c.who}</div><h2>📞 ${c.q}</h2><p class="long">${c.long}</p>

  S.leaks += N.leak.length;
  if (N.surprise) S.st.sur++;
  if (!N.leak.length && S.day >= 2) S.st.quiet++;
  S.flags.intel = false;
  NT = null;
  if (S.hp <= 0) return G.end(false);
  if (S.day >= DAYS) return G.end(true);
  const ev = pickEvent();
  if (ev) { showEvent(ev); return; }
  G.nextDay();
}
G.nextDay = () => {
  const N = { leak: S.last.leak };
  if (N.leak.length > 0) S.budget = Math.min(70, Math.round(S.budget * 1.2) + 3);
  else S.budget = Math.max(30, Math.round(S.budget * .85));
  S.day++;
  S.money += S.budget;
  if (S.hp <= 0) return G.end(false);
  if (VULN_DAYS.includes(S.day) && S.own.patch && !S.up.patch && !S.flags.newvpn) S.vuln = true;
  G.morning();
}

/* ============ 称号 ============ */
const BADGES = [
  { id: "clear", ic: "🛡️", n: "生還", d: "7日間、会社を守り抜いた", ok: (w) => w },
  { id: "iron", ic: "🏰", n: "鉄壁のひとり情シス", d: "体力60以上でクリア", ok: (w) => w && S.hp >= 60 },
  { id: "call", ic: "📞", n: "問い合わせの鬼", d: "問い合わせ20件以上、正解率90%以上", ok: () => S.calls >= 20 && S.callsOk / S.calls >= .9 },
  { id: "layer", ic: "🧱", n: "多層防御の使い手", d: "社内で20件以上の攻撃を止めた", ok: () => S.st.inKO >= 20 },
  { id: "backup", ic: "💾", n: "最後の砦", d: "バックアップで3回以上被害を軽くした", ok: () => S.st.mitig >= 3 },
  { id: "train", ic: "🎓", n: "研修のたまもの", d: "研修のおかげで、社員が5回以上正しく判断した", ok: () => S.st.autoOk >= 5 },
  { id: "sur", ic: "⚠️", n: "予報は当てにならない", d: "予報にない攻撃を2回以上しのいだ", ok: (w) => S.st.sur >= 2 && (w || S.day >= 6) },
  { id: "passkey", ic: "🔑", n: "パスキー推進派", d: "二段階認証をパスキーに強化した", ok: () => !!S.up.mfa },
  { id: "zt", ic: "🌐", n: "ゼロトラスト導入", d: "機器の更新をゼロトラストに強化した", ok: () => !!S.up.patch },
  { id: "full", ic: "🧰", n: "全部入り", d: "すべての対策・強化・バックアップ・研修をそろえた", ok: () => TKEYS.every(k => S.own[k] && (!TW[k].up || S.up[k])) && S.backup && S.train },
  { id: "quiet", ic: "🌙", n: "誰にも褒められない", d: "被害ゼロの日が3日以上", ok: () => S.st.quiet >= 3 },
  { id: "thrift", ic: "💴", n: "倹約家", d: "使ったお金150万円以下でクリア", ok: (w) => w && S.spent <= 150 },
  { id: "doubt", ic: "🙅", n: "疑いすぎ注意", d: "慎重すぎて、仕事を2回以上止めた", ok: () => S.st.biz >= 2 },
  { id: "holes", ic: "🕳️", n: "穴だらけ", d: "問い合わせのミスで、入口に5回以上穴を開けた", ok: () => S.st.holes >= 5 },
  { id: "old", ic: "📼", n: "昔の常識の人", d: "「昔の常識」の問い合わせで3回以上まちがえた", ok: () => OLDNEW.filter(r => r[2] && S.callRes[r[2]] === false).length >= 3 },
  { id: "yes", ic: "🙇", n: "社長のイエスマン", d: "社長の二段階認証を外してあげた", ok: () => !!S.flags.no2fa },
  { id: "box", ic: "📦", n: "100%を信じた", d: "「完全防御ボックス」を買った", ok: () => !!S.flags.snake },
  { id: "dead", ic: "💀", n: "倒産", d: "会社を倒産させた", ok: (w) => !w },
];
const BKEY = "hitori-joshisu-badges";
function loadBadges() { try { return JSON.parse(localStorage.getItem(BKEY) || "{}") || {}; } catch (e) { return {}; } }
function saveBadges(o) { try { localStorage.setItem(BKEY, JSON.stringify(o)); } catch (e) {} }
function badgeGrid(have, fresh) {
  return `<div class="bgrid">${BADGES.map(b => have[b.id]
    ? `<div class="bdg on ${fresh && fresh[b.id] ? "new" : ""}"><span class="bi">${b.ic}</span><b>${b.n}</b><small>${b.d}</small>${fresh && fresh[b.id] ? `<i>NEW</i>` : ""}</div>`
    : `<div class="bdg"><span class="bi">？</span><b>？？？</b><small>${b.d}</small></div>`).join("")}</div>`;
}
G.badges = () => {
  const have = loadBadges();
  sheet(`<div class="shk">コレクション</div><h2>🏅 称号 ${BADGES.filter(b => have[b.id]).length}/${BADGES.length}</h2>
    <p class="long">プレイの結果に応じて、称号がもらえます。集めた称号は、このブラウザに保存されます。</p>${badgeGrid(have)}`);
};

/* ============ エンディング ============ */
G.end = (ok) => {
  stopNight();
  document.body.className = "";
  $("hud").classList.remove("on");
  const hp = Math.max(0, Math.round(S.hp));
  let rank, lead;
  if (!ok) { rank = "倒産"; lead = `${S.day}日目、会社の体力が尽きた。<br>攻撃者たちは、もう次の会社を探している。`; }
  else if (hp >= 60) { rank = "鉄壁のひとり情シス"; lead = "7日間、ほとんど何も起きなかった。<br>だから社長は、最後まで「本当に攻撃なんて来てるのか？」と言っていた。<br>それが、守る側の仕事の正体だ。"; }
  else if (hp >= 40) { rank = "現場の守護神"; lead = "いくつか被害は出た。それでも会社は回り続けた。"; }
  else if (hp >= 20) { rank = "満身創痍の情シス"; lead = "会社は生き残った。ぎりぎりで。<br>今日も社長室に呼ばれている。"; }
  else { rank = "首の皮一枚"; lead = "倒産だけは免れた。<br>机には、取引先へのお詫び状の束が残っている。"; }
  const got = BADGES.filter(b => b.ok(ok)), have = loadBadges(), fresh = {};
  got.forEach(b => { if (!have[b.id]) fresh[b.id] = true; have[b.id] = true; });
  saveBadges(have);
  const nHave = BADGES.filter(b => have[b.id]).length;
  const C = !ok && CRASH[(S.cause || { k: "mal" }).k];
  const gogai = C ? `<div class="gogai"><div class="gk">号外</div><div class="gb"><small>DAY ${S.day} ・ 社員30人の会社</small><h2>${C.head}</h2><p>${C.sub}</p></div></div>
    <div class="boss angry" style="margin-top:12px"><div class="av">👔</div><div class="say"><b>社長</b>${C.boss}</div></div>` : "";
  const text = `「ひとり情シス防衛戦」${ok ? "7日間を守り抜いた" : S.day + "日目に倒産した"}。\n称号【${rank}】${got.length ? " ほか" + got.map(b => b.ic).join("") : ""} 体力${hp} / 止めた攻撃${S.ko}件 / 問い合わせ正解${S.callsOk}/${S.calls}\n#ひとり情シス防衛戦`;
  const sheetRows = OUTER.map(k => {
    const nt = NEWTYPE.find(x => EN[x].base === k);
    return `<div class="crow"><button onclick="G.infoAtk('${k}')">${EN[k].ic}</button><span>→</span><b>${stoppers(k).map(s => s.slice(0, 2)).join("")}</b>
      <span class="sep"></span><button onclick="G.infoAtk('${nt}')">${EN[nt].ic}</button><span>→</span><b>${stoppers(nt).map(s => s.slice(0, 2)).join("")}</b>
      <span class="sep"></span><button onclick="G.infoAtk('${EN[k].to}')">${EN[EN[k].to].ic}</button><span>→</span><b>${stoppers(EN[k].to).map(s => s.slice(0, 2)).join("")}</b></div>`;
  }).join("");
  render(`<div class="end">
    ${gogai}
    <div class="rank ${ok ? "" : "bad"}">${rank}</div>
    <h1>${ok ? "7日間、守り抜いた。" : "会社は倒産した。"}</h1>
    <p class="lead">${lead}</p>
    <div class="trio">
      <div><b>${hp}</b><small>残った体力</small></div>
      <div><b>${S.ko}</b><small>止めた攻撃</small></div>
      <div><b>${S.leaks}</b><small>通した攻撃</small></div>
    </div>
    <div class="card"><h2>🏅 今回の称号<small>コレクション ${nHave}/${BADGES.length}</small></h2>
      ${got.length ? `<div class="bgrid">${got.map(b => `<div class="bdg on ${fresh[b.id] ? "new" : ""}"><span class="bi">${b.ic}</span><b>${b.n}</b><small>${b.d}</small>${fresh[b.id] ? `<i>NEW</i>` : ""}</div>`).join("")}</div>` : `<p class="calm">今回は称号なし。</p>`}
      <button class="pill" style="margin-top:10px;background:var(--acbg);color:var(--accent)" onclick="G.badges()">すべての称号を見る</button></div>
    <div class="card"><h2>📘 攻撃と対策<small>アイコンをタップで説明</small></h2>${sheetRows}
      <div class="crow"><button onclick="G.infoAtk('supply')">🤝</button><span>→</span><b>🗂️🛡️</b><span class="sep"></span><button onclick="G.infoDef('backup')">💾</button><span style="font-size:12px;color:var(--sub)">やられても戻せる</span></div>
      <p class="long" style="margin-top:12px">どんな対策にも、すり抜ける手口がある。だから入口で止めるだけでなく、社内で広げず、最後はバックアップで立ち直る。これを「多層防御」という。</p>
      <p class="long">現実で、個人がまずやるなら：二段階認証かパスキーを設定する。パスワードを使い回さない。更新はすぐ当てる。お金の話は折り返して確かめる。大事なデータはバックアップする。</p></div>
    <div class="card"><h2>📚 昔の常識 → いま<small>タップで説明</small></h2>${oldNewRows()}
      <p class="hint">⭕❌は、今回その問い合わせに答えた結果</p></div>
    <div class="share">
      <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(GAME_URL)}" target="_blank" rel="noopener">𝕏 結果をポスト</a>
      <button onclick="G.start()">もう一度</button>
    </div>
    <p class="note">このゲームはフィクションです。数値はゲーム用に単純化したものです。<br>実況・配信・動画投稿・収益化OK ／ <a href="https://red-freegames.github.io/">RED FREE GAMES</a> の他のゲームで遊ぶ</p>
  </div>`);
  window.scrollTo(0, 0);
};

window.addEventListener("resize", () => { if ($("cv")) { setupCanvas(!!NT); drawBoard(NT || undefined); } });
window.G = G;
G.title();

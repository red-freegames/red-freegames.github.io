<style>
/* 業務用コンソール風：淡いグレーの地に紺の文字、状態は信号色で示す */
:root{color-scheme:light;--bg:#e9edf3;--panel:#fff;--ink:#14213d;--sub:#5b6680;--line:#d3d9e4;--accent:#0a64d8;--acbg:#e3eefc;--ok:#14935a;--okbg:#e2f6ec;--ng:#d7263d;--ngbg:#fde6e9;--warn:#c27c00;--warnbg:#fff3d6;--boss:#2b2f3a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
a{color:inherit}
#wrap{max-width:560px;margin:0 auto;padding:10px 12px calc(170px + env(safe-area-inset-bottom,0px))}
.topnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.topnav button,.topnav a{color:var(--sub);border:1.5px solid currentColor;border-radius:99px;padding:3px 12px;text-decoration:none;font-size:12px;font-weight:800}

#hud{position:sticky;top:0;z-index:30;background:rgba(233,237,243,.95);backdrop-filter:blur(6px);padding:6px 0 8px;display:none}
#hud.on{display:block}
.hgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px}
.month{grid-row:span 2;text-align:center;padding-right:10px;border-right:1.5px solid var(--line)}
.month b{display:block;font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.month small{font-size:10px;color:var(--sub);font-weight:800}
.gauge{font-size:10.5px;font-weight:800;color:var(--sub)}
.gauge .bar{height:7px;background:#e5e9f0;border-radius:6px;overflow:hidden;margin-top:2px}
.gauge .bar i{display:block;height:100%;transition:width .5s}
.gauge span{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
.money{font-size:10.5px;font-weight:800;color:var(--sub)}
.money b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}

.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.card h2{font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-size:11px;color:var(--sub);font-weight:700}
.boss{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.boss .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--boss);color:#fff;display:grid;place-items:center;font-size:19px}
.boss .say{background:var(--panel);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 12px;font-size:13.5px}
.boss .say b{display:block;font-size:10.5px;color:var(--sub)}
.fc{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.fc:first-of-type{border-top:0}
.fc .tx{flex:1;min-width:0}
.fc .tx small{display:block;font-size:11px;color:var(--sub)}
.conf{flex:none;font-size:10.5px;font-weight:900;border-radius:99px;padding:2px 8px;background:var(--warnbg);color:var(--warn)}
.conf.hi{background:var(--ngbg);color:var(--ng)}
.event{margin-top:6px;background:var(--ngbg);color:var(--ng);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:800}

/* ネットワーク図 */
.mapwrap{position:relative;height:420px;margin-top:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap svg line{stroke:#c7cfdc;stroke-width:.6;stroke-dasharray:1.4 1}
.zone{position:absolute;left:6px;font-size:9.5px;font-weight:900;color:#a0a8b8;letter-spacing:.1em}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;min-height:66px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 3px;text-align:center;transition:border-color .2s,background .2s}

.node .tk{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px}
.node.entry{background:#f6f8fb}
.node.goal{border-style:double;border-width:4px}
.node.can{border-color:var(--accent);background:var(--acbg);animation:pulse .6s ease-in-out infinite alternate}
.node.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,33,61,.18)}

.tok.spawn{background:#a0a8b8}
.tok i{font-style:normal;opacity:.8;font-weight:700}

.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:12px;pointer-events:none;animation:up 1.1s ease-out forwards;white-space:nowrap;z-index:5;background:var(--panel);border-radius:6px;padding:0 4px}

/* ショップ */

.def .act.off{background:#eef0f4;color:var(--sub)}
.def .act:disabled{opacity:.35;pointer-events:none}
.go{display:block;width:100%;margin-top:14px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;border-radius:14px;padding:13px;box-shadow:0 4px 0 #000}

.go.blue{background:var(--accent);box-shadow:0 4px 0 #06408c}

.placing span{flex:1}
.placing button{background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:900;font-size:12px}

.ev{margin-top:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px}

.ev .opts button:active{border-color:var(--accent)}
.ev .res{margin-top:12px;background:#f4f6fa;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.8}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv b{font-variant-numeric:tabular-nums}

/* タイトル・エンディング */
.title{min-height:78vh;display:flex;flex-direction:column;justify-content:center}
.title .kick{font-size:11px;font-weight:900;letter-spacing:.25em;color:var(--accent)}
.title h1{font-size:clamp(36px,11vw,52px);font-weight:900;line-height:1.15;margin-top:6px;text-wrap:balance}
.title .lead{margin-top:14px;font-size:14.5px;font-weight:700;line-height:1.9}
.rules{margin-top:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.8}
.rules b{color:var(--accent)}
.note{margin-top:14px;font-size:11px;color:var(--sub);line-height:1.7}
.end h1{font-size:26px;font-weight:900;line-height:1.35;margin-top:10px}
.end .rank{display:inline-block;margin-top:8px;border:3px solid var(--accent);color:var(--accent);font-weight:900;font-size:18px;border-radius:10px;padding:3px 14px}

.end .lead{margin-top:12px;font-size:14.5px;line-height:1.95}

.trio div{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px}
.trio b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.trio small{font-size:10.5px;color:var(--sub);font-weight:800}
.tip{font-size:13.5px;padding:6px 0;border-top:1px dashed var(--line)}
.tip:first-of-type{border:0}
.share{display:flex;gap:8px;margin-top:14px}
.share a,.share button{flex:1;text-align:center;text-decoration:none;font-weight:900;font-size:14px;border-radius:12px;padding:12px;background:#111;color:#fff}
.share button{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.fadein{animation:fi .3s ease-out}
@keyframes fi{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ 社内ネットワーク ============

/* ============ 攻撃 ============ */

/* ============ 対策 ============

};
const GLOBAL = {
  vpnup: { ic: "🔧", n: "VPN機器の更新", d: "最新ならVPN狙いの攻撃は入口で止まる" },
  train: { ic: "🎓", n: "社員研修", d: "だまし系の攻撃を、入口とPCで毎ターン削る。効果は毎月薄れる", cost: 8, fr: 4 },
  soc:   { ic: "🌙", n: "24時間監視サービス", d: "潜伏型を常に見つけ、毎ターンの行動が+1", cost: 40, up: 10 },
  ins:   { ic: "📄", n: "サイバー保険", d: "被害額を半分に。防ぐ力はない", cost: 0, up: 6 },
};

let S;
function fresh() {
  S = { m: 1, hp: 100, budget: 50, left: 50, fr: 10, T: 0, trained: false, vpnOk: false, vpnOld: true,
        tw: [], soc: false, ins: false, snake: false, flags: {}, blocked: 0, hits: 0, spent: 0,
        boss: "", bmod: 0, plan: null, W: null, place: null, sel: null, usedEv: {} };
}
const has = (k, node) => S.tw.some(t => t.k === k && (!node || t.node === node));
const upkeep = () => S.tw.reduce((s, t) => s + DEF[t.k].up, 0) + (S.soc ? 10 : 0) + (S.ins ? 6 : 0) + (S.snake ? 15 : 0);
const pe = () => 1 - S.fr / 160;
const scale = () => 1 + (S.m - 1) * 0.07;
const goalDmg = node => Math.round(N[node].dmg * scale());
const isoCost = k => k === "server" ? 10 : k === "share" ? 6 : 4;
const apMax = () => 2 + (S.soc ? 1 : 0);

/* ============ 月の計画 ============ */
function planMonth() {
  const m = S.m;
  const pool = Object.keys(AT).filter(k => AT[k].from <= m);
  const n = m <= 2 ? 3 : m <= 5 ? 4 : m <= 8 ? 5 : 6;
  const real = [];
  const events = [];
  if (m === 7) events.push("AIで作られた自然な日本語の詐欺メールが急増。研修だけでは見抜きにくい（フィッシング・宅配SMSが強化）");
  if (m === 8) events.push("声をAIでまねる「なりすまし電話」が出回り始めた（社長なりすましが強化、研修が効かない）");
  if (!S.vpnOk && m >= 3) { real.push("vpn"); if (!S.vpnOld) events.push("VPN機器の弱点が公表されたまま。更新しないと狙われる"); }
  while (real.length < n) real.push(pick(pool));
  shuffle(real);
  const fc = [];
  real.forEach(k => { if (Math.random() < .7 && !fc.find(f => f.k === k)) fc.push({ k, conf: Math.random() < .7 ? "hi" : "mid" }); });
  if (Math.random() < .35) { const k = pick(pool); if (!fc.find(f => f.k === k)) fc.push({ k, conf: "mid" }); }
  S.plan = { real, fc, events };
}

function mapHTML() {

function paintMap() {
  const W = S.W;
  for (const k in N) {
    const el = $("nd_" + k);
    if (!el) continue;
    const tws = S.tw.filter(t => t.node === k).map(t => DEF[t.k].ic);
    if (k === "vpn") tws.unshift(S.vpnOk ? "🔧" : "⚠️");
    if (k === "mail" && S.snake) tws.push("📦");
    $("tw_" + k).textContent = tws.join("");
    let cls = "node" + (N[k].entry ? " entry" : "") + (N[k].goal ? " goal" : "");
    if (k === "vpn" && !S.vpnOk) cls += " weak";
    if (S.place && DEF[S.place].at.includes(k) && S.tw.filter(t => t.node === k).length < 3) cls += " can";
    if (S.sel === k) cls += " sel";
    let tk = "";
    if (W) {
      if (W.iso[k]) cls += " iso";
      const here = W.atk.filter(a => a.on && a.path[a.i] === k);
      if (here.some(a => !a.hidden)) cls += " hot";
      tk = here.map(a => a.hidden ? (a.hint ? `<span class="tok hint">❓</span>` : "") : `<span class="tok">${AT[a.t].ic}${a.str}<i>${progTxt(a)}</i></span>`).join("");
      const soon = W.atk.filter(a => !a.on && !a.done && a.path[0] === k && a.at === W.turn + 1);
      tk += soon.map(a => `<span class="tok spawn">${AT[a.t].ic}次</span>`).join("");
    }
    el.className = cls;
    $("tk_" + k).innerHTML = tk;
  }
}
function progTxt(a) {

function hardOf(k) { return N[k].hard + (k === "share" && has("perm", "share") ? 2 : 0); }

    ${S.soc ? `<button class="act off" onclick="G.toggle('soc')">解約</button>` : `<button class="act" ${S.left < 40 ? "disabled" : ""} onclick="G.toggle('soc')">導入<small>40万円</small></button>`}</div>`);
  rows.push(`<div class="def ${S.ins ? "on" : ""}"><div class="ic">${g.ins.ic}</div><div class="tx"><b>${g.ins.n}</b><small>${g.ins.d}</small><div class="tags"><i class="u">維持 6万/月</i></div></div>
    <button class="act ${S.ins ? "off" : ""}" onclick="G.toggle('ins')">${S.ins ? "解約" : "加入<small>来月から6万/月</small>"}</button></div>`);
  if (S.snake) rows.push(`<div class="def alert"><div class="ic">📦</div><div class="tx"><b>完全防御ボックス</b><small>営業マンに勧められた「AIが100%防ぐ」製品。中身はただの迷惑メールフィルタだった</small><div class="tags"><i class="u">維持 15万/月</i></div></div>

  if (k === "soc" && !S.soc) { if (S.left < 40) return; spend(40); }

G.tap = (k) => {
  if (S.W) return battleTap(k);
  if (S.place) {
    const d = DEF[S.place];
    if (!d.at.includes(k) || S.tw.filter(t => t.node === k).length >= 3) return;
    spend(d.cost);
    S.tw.push({ k: S.place, node: k });
    popAt(k, "配置 " + d.ic, "var(--accent)");
    S.place = null; $("placebar").innerHTML = "";
    S.sel = k;
    paintMap(); drawShop(); drawPrepPanel();

  }
  S.sel = S.sel === k ? null : k;
  paintMap(); drawPrepPanel();
};

/* ============ 迎撃フェーズ ============ */
G.battle = () => {
  S.place = null;
  const atk = S.plan.real.map((t, i) => {
    const path = AT[t].path.map(o => pick(o));
    let str = Math.round(AT[t].str * (1 + (S.m - 1) * 0.06));
    if (S.m >= 7 && (t === "phish" || t === "sms")) str += 1;
    if (S.m >= 8 && t === "bec") str += 2;
    if (t === "vpn" && S.flags.byod) str += 2;
    return { id: i, t, path, i: 0, prog: 0, str, at: 1 + Math.floor(i * 0.9 + rnd(0, 1.2)), on: false, done: false, hidden: !!AT[t].stealth, hint: false };
  });
  (S.extra || []).forEach(x => atk.push({ id: atk.length, t: x.t, path: x.path, i: 0, prog: 0, str: 5, at: 1, on: false, done: false, hidden: true, hint: false }));
  S.extra = [];
  S.W = { turn: 0, atk, ap: apMax(), iso: {}, log: [], dmg: 0, blk: 0, hit: 0, busy: false };
  S.sel = null;
  render(`${mapHTML()}
    <div class="turnbar"><div class="ap" id="ap"></div><button class="go blue" id="nextT" onclick="G.turn()">次のターン ▶</button></div>
    <div class="panel" id="bp"></div>
    <div class="log" id="log"></div>`);
  window.scrollTo(0, 0);
  G.turn();
};
function log(t) { S.W.log.unshift(t); $("log").innerHTML = S.W.log.slice(0, 6).map(x => `<div>${x}</div>`).join(""); }
function drawAP() {
  const W = S.W;
  $("ap").innerHTML = "行動" + Array.from({ length: apMax() }, (_, i) => `<i class="${i < W.ap ? "" : "off"}"></i>`).join("");
}
function towerDmg(a, k) {
  // その場所で、その攻撃者が毎ターン受けるダメージ
  let d = 0;
  const p = pe();
  for (const t of S.tw.filter(t => t.node === k)) {
    const D = DEF[t.k];
    let v = D.dmg;
    if (t.k === "pm" && a.t === "reuse") v = 3;
    if (t.k === "rule" && a.t !== "bec") v = 0;
    if (t.k === "filter" && k !== "mail") v = 0;
    if (t.k === "mfa" && S.flags.no2fa) v -= 1;
    if (D.people) v *= p;
    d += v;
  }
  if (k === "mail" && S.snake) d += 1;
  if (S.T && AT[a.t].lure && (N[k].entry || ["sales", "admin", "acct"].includes(k))) {
    let tv = S.T;
    if (S.m >= 7 && (a.t === "phish" || a.t === "sms")) tv *= .5;
    if (a.t === "bec" && S.m >= 8) tv = 0;
    d += tv * p;
  }
  return Math.floor(d + Math.random() * 0.999);   // 端数は確率で切り上げ
}
G.turn = async () => {
  const W = S.W;
  if (W.busy) return;
  W.busy = true;
  $("nextT").disabled = true;
  W.turn++;
  // 出現
  for (const a of W.atk) if (!a.on && !a.done && a.at === W.turn) {
    a.on = true;
    if (a.t === "vpn" && S.vpnOk) { a.on = false; a.done = true; W.blk++; S.blocked++; log(`🔧 VPN狙いの攻撃：機器が最新なので入り口がなかった`); popAt("vpn", "阻止", "var(--ok)"); continue; }
    if (!a.hidden) log(`${AT[a.t].ic} ${AT[a.t].n}が「${N[a.path[0]].n}」に来た（強さ${a.str}）`);
    if (a.hidden && (S.soc || has("edr", a.path[0]))) a.hidden = false;
  }
  paintMap();
  await sleep(350);
  // 対策が削る → 進む
  for (const a of W.atk.filter(a => a.on)) {
    const k = a.path[a.i];
    const d = towerDmg(a, k);
    if (d > 0) {
      a.str -= d;
      if (!a.hidden) popAt(k, "-" + d, "var(--ok)");
    }
    if (a.str <= 0) { a.on = false; a.done = true; W.blk++; S.blocked++; log(`🛡 ${a.hidden ? "何かが" : AT[a.t].n + "を"}「${N[k].n}」で止めた`); popAt(k, "阻止！", "var(--ok)"); continue; }
    a.prog++;
    if (a.prog >= hardOf(k)) {
      if (a.i === a.path.length - 1) {
        // 目的達成
        let dmg = goalDmg(k);
        const why = [];
        if (k === "server" && has("bk", "server")) { dmg = Math.round(dmg / 4); why.push("バックアップ"); }
        if (S.ins) { dmg = Math.round(dmg / 2); why.push("保険"); }
        a.on = false; a.done = true; W.hit++; S.hits++; W.dmg += dmg; S.hp -= dmg;
        log(`💥 ${AT[a.t].n}が「${N[k].n}」に到達。${N[k].gn}で体力 -${dmg}${why.length ? "（" + why.join("・") + "で軽減）" : ""}`);
        popAt(k, "被害 -" + dmg);
        continue;
      }
      const nx = a.path[a.i + 1];
      if (W.iso[nx]) { a.on = false; a.done = true; W.blk++; S.blocked++; log(`🔌 ${a.hidden ? "何か" : AT[a.t].n}が隔離された「${N[nx].n}」に進めず消えた`); continue; }
      a.i++; a.prog = 0;
      if (a.hidden && (S.soc || has("edr", nx))) { a.hidden = false; log(`🛡 監視が潜伏型を見つけた：「${N[nx].n}」`); }
    }
  }
  // 潜伏型のかすかな兆候
  W.atk.forEach(a => { if (a.on && a.hidden) a.hint = Math.random() < .45; });
  hud();
  W.ap = apMax();
  W.busy = false;
  const left = W.atk.some(a => !a.done);
  paintMap(); drawAP(); drawBattlePanel();
  if (!left || S.hp <= 0) { await sleep(700); return monthEnd(); }
  $("nextT").disabled = false;
};

function drawBattlePanel() {
  const W = S.W, k = S.sel, bp = $("bp");
  if (!bp) return;
  if (!k) {
    const coming = W.atk.filter(a => !a.on && !a.done).length;
    const visible = W.atk.filter(a => a.on && !a.hidden).length;
    bp.innerHTML = `<h3>ターン ${W.turn}<small>侵入中 ${visible}件・これから ${coming}件</small></h3>
      <p>赤い場所をタップして手を打とう。対策は毎ターン自動で攻撃を削る。数字は攻撃の強さ、「1/2」は攻略の進み具合。<br>黄色い❓は「何かいるかもしれない」兆候。</p>`;
    return;
  }
  const here = W.atk.filter(a => a.on && a.path[a.i] === k);
  const vis = here.filter(a => !a.hidden);
  const acts = [];
  const ap = W.ap;
  if (!N[k].entry && !W.iso[k]) {
    const cost = isoCost(k);
    acts.push(`<button class="red" ${ap < 1 ? "disabled" : ""} onclick="G.act('iso','${k}')">🔌 隔離する<small>中の攻撃を全部止める。業務停止で体力-${cost}・不満+3。今月はここを使えない</small></button>`);
  }
  acts.push(`<button ${ap < 1 ? "disabled" : ""} onclick="G.act('scan','${k}')">🔍 調査する<small>ここと隣の潜伏型を見つける</small></button>`);
  if (k === "cloud" || k === "login") acts.push(`<button ${ap < 1 ? "disabled" : ""} onclick="G.act('reset','${k}')">🔑 パスワードを強制リセット<small>ここの攻撃を-3。不満+2</small></button>`);
  if (k === "acct" || k === "phone") acts.push(`<button ${ap < 1 ? "disabled" : ""} onclick="G.act('call','${k}')">📞 社長に直接確認<small>なりすましを-4</small></button>`);
  if (["sales", "admin", "acct"].includes(k)) acts.push(`<button ${ap < 1 ? "disabled" : ""} onclick="G.act('warn','${k}')">📢 「そのメール開かないで」<small>ここのだまし系の攻撃を-2。不満+1</small></button>`);
  bp.innerHTML = `<h3>${N[k].ic} ${N[k].n}<small>${W.iso[k] ? "隔離中" : "攻略に" + hardOf(k) + "ターン"}</small></h3>
    ${N[k].goal ? `<p>到達されると「${N[k].gn}」：被害 ${goalDmg(k)}</p>` : ""}
    <div class="alist">${vis.length ? vis.map(a => `<div><span>${AT[a.t].ic} ${AT[a.t].n} ・ 次は ${a.i < a.path.length - 1 ? N[a.path[a.i + 1]].n : "被害"}</span><b>強さ ${a.str}（毎ターン -${estDmg(a, k)}前後）</b></div>`).join("") : `<div><span>${here.some(a => a.hint) ? "⚠ 何かいる気配がある" : "見える攻撃はない"}</span></div>`}</div>
    <div class="acts">${acts.join("")}<button class="sub" onclick="G.tap('${k}')">閉じる</button></div>`;
}
function estDmg(a, k) {
  let d = 0;
  for (let i = 0; i < 40; i++) d += towerDmg(a, k);
  return Math.round(d / 40);
}
function battleTap(k) {
  if (S.W.ended) return;
  S.sel = S.sel === k ? null : k;
  paintMap(); drawBattlePanel();
}
G.act = (type, k) => {
  const W = S.W;
  if (W.ap < 1 || W.busy) return;
  W.ap--;
  const here = W.atk.filter(a => a.on && a.path[a.i] === k);
  const kill = (a, why) => { a.on = false; a.done = true; W.blk++; S.blocked++; log(why); };
  if (type === "iso") {
    W.iso[k] = true;
    const cost = isoCost(k);
    S.hp -= cost; W.dmg += cost; S.fr = clamp(S.fr + 3, 0, 100);
    here.forEach(a => kill(a, `🔌 「${N[k].n}」を隔離して${a.hidden ? "潜んでいた何か" : AT[a.t].n}を止めた`));
    log(`🔌 「${N[k].n}」を隔離（業務停止で体力 -${cost}）`);
    popAt(k, "隔離", "var(--ink)");
  } else if (type === "scan") {
    const area = [k, ...(NB[k] || [])];
    let found = 0;
    W.atk.forEach(a => { if (a.on && a.hidden && area.includes(a.path[a.i])) { a.hidden = false; found++; } });
    log(found ? `🔍 調査で潜伏型を${found}件見つけた！` : `🔍 「${N[k].n}」の周辺を調べたが、何も見つからなかった`);
    popAt(k, found ? "発見！" : "異常なし", found ? "var(--ng)" : "var(--sub)");
  } else {
    const amt = type === "reset" ? 3 : type === "call" ? 4 : 2;
    const ok = a => type === "reset" || (type === "call" && a.t === "bec") || (type === "warn" && AT[a.t].lure);
    if (type === "reset") S.fr = clamp(S.fr + 2, 0, 100);
    if (type === "warn") S.fr = clamp(S.fr + 1, 0, 100);
    let hit = 0;
    here.filter(a => !a.hidden && ok(a)).forEach(a => {
      a.str -= amt; hit++;
      if (a.str <= 0) kill(a, `✅ ${AT[a.t].n}を「${N[k].n}」で止めた`);
    });
    const label = { reset: "強制リセット", call: "社長に確認", warn: "注意喚起" }[type];
    log(hit ? `${label}：-${amt}` : `${label}：効く相手がいなかった`);
    popAt(k, hit ? "-" + amt : "空振り", hit ? "var(--ok)" : "var(--sub)");
  }
  hud(); paintMap(); drawAP(); drawBattlePanel();
  if (!W.atk.some(a => !a.done)) setTimeout(monthEnd, 600);
};

/* ============ 月末 ============ */
function monthEnd() {
  const W = S.W;
  if (W.ended) return;
  W.ended = true;
  $("nextT") && ($("nextT").disabled = true);
  // 不満の増減・研修の減衰
  let fr = S.fr;
  S.tw.forEach(t => fr += DEF[t.k].fr || 0);
  fr -= 8; S.fr = clamp(fr, 0, 100);
  S.T = Math.max(0, S.T - 1);
  const prev = S.budget;
  let line;
  if (W.hit > 0) {
    S.budget = Math.min(100, Math.round(S.budget * 1.2));
    line = pick(["なんで防げなかったんだ！……わかった、予算は増やす。", "取引先に謝りに行ってきた。予算は出すから、なんとかしてくれ。", "ニュースで見てた話が、うちで起きるとはな……。予算を増やそう。"]);
  } else {
    S.budget = Math.max(25, Math.round(S.budget * .85));
    line = pick(["最近なにも起きてないじゃないか。セキュリティにお金かけすぎじゃないか？予算は少し減らすぞ。", "平和だな。ということは、もう対策は足りてるってことだろ？", "何も起きないなら、その予算は営業に回したいんだがね。"]);
  }
  if (S.fr >= 70) line += "　……あと、社員から「IT担当のルールが面倒すぎる」って苦情が来てるぞ。";
  S.boss = line;
  hud();
  const over = S.hp <= 0, clear = S.m >= 12;
  const bp = $("bp");
  bp.innerHTML = `<h3>📋 ${S.m}月のまとめ</h3>
    <div class="kv"><span>攻撃</span><b>${W.atk.length}件（止めた ${W.blk}件）</b></div>
    <div class="kv"><span>会社の体力</span><b>-${W.dmg}（残り ${Math.max(0, Math.round(S.hp))}）</b></div>
    <div class="kv"><span>社員の不満</span><b>${Math.round(S.fr)}</b></div>
    ${!over && !clear ? `<div class="kv"><span>来月の予算</span><b>${prev} → ${S.budget}万円（維持費 -${upkeep()}）</b></div>` : ""}
    <button class="go" onclick="G.after()">${over ? "……" : clear ? "1年を終える" : "次へ ▶"}</button>`;
  S.sel = null; paintMap();
  bp.scrollIntoView({ behavior: "smooth", block: "center" });
}
G.after = () => {
  if (S.hp <= 0) return G.end(false);
  if (S.m >= 12) return G.end(true);
  // 翌月の弱点公表
  if ([2, 5, 8, 10].includes(S.m) && !S.vpnOld) S.vpnOk = false;
  showEvent();
};

/* ============ イベント ============ */
const EV = [
  { id: "patch", prio: true, cond: () => !S.vpnOk && !S.vpnOld, kick: "緊急", title: "VPN機器に弱点が見つかった",
    q: "使っているVPN機器の弱点がニュースになった。今夜、全員の作業を止めれば無料で更新できる。",
    o: [["今夜、全員止めて更新する", () => { S.vpnOk = true; S.fr += 6; return "社員からは文句が出たが、入り口はふさがった。（不満 +6）"; }],
        ["来月、予算を使って昼間にやる", () => "更新には3万円かかる。それまでVPNは狙われ放題だ。"]] },
  { id: "boss2fa", cond: () => has("mfa") && !S.flags.no2fa, kick: "社長", title: "社長からの頼み",
    q: "「二段階認証、毎回スマホを出すのが面倒なんだ。俺のアカウントだけ外してくれないか？」",
    o: [["外してあげる", () => { S.flags.no2fa = true; S.bmod += 8; return "社長は上機嫌だ。来月の予算が少し増えた。……ただし、一番狙われるアカウントの守りに穴が空いた。（二段階認証の効果 -1）"; }],
        ["丁寧に断る", () => { S.bmod -= 5; return "「融通がきかないな」社長はむっとした。（来月の予算 -5万）"; }]] },
  { id: "usb", kick: "社員", title: "拾ったUSBメモリ",
    q: "「駐車場でUSBメモリを拾いました。誰のか、中身を見て確かめてもいいですか？」",
    o: [["見ていいよ", () => { S.extra = (S.extra || []).concat([{ t: "apt", path: ["sales", "server"] }]); return "中には「給与一覧.xlsx」というファイルがあった。開いた瞬間、何かが動いた気がする……。"; }],
        ["触らず捨てさせる", () => { S.fr += 3; return "「なんでですか、もったいない」少し不満そうだ。（不満 +3）"; }],
        ["研修のネタにする（3万円）", () => { S.bmod -= 3; S.T = Math.min(3, S.T + 1); return "拾ったUSBは挿さない。社員の意識が少し上がった。（研修効果 +1、来月の予算 -3万）"; }]] },
  { id: "snake", cond: () => !S.snake, kick: "営業電話", title: "「100%防ぐ」製品",
    q: "「AIがあらゆる攻撃を100%防ぐ『完全防御ボックス』！月額たったの15万円です。社長さんにもご案内済みです」",
    o: [["導入する", () => { S.snake = true; return "……届いた箱の中身は、ただの迷惑メールフィルタだった。毎月15万円の維持費がかかる。（対策の画面から解約できる）"; }],
        ["断る", () => "「100%防ぐ」製品は存在しない。正しい判断だ。"]] },
  { id: "invoice", kick: "経理", title: "振込先の変更",
    q: "経理「取引先から『振込先の口座が変わりました』とメールが来ました。来週の支払いから変えておきますね」",
    o: [["そのまま任せる", () => { const d = Math.round(14 * scale()); S.hp -= d; return `……取引先になりすました詐欺メールだった。支払いは戻ってこない。（体力 -${d}）`; }],
        ["取引先に電話で確認させる", () => { S.fr += 1; return "取引先は口座を変えていなかった。詐欺メールだった。危なかった。"; }]] },
  { id: "byod", cond: () => !S.flags.byod, kick: "社員", title: "在宅勤務の相談",
    q: "「家の私物パソコンでも仕事できるようにしてほしいです。みんなそう言ってます」",
    o: [["許可する", () => { S.flags.byod = true; S.fr -= 12; return "社員は大喜びだ。ただ、守れていないPCが社内につながるようになった。（不満 -12、VPN狙いの攻撃が強くなる）"; }],
        ["会社のPCを貸し出す（10万円）", () => { S.bmod -= 10; S.fr -= 6; return "少しお金はかかったが、安全に在宅できるようになった。（不満 -6、来月の予算 -10万）"; }],
        ["却下する", () => { S.fr += 8; return "「時代遅れですよ」……空気が悪くなった。（不満 +8）"; }]] },
  { id: "cutsoc", cond: () => S.soc, kick: "社長", title: "監視サービスは必要か",
    q: "「何も起きてないし、24時間監視は解約してもいいんじゃないか？月10万だぞ」",
    o: [["解約する", () => { S.soc = false; return "監視サービスを解約した。夜中に何かあっても、もう誰も気づかない。"; }],
        ["止めた攻撃の記録を見せて説得する", () => { S.bmod -= 3; return "「……そんなに来てたのか」社長はしぶしぶ納得した。ただ機嫌は悪い。（来月の予算 -3万）"; }]] },
  { id: "drill", kick: "提案", title: "訓練メール",
    q: "偽の詐欺メールを社員に送って、引っかかるか試す訓練ができる。費用は3万円。",
    o: [["実施する", () => { S.bmod -= 3; S.T = Math.min(3, S.T + 1); S.fr += 4; return "30人中7人がリンクを踏んだ。社員は少しムッとしたが、次は気をつけるはずだ。（研修効果 +1、不満 +4）"; }],
        ["やめておく", () => "今月は見送った。"]] },
  { id: "oldpc", kick: "社員", title: "古いパソコン",
    q: "「総務のパソコン、もうサポートが切れたWindowsらしいです。でも動くしいいですよね？」",
    o: [["買い替える（8万円）", () => { S.bmod -= 8; return "新しいPCに入れ替えた。（来月の予算 -8万）"; }],
        ["動くならそのままで", () => { S.extra = (S.extra || []).concat([{ t: "apt", path: ["admin", "share"] }]); return "更新されないPCは、攻撃者にとって鍵の開いたドアだ。……誰かがもう気づいたかもしれない。"; }]] },
];
function showEvent() {
  const elig = EV.filter(e => (!e.cond || e.cond()) && !S.usedEv[e.id]);
  const e = elig.find(x => x.prio) || pick(elig.filter(x => !x.prio).length ? elig.filter(x => !x.prio) : elig);
  if (!e) return nextMonth();
  if (!e.prio) S.usedEv[e.id] = true;
  S.curEv = e;
  hud();
  render(`<div class="ev"><div class="kick">${e.kick}からの相談</div><h2>${e.title}</h2><p class="q">${e.q}</p>
    <div class="opts" id="evo">${e.o.map((o, i) => `<button onclick="G.ev(${i})">${o[0]}</button>`).join("")}</div><div id="evr"></div></div>`);
  window.scrollTo(0, 0);
}
G.ev = (i) => {
  const r = S.curEv.o[i][1]();
  S.fr = clamp(S.fr, 0, 100);
  hud();
  $("evo").innerHTML = `<button disabled style="border-color:var(--accent)">${S.curEv.o[i][0]}</button>`;
  $("evr").innerHTML = `<div class="res">${r}</div><button class="go" onclick="G.next()">${S.hp <= 0 ? "……" : S.m + 1 + "月の準備へ ▶"}</button>`;
};
G.next = () => { if (S.hp <= 0) return G.end(false); nextMonth(); };
function nextMonth() {
  S.m++;
  S.budget = clamp(S.budget + S.bmod, 20, 100); S.bmod = 0;
  const up = upkeep();
  S.left = S.budget - up; S.spent += up;
  S.trained = false; S.lunched = false;
  if (S.left < 0) {
    const dropped = [];
    while (S.left < 0) {
      if (S.snake) { S.snake = false; S.left += 15; dropped.push("完全防御ボックス"); continue; }
      if (S.soc) { S.soc = false; S.left += 10; dropped.push("24時間監視"); continue; }
      if (S.ins) { S.ins = false; S.left += 6; dropped.push("保険"); continue; }
      const i = S.tw.findIndex(t => DEF[t.k].up);
      if (i < 0) { S.left = 0; break; }
      S.left += DEF[S.tw[i].k].up; dropped.push(DEF[S.tw[i].k].n); S.tw.splice(i, 1);
    }
    S.boss += `　維持費が予算を超えたので、${dropped.join("・")}は解約しておいたぞ。`;
  }
  planMonth();
  G.prep();
  window.scrollTo(0, 0);
}

/* ============ エンディング ============ */
G.end = (ok) => {
  $("hud").classList.remove("on");
  const hp = Math.max(0, Math.round(S.hp));
  let rank, lead;
  if (!ok) { rank = "倒産"; lead = `${S.m}月、会社の体力が尽きた。<br>攻撃者たちは、もう次の会社を探している。`; }
  else if (hp >= 80) { rank = "鉄壁のひとり情シス"; lead = "1年間、ほとんど何も起きなかった。<br>だから誰にも褒められなかった。<br>それが、守る側の仕事の正体だ。"; }
  else if (hp >= 55) { rank = "現場の守護神"; lead = "いくつか被害は出た。それでも会社は回り続けた。<br>完璧な守りは存在しない。止められる場所を、ひとつでも増やすことだ。"; }
  else if (hp >= 25) { rank = "満身創痍の情シス"; lead = "会社は生き残った。ぎりぎりで。<br>来年の予算会議は、たぶん今年の被害の話から始まる。"; }
  else { rank = "首の皮一枚"; lead = "倒産だけは免れた。<br>あなたの机には、取引先へのお詫び状の束が残っている。"; }
  const text = `「ひとり情シス防衛戦」${ok ? "12か月を守り抜いた" : S.m + "月に倒産した"}。\n称号【${rank}】 体力${hp} / 止めた攻撃${S.blocked}件\n#ひとり情シス防衛戦`;
  render(`<div class="end">
    <div class="rank ${ok ? "" : "bad"}">${rank}</div>
    <h1>${ok ? "12か月、守り抜いた。" : "会社は倒産した。"}</h1>
    <p class="lead">${lead}</p>
    <div class="trio">
      <div><b>${hp}</b><small>残った体力</small></div>
      <div><b>${S.blocked}/${S.blocked + S.hits}</b><small>止めた攻撃</small></div>
      <div><b>${S.spent}万</b><small>使った予算</small></div>
    </div>
    <div class="card"><h2>🛡 現実でも、まずはこの5つ</h2>
      <div class="tip">📱 <b>二段階認証・パスキー</b>を設定する。パスワードが漏れても入られにくい</div>
      <div class="tip">🗝️ <b>パスワードを使い回さない</b>。管理アプリを使えば覚えなくていい</div>
      <div class="tip">🔧 <b>更新はすぐ当てる</b>。スマホもPCも、ルーターも</div>
      <div class="tip">☎️ お金の依頼は<b>一度切って折り返す</b>。家族で合言葉を決める</div>
      <div class="tip">💾 大事なデータは<b>ネットから切り離してバックアップ</b></div>
    </div>
    <div class="share">
      <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(GAME_URL)}" target="_blank" rel="noopener">𝕏 結果をポスト</a>
      <button onclick="G.start()">もう一度</button>
    </div>
    <p class="note">このゲームはフィクションです。数値はゲーム用に単純化したものです。<br>実況・配信・動画投稿・収益化OK ／ <a href="https://red-freegames.github.io/">RED FREE GAMES</a> の他のゲームで遊ぶ</p>
  </div>`);
  window.scrollTo(0, 0);
};

window.G = G;
G.title();
</script>
</body>
